<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8fd3e8">
<title>Pocket Fishing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   STYLE 1. BASE & GAME FRAME
   ===================================================================== */
:root{
  --ink:#4a3434; --cream:#fff8ea; --paper:#fffdf6;
  --wood:#e2ad72; --wood-d:#b97a45; --wood-l:#f3cf9c;
  --red:#ef6b6b; --pink:#ffb3c4; --mint:#9fe3c2; --mint-d:#4fb787;
  --sky:#8fd3e8; --gold:#ffc93d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#5aaecb;
  font-family:'M PLUS Rounded 1c',system-ui,sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#game{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:var(--sky);box-shadow:0 0 50px rgba(0,0,0,.25)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.layer{position:absolute;inset:0;display:none}
.layer.on{display:block}
#fade{position:absolute;inset:0;background:var(--cream);opacity:0;pointer-events:none;transition:opacity .3s}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* =====================================================================
   STYLE 2. COMMON UI (buttons, coin pill)
   ===================================================================== */
button{font-family:inherit;color:var(--ink);border:3px solid var(--ink);border-radius:18px;background:var(--paper);
  font-weight:800;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button:disabled{opacity:.45;cursor:default;transform:none;box-shadow:0 5px 0 var(--ink)}
.coinbar{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;background:var(--paper);border:3px solid var(--ink);
  border-radius:99px;padding:3px 14px 3px 6px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:6px;pointer-events:none}
.coin{width:20px;height:20px;border-radius:50%;flex:none;display:inline-block;vertical-align:middle;
  background:radial-gradient(circle at 35% 35%,#fff3b0,var(--gold) 55%,#e0a21a);border:2px solid var(--ink)}
.coin.sm{width:14px;height:14px;border-width:1.5px}
.gold{color:#f0a91a;letter-spacing:1px}

/* =====================================================================
   STYLE 3. HUT MENU (pre-game)
   ===================================================================== */
#hutUI .menu{position:absolute;left:6%;right:6%;top:57%;bottom:calc(4% + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.25fr 1fr 1fr;gap:12px}
#hutUI .menu button{font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
#hutUI .menu .ic{font-size:26px;line-height:1.1}
#hutUI .menu .go{grid-column:1/3;background:var(--mint);font-size:22px}
#hutUI .menu .go .ic{font-size:32px}
#hutUI .menu .chr{grid-column:1/3;background:#ffe3ea;flex-direction:row;gap:10px}

/* =====================================================================
   STYLE 4. PANELS (collection / upgrade / character)
   ===================================================================== */
#panel{background:rgba(74,52,52,.35)}
#panel .sheet{position:absolute;left:4%;right:4%;top:calc(3% + env(safe-area-inset-top));bottom:calc(3% + env(safe-area-inset-bottom));
  background:var(--cream);border:3px solid var(--ink);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;animation:pop .25s}
#panel header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--wood);border-bottom:3px solid var(--ink)}
#panel header h2{margin:0;font-size:19px;flex:1}
#panel header .pc{background:var(--paper);border:2.5px solid var(--ink);border-radius:99px;padding:2px 10px 2px 4px;font-weight:800;display:flex;align-items:center;gap:5px;font-size:15px}
#panel .back{padding:5px 11px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
#panelBody{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch;touch-action:pan-y;position:relative}
.sum{text-align:center;font-weight:800;margin-bottom:8px}
.sec{font-weight:800;font-size:15px;margin:6px 2px 8px;display:flex;align-items:center;gap:6px}
.habh{margin:12px 0 8px;padding:4px 12px;border:2.5px solid var(--ink);border-radius:99px;font-size:14px;display:inline-block;color:#fff;text-shadow:0 1px 0 var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fcard{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:5px 4px 6px;text-align:center;font-size:11px;font-weight:700;cursor:pointer}
.fcard.unk{background:#efe8dc;cursor:default}
.fcard canvas{width:100%;height:auto;display:block}
.fcard .fn{font-weight:800;font-size:11.5px;line-height:1.2;min-height:2.4em;display:flex;align-items:center;justify-content:center}
.fcard .bs{color:#8a7a6a;font-size:10px}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:10px;margin-bottom:10px}
.row.eq{background:#e9fbf1;border-color:var(--mint-d)}
.row .ic{font-size:28px;width:36px;text-align:center}
.row .info{flex:1;font-size:12px;line-height:1.35}
.row .info b{font-size:14.5px}
.pips{margin-top:4px}
.pips span{display:inline-block;width:16px;height:8px;border-radius:4px;background:#e6dccd;border:1.5px solid var(--ink);margin-right:3px}
.pips span.on{background:var(--mint-d)}
.row button{padding:7px 10px;font-size:13px;border-radius:12px;box-shadow:0 3px 0 var(--ink);white-space:nowrap;display:flex;align-items:center;gap:4px}
.ccard{display:flex;gap:10px;align-items:center;background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:8px 10px;margin-bottom:10px}
.ccard.sel{background:#e9fbf1;border-color:var(--mint-d);box-shadow:0 0 0 3px var(--mint) inset}
.ccard canvas{width:84px;height:96px;flex:none}
.ccard .info{flex:1;font-size:12px;line-height:1.4}
.ccard .info b{font-size:17px}
.ccard .trait{display:inline-block;background:var(--gold);border:2px solid var(--ink);border-radius:99px;padding:0 8px;font-weight:800;font-size:11.5px;margin:2px 0}
.ccard button{padding:7px 10px;font-size:13px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.detail{position:absolute;left:10px;right:10px;top:10px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:14px;text-align:center;animation:pop .2s;box-shadow:0 8px 0 rgba(74,52,52,.25)}
.detail canvas{width:100%;max-width:260px;height:auto}
.detail h3{margin:2px 0 0;font-size:20px}
.detail .jp{font-size:13px;color:#8a7a6a}
.detail p{text-align:left;font-size:13px;background:#fff3dc;border:2px dashed var(--wood-d);border-radius:14px;padding:8px 10px;line-height:1.5}
.detail button{padding:7px 18px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}

/* =====================================================================
   STYLE 5. FISHING HUD
   ===================================================================== */
#fishHUD{pointer-events:none}
#fishHUD .hutBtn{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;pointer-events:auto;padding:5px 12px;font-size:14px;border-radius:14px;box-shadow:0 3px 0 var(--ink)}
#fishHUD .tag{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));background:var(--paper);border:2.5px solid var(--ink);border-radius:99px;padding:3px 10px;font-weight:800;font-size:13px}
#fishHUD .lure{left:10px}
#fishHUD .bucket{right:10px}

/* =====================================================================
   STYLE 6. RESULT CARD
   ===================================================================== */
#result{background:rgba(74,52,52,.4)}
#result.on{display:flex;align-items:center;justify-content:center}
#result .card{width:88%;max-width:380px;background:var(--paper);border:3px solid var(--ink);border-radius:26px;padding:14px 16px 16px;text-align:center;
  animation:pop .4s cubic-bezier(.3,1.6,.5,1);max-height:94%;overflow-y:auto}
#result .badges{display:flex;justify-content:center;gap:6px;min-height:22px;flex-wrap:wrap}
#result .badge{background:var(--red);color:#fff;border:2px solid var(--ink);border-radius:99px;padding:0 9px;font-weight:800;font-size:12.5px;animation:bounce 1s infinite}
#result .badge.b2{background:var(--gold);color:var(--ink)}
#result .badge.b3{background:#9b8cf2}
#result canvas{width:100%;max-width:300px;height:auto;display:block;margin:2px auto}
#result .stars{font-size:26px;line-height:1}
#result h2{margin:4px 0 0;font-size:22px}
#result .jp{font-size:13px;color:#8a7a6a}
#result .meta{display:flex;justify-content:center;gap:8px;margin:8px 0;flex-wrap:wrap}
#result .meta span{background:#fff;border:2px solid var(--ink);border-radius:99px;padding:2px 10px;font-weight:800;font-size:13px}
#result .trivia{text-align:left;font-size:13px;background:#fff3dc;border:2px dashed var(--wood-d);border-radius:14px;padding:8px 10px;line-height:1.5;margin:6px 0 10px}
#result .reward{font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:12px}
#result .btns{display:flex;gap:10px}
#result .btns button{flex:1;padding:10px 6px;font-size:15px}
#result .btns .again{background:var(--mint)}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>

  <!-- ============ HUT MENU (pre-game) ============ -->
  <div id="hutUI" class="layer">
    <div class="coinbar"><span class="coin"></span><span class="coinTxt">0</span></div>
    <div class="menu">
      <button class="go" data-act="fish"><span class="ic">🎣</span>Go Fishing</button>
      <button data-act="collection"><span class="ic">📖</span>Collection</button>
      <button data-act="upgrade"><span class="ic">🔧</span>Upgrade Rod</button>
      <button class="chr" data-act="character"><span class="ic">🐢</span>Character</button>
    </div>
  </div>

  <!-- ============ PANEL (collection / upgrade / character) ============ -->
  <div id="panel" class="layer">
    <div class="sheet">
      <header>
        <button class="back" id="panelBack">◀ Back</button>
        <h2 id="panelTitle">Title</h2>
        <div class="pc"><span class="coin sm"></span><span class="coinTxt">0</span></div>
      </header>
      <div id="panelBody"></div>
    </div>
  </div>

  <!-- ============ FISHING HUD ============ -->
  <div id="fishHUD" class="layer">
    <div class="coinbar"><span class="coin"></span><span class="coinTxt">0</span></div>
    <button class="hutBtn" id="hutBtn">🏠 Hut</button>
    <div class="tag lure" id="lureTag">⭕ No Attachment</div>
    <div class="tag bucket" id="bucketTag">🪣 0</div>
  </div>

  <!-- ============ RESULT CARD ============ -->
  <div id="result" class="layer">
    <div class="card">
      <div class="badges" id="rBadges"></div>
      <canvas id="rCanvas"></canvas>
      <div class="stars gold" id="rStars"></div>
      <h2 id="rName"></h2>
      <div class="jp" id="rJp"></div>
      <div class="meta"><span id="rSize"></span><span id="rHab"></span></div>
      <div class="trivia"><b>💡 Did you know?</b><br><span id="rTrivia"></span></div>
      <div class="reward">+<span class="coin"></span><span id="rCoins"></span></div>
      <div class="btns">
        <button class="again" id="btnAgain">🎣 Keep Fishing</button>
        <button id="btnHome">🏠 Hut</button>
      </div>
    </div>
  </div>

  <div id="fade"></div>
</div>

const hasSprite = ch => { const im = SPR[ch.id]; return !!(im && im.complete && im.naturalWidth); };
// draws a sprite with its feet at (cx, by), hgt tall, with a soft breathing squash
function drawSprite(c, ch, cx, by, hgt, t = 0){
  const im = SPR[ch.id], w = hgt * im.naturalWidth / im.naturalHeight, sq = Math.sin(t * 2.6) * .025;
  c.save(); c.translate(cx, by); c.scale(1 - sq, 1 + sq); c.drawImage(im, -w/2, -hgt, w, hgt); c.restore();
}

   ===================================================================== */
const game = document.getElementById('game');
const cv   = document.getElementById('cv');
const ctx  = cv.getContext('2d');
const fadeEl = document.getElementById('fade');
let W = 360, H = 640, S = 1, DPR = 1, T = 0;
let scene = 'title';

function resize(){
  let w = window.innerWidth, h = window.innerHeight;
  if (w / h > 0.6) w = Math.round(h * 0.5);          // desktop: keep a portrait phone frame
  W = w; H = h; S = W / 360;
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  game.style.width = w + 'px'; game.style.height = h + 'px';
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildWaves();
}
window.addEventListener('resize', resize);

const rand  = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp  = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn  = t => t * t * t;
const backOut = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const angLerp = (a, b, t) => { const d = ((b - a + Math.PI * 3) % TAU) - Math.PI; return a + d * Math.min(1, t); };
const FONT = "'M PLUS Rounded 1c',system-ui,sans-serif";

function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x+r, y); c.arcTo(x+w, y, x+w, y+h, r); c.arcTo(x+w, y+h, x, y+h, r); c.arcTo(x, y+h, x, y, r); c.arcTo(x, y, x+w, y, r); c.closePath(); }
function ell(c, x, y, rx, ry, rot = 0){ c.beginPath(); c.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, TAU); }
function fs(c, fill, lw){ c.fillStyle = fill; c.fill(); if (lw){ c.lineWidth = lw; c.strokeStyle = OUT; c.stroke(); } }
function txt(c, s, x, y, size, fill = '#fff', stroke = OUT, lw, align = 'center'){
  c.font = `800 ${size}px ${FONT}`; c.textAlign = align; c.textBaseline = 'middle'; c.lineJoin = 'round';
  if (stroke){ c.lineWidth = lw ?? size * 0.2; c.strokeStyle = stroke; c.strokeText(s, x, y); }
  c.fillStyle = fill; c.fillText(s, x, y);
}
function makeCanvas(w, h){
  const el = document.createElement('canvas'); el.width = w * 2; el.height = h * 2;
  const c = el.getContext('2d'); c.scale(2, 2); return { el, c };
}
function vibrate(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
const stars   = n => '★'.repeat(n) + '☆'.repeat(3 - n);
const fmtSize = cm => cm >= 100 ? (cm / 100).toFixed(2) + ' m' : cm.toFixed(1) + ' cm';

// ---- Sea wave arcs (shared) ----
let WAVES = [];
function buildWaves(){ WAVES = []; for (let i = 0; i < 34; i++) WAVES.push({ x:Math.random(), y:Math.random(), v:rand(4,12), r:rand(6,12), p:rand(0,TAU) }); }
function drawWaveArcs(c, t, y0, y1, alpha = .7){
  c.save(); c.strokeStyle = '#fff'; c.lineCap = 'round'; c.lineWidth = 2.2 * S;
  const span = W + 60 * S;
  for (const w of WAVES){
    const x = ((w.x * span + t * w.v * S) % span) - 30 * S;
    const y = y0 + w.y * (y1 - y0) + Math.sin(t * 1.4 + w.p) * 3 * S;
    c.globalAlpha = alpha * (0.45 + 0.45 * Math.sin(t * 1.1 + w.p));
    c.beginPath(); c.arc(x, y, w.r * S, Math.PI * 1.2, Math.PI * 1.8); c.stroke();
  }
  c.restore();
}

// ---- Effects: ripples & water drops (shared by fishing + catch scenes) ----
const FX = { ripples:[], drops:[] };
function ripple(x, y, max, life = .9, delay = 0){ FX.ripples.push({ x, y, max, life, t:-delay }); }
function splash(x, y, n, pow = 1){
  for (let i = 0; i < n; i++) FX.drops.push({ x, y, vx:rand(-1,1)*60*S*pow, vy:rand(-1,1)*45*S*pow, z:0, vz:rand(70,150)*S*pow, life:rand(.4,.8), t:0 });
}
function updFx(dt){
  for (const r of FX.ripples) r.t += dt;
  FX.ripples = FX.ripples.filter(r => r.t < r.life);
  for (const d of FX.drops){ d.t += dt; d.x += d.vx*dt; d.y += d.vy*dt; d.vz -= 420*S*dt; d.z = Math.max(0, d.z + d.vz*dt); }
  FX.drops = FX.drops.filter(d => d.t < d.life);
}
function drawFx(){
  ctx.save(); ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff';
  for (const r of FX.ripples){ if (r.t < 0) continue; const k = r.t / r.life;
    ctx.globalAlpha = (1 - k) * .8; ctx.lineWidth = 2.5*S*(1-k) + .5; ell(ctx, r.x, r.y, r.max*k, r.max*k*.8); ctx.stroke(); }
  for (const d of FX.drops){ ctx.globalAlpha = 1 - d.t / d.life; ctx.beginPath(); ctx.arc(d.x, d.y - d.z, 2.6*S, 0, TAU); ctx.fill(); }
  ctx.restore();
}

   JS 6. ART — fish, characters, props
   ===================================================================== */
// ---- 6a. Fish (faces right). L = total length in px. opt.sil = silhouette ----
const DOTS = [[.3,-.2],[-.1,-.28],[-.45,-.1],[.05,.05],[-.3,.18],[.45,-.05],[-.6,-.25],[.2,.22]];
function fishMarks(c, f, rx, h){
  c.lineWidth = Math.max(1, rx * .03);
  switch (f.mark){
    case 'bands':
      c.fillStyle = '#fff'; c.strokeStyle = OUT;
      for (const bx of [.6, .05, -.55]){ ell(c, bx*rx, 0, rx*.1, h*.62); c.fill(); c.stroke(); } break;
    case 'stripe':
      c.fillStyle = 'rgba(255,120,150,.6)'; c.fillRect(-rx, -h*.05, rx*2, h*.2);
      c.fillStyle = 'rgba(60,60,40,.35)'; for (const [dx,dy] of DOTS){ ell(c, dx*rx, dy*h - h*.05, rx*.03, rx*.03); c.fill(); } break;
    case 'spots':
      c.fillStyle = 'rgba(90,65,35,.45)'; for (const [dx,dy] of DOTS){ ell(c, dx*rx, dy*h*1.2 - h*.1, rx*.06, rx*.06); c.fill(); } break;
    case 'lights':
      c.save(); c.fillStyle = '#c8fbff'; c.shadowColor = '#7ff3ff'; c.shadowBlur = rx*.15;
      for (let i = 0; i < 7; i++){ ell(c, lerp(-rx*.7, rx*.5, i/6), h*.26, rx*.045, rx*.045); c.fill(); } c.restore(); break;
    case 'scutes':
      c.strokeStyle = 'rgba(70,90,110,.6)'; c.setLineDash([rx*.06, rx*.04]);
      c.beginPath(); c.moveTo(rx*.45, -h*.05); c.quadraticCurveTo(0, -h*.12, -rx*.95, 0); c.stroke(); c.setLineDash([]); break;
    case 'yellow':
      c.fillStyle = 'rgba(255,214,90,.85)'; ell(c, rx*.25, -h*.02, rx*.12, h*.14); c.fill(); break;
    case 'bluedots':
      c.fillStyle = 'rgba(90,170,255,.75)'; for (const [dx,dy] of DOTS){ if (dy < 0){ ell(c, dx*rx, dy*h, rx*.03, rx*.03); c.fill(); } } break;
    case 'redscale':
      c.fillStyle = 'rgba(230,80,70,.5)'; c.fillRect(-rx, -h/2, rx*.75, h); break;
    case 'oarspots':
      c.fillStyle = 'rgba(80,90,110,.45)'; for (let i = 0; i < 12; i++){ ell(c, lerp(-rx*.8, rx*.6, i/11), (i%2 ? -.1 : .12)*h, rx*.03, h*.12); c.fill(); } break;
    case 'whitespots':
      c.fillStyle = 'rgba(255,255,255,.7)'; for (const [dx,dy] of DOTS){ ell(c, dx*rx, dy*h, rx*.05, rx*.035); c.fill(); }
      for (const [dx,dy] of DOTS){ ell(c, dx*rx*.8 + rx*.12, dy*h*.6 + h*.12, rx*.03, rx*.025); c.fill(); } break;
    case 'scale':
      c.strokeStyle = 'rgba(255,255,255,.35)';
      for (let i = 0; i < 5; i++) for (let j = -1; j <= 1; j++){ c.beginPath(); c.arc(lerp(-rx*.6, rx*.3, i/4), j*h*.22, rx*.09, -1.2, 1.2); c.stroke(); } break;
    case 'koi':
      c.fillStyle = '#ff5a3c'; ell(c, rx*.42, -h*.18, rx*.24, h*.3); c.fill(); ell(c, -rx*.15, -h*.15, rx*.24, h*.3, .3); c.fill(); ell(c, -rx*.65, -h*.02, rx*.12, h*.2); c.fill();
      c.fillStyle = 'rgba(40,40,40,.7)'; ell(c, -rx*.4, h*.05, rx*.06, h*.1); c.fill(); break;
    case 'stripes':
      c.fillStyle = 'rgba(160,60,40,.55)'; for (let i = 0; i < 8; i++){ c.fillRect(lerp(-rx, rx*.7, i/7), -h/2, rx*.08, h); } break;
    case 'yline':
      c.fillStyle = 'rgba(255,214,60,.9)'; c.fillRect(-rx, -h*.07, rx*2, h*.14); break;
    case 'sardine':
      c.fillStyle = 'rgba(30,40,60,.55)'; for (let i = 0; i < 6; i++){ ell(c, lerp(rx*.3, -rx*.6, i/5), -h*.05, rx*.035, rx*.035); c.fill(); } break;
    case 'tang':
      c.fillStyle = 'rgba(20,30,60,.8)'; c.beginPath(); c.moveTo(rx*.55, -h*.2);
      c.quadraticCurveTo(-rx*.2, -h*.5, -rx*.85, -h*.08); c.quadraticCurveTo(-rx*.3, h*.05, rx*.1, -h*.05); c.quadraticCurveTo(rx*.45, -h*.02, rx*.55, -h*.2); c.fill(); break;
    case 'hexdots':
      c.fillStyle = 'rgba(40,30,20,.6)'; for (let i = -3; i <= 3; i++) for (let j = -1; j <= 1; j++){ ell(c, i*rx*.27 + (j%2 ? rx*.13 : 0), j*h*.28, rx*.04, rx*.04); c.fill(); } break;
  }
  // semi-3D highlight
  c.globalAlpha = .35; c.fillStyle = '#fff'; ell(c, rx*.1, -h*.24, rx*.5, h*.11); c.fill(); c.globalAlpha = 1;
}

// ---- 6a-2. Non-standard bodies (drawn centred) ----
const SPECIAL_FISH = {
  star(c, f, L, t, sil, col, lw, SO){
    c.rotate(Math.sin(t * 1.5) * .06);
    const R = L * .45, r = R * .45;
    c.beginPath(); for (let i = 0; i < 10; i++){ const a = -Math.PI/2 + i * Math.PI/5, d = i % 2 ? r : R; c.lineTo(Math.cos(a)*d, Math.sin(a)*d); } c.closePath();
    const g = c.createRadialGradient(0, 0, 0, 0, 0, R); g.addColorStop(0, col(f.c2)); g.addColorStop(1, col(f.c1));
    c.fillStyle = g; c.fill(); c.stroke();
    if (!sil){ c.fillStyle = 'rgba(255,255,255,.65)';
      for (let i = 0; i < 5; i++){ const a = -Math.PI/2 + i * TAU/5; for (let k = 1; k <= 3; k++){ ell(c, Math.cos(a)*R*k*.24, Math.sin(a)*R*k*.24, lw*.9, lw*.9); c.fill(); } } }
  },
  clione(c, f, L, t, sil, col, lw, SO){
    const fl = Math.sin(t * 6) * .5;
    c.globalAlpha = sil ? 1 : .93;
    for (const sx of [-1, 1]){ c.save(); c.translate(sx*L*.1, -L*.12); c.rotate(sx * (1 + fl * .5)); ell(c, 0, -L*.12, L*.06, L*.14); c.fillStyle = col(f.fin); c.fill(); c.stroke(); c.restore(); }
    c.beginPath(); c.moveTo(0, -L*.2); c.bezierCurveTo(L*.17, -L*.15, L*.12, L*.25, 0, L*.42); c.bezierCurveTo(-L*.12, L*.25, -L*.17, -L*.15, 0, -L*.2); c.closePath();
    c.fillStyle = col(f.c1); c.fill(); c.stroke();
    ell(c, 0, -L*.28, L*.11, L*.1); c.fillStyle = col(f.c1); c.fill(); c.stroke();
    if (!sil){ ell(c, 0, L*.03, L*.055, L*.085); c.fillStyle = f.c2; c.fill(); ell(c, 0, -L*.31, L*.045, L*.025); c.fillStyle = '#ffb07a'; c.fill(); }
    c.globalAlpha = 1;
  },
  seahorse(c, f, L, t, sil, col, lw, SO){
    c.rotate(Math.sin(t * 2) * .05);
    const tail = () => { c.beginPath(); c.moveTo(0, L*.12); c.quadraticCurveTo(-L*.03, L*.36, L*.09, L*.39); c.quadraticCurveTo(L*.19, L*.37, L*.12, L*.28); };
    tail(); c.lineWidth = L*.08 + lw*2; c.strokeStyle = SO; c.stroke(); tail(); c.lineWidth = L*.08; c.strokeStyle = col(f.c1); c.stroke();
    c.lineWidth = lw; c.strokeStyle = SO;
    ell(c, -L*.12, -L*.02, L*.05, L*.08); c.fillStyle = col(f.fin); c.fill(); c.stroke();
    ell(c, 0, -L*.04, L*.12, L*.2, -.15); c.fillStyle = col(f.c1); c.fill(); c.stroke();
    if (!sil){ c.strokeStyle = 'rgba(255,255,255,.55)'; for (let i = 0; i < 4; i++){ c.beginPath(); c.arc(-L*.02, -L*.14 + i*L*.07, L*.08, .2, 1.3); c.stroke(); } c.strokeStyle = SO;
      ell(c, L*.05, -L*.02, L*.05, L*.12, -.15); c.fillStyle = f.c2; c.fill(); }
    c.beginPath(); c.moveTo(L*.1, -L*.32); c.lineTo(L*.27, -L*.28); c.lineTo(L*.27, -L*.23); c.lineTo(L*.1, -L*.25); c.closePath(); c.fillStyle = col(f.c1); c.fill(); c.stroke();
    ell(c, L*.04, -L*.3, L*.1, L*.08, .3); c.fillStyle = col(f.c1); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-L*.02, -L*.37); c.lineTo(0, -L*.44); c.lineTo(L*.04, -L*.37); c.fillStyle = col(f.fin); c.fill(); c.stroke();
    if (!sil){ ell(c, L*.06, -L*.31, L*.028, L*.028); c.fillStyle = '#fff'; c.fill(); c.stroke(); ell(c, L*.065, -L*.31, L*.015, L*.015); c.fillStyle = OUT; c.fill(); }
  },
  ray(c, f, L, t, sil, col, lw, SO){
    const fl = Math.sin(t * 3) * L * .06;
    c.beginPath(); c.moveTo(-L*.25, 0); c.quadraticCurveTo(-L*.4, Math.sin(t*4)*L*.03, -L*.55, 0); c.lineWidth = lw * 1.3; c.stroke(); c.lineWidth = lw;
    c.beginPath(); c.moveTo(L*.3, -L*.07); c.quadraticCurveTo(L*.12, -L*.22, -L*.08, -L*.44 + fl); c.quadraticCurveTo(-L*.08, -L*.18, -L*.28, 0);
    c.quadraticCurveTo(-L*.08, L*.18, -L*.08, L*.44 - fl); c.quadraticCurveTo(L*.12, L*.22, L*.3, L*.07); c.closePath();
    c.fillStyle = col(f.c1); c.fill(); c.stroke();
    for (const sy of [-1, 1]){ ell(c, L*.33, sy*L*.07, L*.055, L*.022, sy*.3); c.fillStyle = col(f.c1); c.fill(); c.stroke(); }
    if (!sil){ c.fillStyle = f.c2; for (const sy of [-1, 1]){ ell(c, L*.08, sy*L*.1, L*.09, L*.035, sy*-.4); c.fill(); }
      c.globalAlpha = .3; ell(c, L*.05, -L*.18, L*.12, L*.05, -.6); c.fill(); c.globalAlpha = 1;
      for (const sy of [-1, 1]){ ell(c, L*.25, sy*L*.06, L*.012, L*.012); c.fillStyle = '#fff'; c.fill(); } }
  },
};

function drawFish(c, f, x, y, L, t = 0, opt = {}){
  const sil = !!opt.sil, lw = Math.max(1.5, L * .028), ty = f.type;
  const col = k => sil ? '#76838f' : k;
  const SO = sil ? '#56616b' : OUT;
  c.save(); c.translate(x, y); if (opt.rot) c.rotate(opt.rot);
  c.lineJoin = 'round'; c.lineCap = 'round'; c.lineWidth = lw; c.strokeStyle = SO;
  if (SPECIAL_FISH[ty]){ SPECIAL_FISH[ty](c, f, L, t, sil, col, lw, SO); c.restore(); return; }

  const h = L * f.h;
  const longT = ty === 'oar' || ty === 'eel' || ty === 'gulper';
  const rx = longT ? L*.46 : ty === 'rattail' ? L*.3 : ty === 'mola' ? L*.34 : L*.4;
  c.translate(ty === 'rattail' ? L*.18 : L*.08, 0);
  const wig = Math.sin(t * 9) * .12 * h;
  const strokeFill = (fill) => { c.fillStyle = fill; c.fill(); c.lineWidth = lw; c.strokeStyle = SO; c.stroke(); };

  // ---- TAIL ----
  if (ty === 'mola'){
    c.beginPath(); c.moveTo(-rx*.8, -h*.42);
    for (let i = 0; i <= 8; i++){ const a = -Math.PI/2 + i/8 * Math.PI; c.lineTo(-rx*.8 - Math.cos(a)*L*.1 - (i % 2 ? L*.025 : 0), Math.sin(a)*h*.42); }
    c.closePath(); strokeFill(col(f.fin));
  } else if (ty === 'rattail'){
    c.beginPath(); c.moveTo(-rx*.5, -h*.32); c.quadraticCurveTo(-rx - L*.18, wig*.5, -rx - L*.4, wig); c.quadraticCurveTo(-rx - L*.18, wig*.5, -rx*.5, h*.32); c.closePath(); strokeFill(col(f.c1));
  } else if (ty === 'shark' || ty === 'sword'){
    const tl = L*.17; c.beginPath(); c.moveTo(-rx*.85, -h*.12); c.lineTo(-rx - tl, -h*1.0 + wig); c.quadraticCurveTo(-rx - tl*.35, 0, -rx - tl*.7, h*.6 + wig); c.lineTo(-rx*.85, h*.12); c.closePath();
    strokeFill(col(f.fin));
  } else {
    const tl = longT ? L*.06 : ty === 'fan' ? L*.28 : L*.16, th = ty === 'fan' ? 1.3 : .5;
    c.beginPath(); c.moveTo(-rx*.85, 0);
    c.quadraticCurveTo(-rx - tl*.5, -h*.2, -rx - tl, -h*th + wig);
    c.quadraticCurveTo(-rx - tl*.45, 0, -rx - tl, h*th + wig);
    c.quadraticCurveTo(-rx - tl*.5, h*.2, -rx*.85, 0); c.closePath();
    strokeFill(col(ty === 'redtail' ? '#e8574f' : f.fin));
  }

  // ---- FINS behind the body ----
  c.fillStyle = col(f.fin);
  if (ty === 'oar'){
    c.beginPath(); c.moveTo(-rx*.9, -h*.35);
    for (let i = 0; i <= 14; i++){ const px = lerp(-rx*.9, rx*.85, i/14); c.lineTo(px, -h*.5 - (i%2 ? h*.9 : h*.45) - Math.sin(t*6 + i)*h*.12); }
    c.lineTo(rx*.85, -h*.35); c.closePath(); strokeFill(col('#ff5a5a'));
    c.beginPath(); c.moveTo(rx*.8, -h*.4); c.quadraticCurveTo(rx*.95, -h*3.2, rx*.7, -h*3.6); c.lineWidth = lw*1.6; c.strokeStyle = col('#ff5a5a'); c.stroke(); c.lineWidth = lw; c.strokeStyle = SO;
  } else if (longT){
    c.beginPath(); c.moveTo(-rx*.95, -h*.2); c.quadraticCurveTo(-rx*.2, -h*1.25, rx*.35, -h*.3); c.closePath(); strokeFill(col(f.fin));
    c.beginPath(); c.moveTo(-rx*.95, h*.2); c.quadraticCurveTo(-rx*.3, h*1.05, rx*.1, h*.3); c.closePath(); strokeFill(col(f.fin));
  } else if (ty === 'tuna' || ty === 'sword'){
    c.beginPath(); c.moveTo(-L*.12, -h*.4); c.lineTo(-L*.02, -h*(ty === 'sword' ? 1.3 : .95)); c.lineTo(L*.08, -h*.42); c.closePath(); strokeFill(col(f.fin));
    c.fillStyle = col('#ffd84d');
    for (let i = 0; i < 4; i++){ const px = lerp(-rx*.35, -rx*.8, i/3);
      c.beginPath(); c.moveTo(px, -h*.3); c.lineTo(px - L*.02, -h*.45); c.lineTo(px - L*.04, -h*.27); c.fill();
      c.beginPath(); c.moveTo(px, h*.3); c.lineTo(px - L*.02, h*.45); c.lineTo(px - L*.04, h*.27); c.fill(); }
  } else if (ty === 'shark'){
    c.beginPath(); c.moveTo(-L*.1, -h*.4); c.lineTo(-L*.04, -h*1.15); c.lineTo(L*.08, -h*.42); c.closePath(); strokeFill(col(f.fin));
    c.beginPath(); c.moveTo(-rx*.55, -h*.35); c.lineTo(-rx*.62, -h*.7); c.lineTo(-rx*.45, -h*.38); c.closePath(); strokeFill(col(f.fin));
  } else if (ty === 'mola'){
    c.beginPath(); c.moveTo(-rx*.6, -h*.38); c.lineTo(-rx*.75, -h*1.05); c.lineTo(-rx*.3, -h*.42); c.closePath(); strokeFill(col(f.fin));
    c.beginPath(); c.moveTo(-rx*.6, h*.38); c.lineTo(-rx*.75, h*1.05); c.lineTo(-rx*.3, h*.42); c.closePath(); strokeFill(col(f.fin));
  } else if (ty === 'lion'){
    for (let i = 0; i < 8; i++){ const px = lerp(-rx*.7, rx*.45, i/7), tipY = -h*(1.15 + (i%2)*.3) + Math.sin(t*3 + i)*h*.05;
      c.beginPath(); c.moveTo(px, -h*.35); c.lineTo(px - L*.05, tipY); c.lineWidth = lw*2.4; c.strokeStyle = SO; c.stroke(); c.lineWidth = lw*1.2; c.strokeStyle = col(i%2 ? '#fff3ea' : f.fin); c.stroke(); }
    c.lineWidth = lw; c.strokeStyle = SO;
  } else if (ty !== 'flat' && ty !== 'rattail' && ty !== 'box'){
    c.beginPath(); c.moveTo(-L*.18, -h*.4); c.quadraticCurveTo(-L*.02, -h*.95, L*.12, -h*.42); c.closePath(); strokeFill(col(f.fin));
  }
  if (ty === 'flat' || ty === 'rattail'){
    c.beginPath(); c.moveTo(-rx*.95, -h*.15); c.quadraticCurveTo(-rx*.1, -h*.9, rx*.6, -h*.3); c.closePath(); strokeFill(col(f.fin));
    c.beginPath(); c.moveTo(-rx*.95, h*.15); c.quadraticCurveTo(-rx*.1, h*.9, rx*.5, h*.3); c.closePath(); strokeFill(col(f.fin));
  }
  // under fin
  if (ty === 'lobe'){ for (const fx of [.15, -.35]){ ell(c, fx*rx, h*.5, rx*.14, h*.2, .5); strokeFill(col(f.fin)); } }
  else if (!longT && ty !== 'mola' && ty !== 'flat' && ty !== 'rattail' && ty !== 'shark'){
    c.beginPath(); c.moveTo(-L*.02, h*.38); c.quadraticCurveTo(L*.02, h*.78, L*.1, h*.4); c.closePath(); strokeFill(col(f.fin));
  }
  if (ty === 'puffer'){
    for (let i = 0; i < 18; i++){ const a = i / 18 * TAU; const ex = Math.cos(a)*rx, ey = Math.sin(a)*h/2;
      c.beginPath(); c.moveTo(ex*.92 - Math.sin(a)*rx*.06, ey*.92 + Math.cos(a)*h*.06); c.lineTo(ex*1.18, ey*1.18); c.lineTo(ex*.92 + Math.sin(a)*rx*.06, ey*.92 - Math.cos(a)*h*.06); strokeFill(col('#e9dcb0')); }
  }
  // snouts / bills that sit behind the head
  if (ty === 'shark' && f.snout){ ell(c, rx*.75 + L*f.snout*.5, -h*.06, L*f.snout*.6 + rx*.1, h*.17, -.04); strokeFill(col(f.c1)); }
  if (ty === 'sword'){ c.beginPath(); c.moveTo(rx*.8, -h*.1); c.lineTo(rx + L*.36, -h*.02); c.lineTo(rx*.8, h*.08); c.closePath(); strokeFill(col(f.c1)); }

  // ---- BODY ----
  const bodyPath = () => { if (ty === 'box') rr(c, -rx, -h/2, rx*2, h, h*.32); else ell(c, 0, 0, rx, h/2); };
  const g = c.createLinearGradient(0, -h/2, 0, h/2); g.addColorStop(0, col(f.c1)); g.addColorStop(1, col(f.c2));
  bodyPath(); c.fillStyle = g; c.fill();
  if (!sil){ c.save(); bodyPath(); c.clip(); fishMarks(c, f, rx, h); c.restore(); }
  bodyPath(); c.lineWidth = lw; c.strokeStyle = SO; c.stroke();
  if (ty === 'shark'){ c.lineWidth = lw*.7; for (let i = 0; i < 4; i++){ const gx = rx*(.42 - i*.07); c.beginPath(); c.moveTo(gx, -h*.18); c.lineTo(gx - rx*.03, h*.15); c.stroke(); } }
  else if (!longT && ty !== 'box' && ty !== 'barrel'){ c.beginPath(); c.arc(rx*.55, 0, h*.38, Math.PI*.7, Math.PI*1.3); c.lineWidth = lw*.7; c.stroke(); }
  c.lineWidth = lw;

  // ---- FINS in front ----
  if (ty === 'wing'){ const fl = Math.sin(t * 6) * h * .3;
    c.save(); c.globalAlpha = sil ? 1 : .88; c.beginPath(); c.moveTo(rx*.35, -h*.05); c.quadraticCurveTo(-rx*.15, -h*2.4 + fl, -rx*.95, -h*1.7 + fl);
    c.quadraticCurveTo(-rx*.35, -h*.75, rx*.1, h*.12); c.closePath(); strokeFill(col(f.fin));
    if (!sil){ c.strokeStyle = 'rgba(255,255,255,.6)'; for (let i = 1; i < 4; i++){ c.beginPath(); c.moveTo(rx*.25, 0); c.lineTo(lerp(-rx*.2, -rx*.9, i/4), -h*(2 - i*.25) + fl); c.stroke(); } }
    c.restore(); c.strokeStyle = SO; }
  if (ty === 'lion'){
    for (let i = 0; i < 6; i++){ const a = Math.PI*.55 + i*.13 + Math.sin(t*2)*.04;
      c.beginPath(); c.moveTo(rx*.25, h*.1); c.lineTo(rx*.25 + Math.cos(a)*L*.34, h*.1 + Math.sin(a)*L*.34);
      c.lineWidth = lw*3; c.strokeStyle = SO; c.stroke(); c.lineWidth = lw*1.6; c.strokeStyle = col(i%2 ? '#fff3ea' : '#d9785a'); c.stroke(); }
    c.lineWidth = lw; c.strokeStyle = SO;
  }
  if (ty === 'tripod'){
    for (const [x0, x1] of [[-rx*.1, -rx*.35], [rx*.15, rx*.05], [-rx*.95, -rx - L*.1]]){
      c.beginPath(); c.moveTo(x0, h*.4); c.lineTo(x1, h*2.1); c.lineWidth = lw*1.8; c.strokeStyle = SO; c.stroke(); c.lineWidth = lw*.8; c.strokeStyle = col(f.c2); c.stroke(); }
    c.lineWidth = lw; c.strokeStyle = SO;
  }

  // ---- HEAD extras ----
  if (ty === 'whiskers'){
    c.beginPath(); c.moveTo(rx*.95, h*.05); c.quadraticCurveTo(rx*1.3, h*.1, rx*1.25, h*.6);
    c.moveTo(rx*.95, -h*.02); c.quadraticCurveTo(rx*1.35, -h*.15, rx*1.4, h*.25); c.stroke();
  }
  if (ty === 'shark' && f.snout >= .1){ c.beginPath(); c.moveTo(rx*1.05, h*.12); c.quadraticCurveTo(rx*1.2, h*.4, rx*1.1, h*.6); c.moveTo(rx*1.12, h*.1); c.quadraticCurveTo(rx*1.3, h*.35, rx*1.25, h*.55); c.stroke(); }
  if (ty === 'angler'){
    c.beginPath(); c.moveTo(rx*.4, -h*.45); c.quadraticCurveTo(rx*.9, -h*1.1, rx*1.2, -h*.55); c.stroke();
    c.save(); if (!sil){ c.shadowColor = '#fff6a8'; c.shadowBlur = L*.15; }
    ell(c, rx*1.2, -h*.5, L*.045, L*.045); strokeFill(col('#fff6a8')); c.restore();
  }
  if (ty === 'angler' || ty === 'fang'){
    const big = ty === 'fang' && f.h > .4;
    if (!sil){ c.fillStyle = '#fff';
      const n = big ? 4 : 5;
      for (let i = 0; i < n; i++){ const px = lerp(rx*.55, rx*.98, i/(n-1)), up = i % 2;
        c.beginPath(); c.moveTo(px - L*.02, up ? h*.28 : h*.05); c.lineTo(px, up ? -h*(big ? .05 : .02) : h*(big ? .45 : .3)); c.lineTo(px + L*.02, up ? h*.28 : h*.05); c.closePath(); c.fill(); c.lineWidth = lw*.6; c.stroke(); } }
    c.lineWidth = lw; c.beginPath(); c.moveTo(rx*.5, h*.15); c.lineTo(rx*1.02, h*.15); c.stroke();
  }
  if (ty === 'gulper'){
    c.beginPath(); c.moveTo(rx*.55, -h*.2); c.lineTo(rx*1.3, -h*2.1); c.quadraticCurveTo(rx*1.12, h*.2, rx*1.3, h*2.3); c.lineTo(rx*.55, h*.2); c.closePath(); strokeFill(col('#1a1620'));
  }
  if (ty === 'blob'){
    ell(c, rx*.88, h*.08, rx*.3, h*.26); strokeFill(col('#f6c2c0'));
    c.beginPath(); c.arc(rx*.62, h*.36, rx*.12, Math.PI*1.15, Math.PI*1.85); c.stroke();
  }
  if (ty === 'barrel'){
    c.save(); ell(c, rx*.45, -h*.4, rx*.36, h*.52); c.fillStyle = sil ? '#8a96a2' : 'rgba(210,245,255,.5)'; c.fill(); c.lineWidth = lw*.7; c.stroke(); c.restore();
    for (const ox of [0, rx*.1]){ ell(c, rx*.42 + ox, -h*.5, h*.12, h*.2); strokeFill(col('#7dfc9a')); }
  }

  // ---- EYE ----
  const eye = (ex, ey, er) => { ell(c, ex, ey, er, er); c.fillStyle = sil ? SO : '#fff'; c.fill();
    if (!sil){ c.lineWidth = lw*.7; c.strokeStyle = SO; c.stroke(); ell(c, ex + er*.15, ey, er*.6, er*.6); c.fillStyle = OUT; c.fill(); ell(c, ex - er*.05, ey - er*.25, er*.22, er*.22); c.fillStyle = '#fff'; c.fill(); } };
  if (ty !== 'barrel'){
    let er = longT ? L*.022 : Math.max(2, h * (ty === 'puffer' || ty === 'blob' || ty === 'mola' ? .1 : ty === 'shark' || ty === 'sword' ? .09 : .14));
    let ex = longT ? rx*.82 : ty === 'shark' ? rx*.7 : rx*.62, ey = longT ? -h*.05 : -h*.1;
    if (ty === 'skipper'){ ex = rx*.62; ey = -h*.5; er = h*.24; }
    if (ty === 'gulper'){ ex = rx*.45; er = L*.018; }
    eye(ex, ey, er);
    if (ty === 'flat') eye(ex - rx*.14, ey - h*.22, er);
    if (ty === 'skipper') eye(ex - rx*.14, ey - h*.04, er);
  }
  c.restore();
}

// Dark shadow used for swimming fish (top view)
function drawShadowFish(c, x, y, len, ang, t, alpha = .45){
  c.save(); c.translate(x, y); c.rotate(ang); c.globalAlpha = alpha; c.fillStyle = '#1b4866';
  const w = Math.sin(t * 10) * .25;
  ell(c, 0, 0, len*.5, len*.19); c.fill();
  c.beginPath(); c.moveTo(-len*.4, 0); c.lineTo(-len*.7, -len*.17 + w*len*.2); c.lineTo(-len*.7, len*.17 + w*len*.2); c.closePath(); c.fill();
  c.restore();
}

// ---- 6b. Characters (front view: menus / hut) ----
function drawCharFront(c, ch, x, y, s, expr = 'smile', t = 0){
  if (hasSprite(ch)){ drawSprite(c, ch, x, y + 4*s, 128*s, t); return; }
  c.save(); c.translate(x, y + Math.sin(t * 2.6) * 1.5 * s); c.scale(s, s);
  c.lineJoin = 'round'; c.lineCap = 'round'; const LW = 3;
  for (const dx of [-17, 17]){ ell(c, dx, -5, 12, 7); fs(c, ch.skin, LW); }                 // feet
  ell(c, -31, -38, 9, 14, .5); fs(c, ch.skin, LW); ell(c, 31, -38, 9, 14, -.5); fs(c, ch.skin, LW); // arms
  ell(c, 0, -34, 31, 29); fs(c, ch.shell, LW);                                                 // shell / outfit
  c.globalAlpha = .5; ell(c, -14, -46, 9, 5, -.5); fs(c, '#fff'); c.globalAlpha = 1;
  ell(c, 0, -31, 20, 20); fs(c, '#fff4dc', 2.5);                                               // belly plate
  c.strokeStyle = '#e6cc9c'; c.lineWidth = 2; c.beginPath(); c.moveTo(-14, -31); c.lineTo(14, -31); c.moveTo(0, -48); c.lineTo(0, -14); c.stroke();
  const oval = ch.head === 'oval';
  ell(c, 0, -84, oval ? 33 : 37, oval ? 37 : 33); fs(c, ch.skin, LW);                          // head
  c.globalAlpha = .4; ell(c, -13, -100, 12, 6, -.4); fs(c, '#fff'); c.globalAlpha = 1;
  // eyes
  const ey = -84, ex = 13, eyeCol = ch.id === 'popo' ? '#a8714a' : '#6b3a22';
  for (const sx of [-1, 1]){ ell(c, sx*ex, ey, 4.6, 6.2); fs(c, eyeCol); }
  if (ch.extra === 'fade'){ c.save(); c.beginPath(); c.rect(-ex-6, ey-8, 12, 8); c.clip(); ell(c, -ex, ey, 4.6, 6.2); fs(c, '#a8908c'); c.restore(); }
  for (const sx of [-1, 1]){ ell(c, sx*ex - 1.4, ey - 2.6, 1.7, 2); fs(c, '#fff'); }
  if (ch.extra === 'bow'){ c.strokeStyle = OUT; c.lineWidth = 2; for (const sx of [-1, 1]){ c.beginPath(); c.moveTo(sx*(ex+4), ey-4); c.lineTo(sx*(ex+8), ey-7); c.stroke(); } }
  // blush
  c.globalAlpha = .55; ell(c, -23, -74, 6, 3.5); fs(c, '#ff9db0'); ell(c, 23, -74, 6, 3.5); fs(c, '#ff9db0'); c.globalAlpha = 1;
  // mouth
  c.strokeStyle = OUT; c.lineWidth = 2.4; c.beginPath();
  if (expr === 'wow'){ ell(c, 0, -73, 3.5, 4.2); fs(c, '#c75b6b', 2.2); }
  else if (ch.mouth === 'w'){ c.arc(-3, -76, 3, .1*Math.PI, .9*Math.PI); c.moveTo(6, -76); c.arc(3, -76, 3, .1*Math.PI, .9*Math.PI); c.stroke(); }
  else { c.arc(0, -77, 4, .15*Math.PI, .85*Math.PI); c.stroke(); }
  // accessories
  if (ch.extra === 'bow'){ c.save(); c.translate(24, -112); c.rotate(.3);
    c.beginPath(); c.moveTo(0,0); c.lineTo(-13,-9); c.lineTo(-13,9); c.closePath(); fs(c, '#ff8fb0', 2.5);
    c.beginPath(); c.moveTo(0,0); c.lineTo(13,-9); c.lineTo(13,9); c.closePath(); fs(c, '#ff8fb0', 2.5);
    ell(c, 0, 0, 4, 4); fs(c, '#ff6f9a', 2.5); c.restore(); }
  if (ch.extra === 'hat'){ ell(c, 0, -110, 40, 9); fs(c, '#f1e3c2', 2.5); rr(c, -22, -132, 44, 22, 10); fs(c, '#f1e3c2', 2.5);
    c.fillStyle = '#e8a6a6'; c.fillRect(-21, -116, 42, 5); }
  c.restore();
}

// ---- 6c. Characters (top view: sitting on the boat) ----
function drawCharTop(c, ch, x, y, s, t){
  c.save(); c.translate(x, y); c.scale(s, s); c.lineJoin = 'round';
  const sw = Math.sin(t * 2) * .08;
  for (const [dx, dy, r] of [[-27,-14,-.7],[27,-14,.7],[-22,22,-2.3],[22,22,2.3]]){ ell(c, dx, dy, 8, 13, r + sw); fs(c, ch.skin, 2.5); }
  const oval = ch.head === 'oval';
  ell(c, 0, -34, oval ? 14 : 16, oval ? 18 : 16); fs(c, ch.skin, 2.5);
  ell(c, -6, -42, 2.2, 2.8); fs(c, OUT); ell(c, 6, -42, 2.2, 2.8); fs(c, OUT);
  if (ch.extra === 'bow'){ c.save(); c.translate(9, -28); c.beginPath(); c.moveTo(0,0); c.lineTo(-7,-5); c.lineTo(-7,5); c.closePath(); fs(c, '#ff8fb0', 2);
    c.beginPath(); c.moveTo(0,0); c.lineTo(7,-5); c.lineTo(7,5); c.closePath(); fs(c, '#ff8fb0', 2); c.restore(); }
  if (ch.extra === 'hat'){ ell(c, 0, -33, 19, 19); fs(c, '#f1e3c2', 2.5); ell(c, 0, -33, 10, 10); fs(c, '#f6ead0', 2); }
  ell(c, 0, 0, 27, 31); fs(c, ch.shell, 2.5);
  c.strokeStyle = ch.shellD; c.lineWidth = 2.5; c.beginPath();
  for (let i = 0; i < 6; i++){ const a = i / 6 * TAU - Math.PI/2; const px = Math.cos(a)*10, py = Math.sin(a)*11; i ? c.lineTo(px, py) : c.moveTo(px, py); }
  c.closePath();
  for (let i = 0; i < 6; i++){ const a = i / 6 * TAU - Math.PI/2; c.moveTo(Math.cos(a)*10, Math.sin(a)*11); c.lineTo(Math.cos(a)*24, Math.sin(a)*28); }
  c.stroke();
  c.globalAlpha = .4; ell(c, -9, -12, 9, 5, -.5); fs(c, '#fff'); c.globalAlpha = 1;
  c.restore();
}

function drawCloud(c, x, y, s){
  c.save(); c.fillStyle = '#fff'; c.globalAlpha = .95;
  for (const [dx, dy, r] of [[-28,6,18],[0,0,24],[28,6,18],[12,10,16],[-12,10,16]]){ c.beginPath(); c.arc(x + dx*s, y + dy*s, r*s, 0, TAU); c.fill(); }
  c.restore();
}

/* =====================================================================

let TZ = null;          // title zoom tween
let hutDoor = { x:0, y:0 };

function drawTitle(t){
  const seaY = H * .56;
  ctx.save();

  // sky
  let g = ctx.createLinearGradient(0, 0, 0, seaY); g.addColorStop(0, '#9fdcf2'); g.addColorStop(1, '#eaf8fb');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, seaY);
  ctx.save(); ctx.globalAlpha = .35; ell(ctx, W*.82, H*.1, 52*S, 52*S); fs(ctx, '#fff6cf'); ctx.restore();
  ell(ctx, W*.82, H*.1, 30*S, 30*S); fs(ctx, '#fff1b8');
  for (let i = 0; i < 3; i++) drawCloud(ctx, ((i * W * .45 + t * 8 * S) % (W + 160*S)) - 80*S, H * (.07 + i * .09), (.75 + i * .15) * S);
  // sea
  g = ctx.createLinearGradient(0, seaY, 0, H); g.addColorStop(0, '#8fd6ea'); g.addColorStop(1, '#5fb8d9');
  ctx.fillStyle = g; ctx.fillRect(0, seaY, W, H - seaY);
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(0, seaY, W, 2*S);
  drawWaveArcs(ctx, t, seaY + 10*S, H, .6);

  // ---- hut on stilts ----
  const hx = W/2, hy = H*.6;
  // walkway to bottom
  ctx.beginPath(); ctx.moveTo(hx - 28*S, hy + 12*S); ctx.lineTo(hx + 28*S, hy + 12*S); ctx.lineTo(hx + 58*S, H + 5); ctx.lineTo(hx - 58*S, H + 5); ctx.closePath(); fs(ctx, '#d9a066', 3*S);
  ctx.strokeStyle = '#b97a45'; ctx.lineWidth = 2*S;
  for (let i = 1; i < 9; i++){ const k = i / 9, yy = lerp(hy + 12*S, H, k), wv = lerp(28, 58, k) * S; ctx.beginPath(); ctx.moveTo(hx - wv, yy); ctx.lineTo(hx + wv, yy); ctx.stroke(); }
  // posts

    ctx.save(); ctx.globalAlpha = .6; ell(ctx, hx + px*S, hy + 34*S, 13*S, 4*S); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2*S; ctx.stroke(); ctx.restore(); }
  // deck
  rr(ctx, hx - 120*S, hy - 2*S, 240*S, 15*S, 5*S); fs(ctx, '#c98d55', 3*S);
  // walls
  rr(ctx, hx - 95*S, hy - 118*S, 190*S, 118*S, 6*S); fs(ctx, '#f0c08a', 3*S);
  ctx.save(); rr(ctx, hx - 95*S, hy - 118*S, 190*S, 118*S, 6*S); ctx.clip(); ctx.strokeStyle = '#d9a46d'; ctx.lineWidth = 2*S;
  for (let yy = hy - 100*S; yy < hy; yy += 18*S){ ctx.beginPath(); ctx.moveTo(hx - 95*S, yy); ctx.lineTo(hx + 95*S, yy); ctx.stroke(); } ctx.restore();
  // roof
  ctx.beginPath(); ctx.moveTo(hx - 120*S, hy - 112*S); ctx.lineTo(hx, hy - 196*S); ctx.lineTo(hx + 120*S, hy - 112*S); ctx.closePath(); fs(ctx, '#ef7d7d', 3*S);
  ctx.save(); ctx.beginPath(); ctx.moveTo(hx - 120*S, hy - 112*S); ctx.lineTo(hx, hy - 196*S); ctx.lineTo(hx + 120*S, hy - 112*S); ctx.closePath(); ctx.clip();
  ctx.fillStyle = '#ffe9e0'; for (let i = -6; i < 7; i += 2) ctx.fillRect(hx + i*20*S, hy - 200*S, 20*S, 100*S); ctx.restore();
  ctx.beginPath(); ctx.moveTo(hx - 120*S, hy - 112*S); ctx.lineTo(hx, hy - 196*S); ctx.lineTo(hx + 120*S, hy - 112*S); ctx.closePath(); ctx.lineWidth = 3*S; ctx.strokeStyle = OUT; ctx.stroke();
  // sign on roof
  rr(ctx, hx - 34*S, hy - 158*S, 68*S, 26*S, 8*S); fs(ctx, '#fff8ea', 2.5*S);
  drawFish(ctx, FISH.find(f => f.id === 'aji'), hx - 2*S, hy - 145*S, 40*S, t);
  // window

  // lifebuoy
  ctx.lineWidth = 9*S; ctx.strokeStyle = OUT; ctx.beginPath(); ctx.arc(hx + 60*S, hy - 78*S, 16*S, 0, TAU); ctx.stroke();
  ctx.lineWidth = 6*S; for (let i = 0; i < 4; i++){ ctx.strokeStyle = i % 2 ? '#fff' : '#ef6b6b'; ctx.beginPath(); ctx.arc(hx + 60*S, hy - 78*S, 16*S, i*TAU/4, (i+1)*TAU/4); ctx.stroke(); }
  // door (opens while zooming)

  rr(ctx, hx - 24*S, hy - 80*S, 48*S, 80*S, 8*S); fs(ctx, '#5a3a2a', 3*S);

  ctx.lineCap = 'round';
  for (const [bx, tx] of [[100, 128], [108, 142]]){ ctx.strokeStyle = OUT; ctx.lineWidth = 5*S; ctx.beginPath(); ctx.moveTo(hx + bx*S, hy - 2*S); ctx.lineTo(hx + tx*S, hy - 150*S); ctx.stroke();

  // ---- title text ----
  if (!TZ || TZ.t < .3){

    txt(ctx, 'Tap to start', W/2, H*.9, 22*S, '#fff', OUT, 6*S);

}
function updTitle(dt){

function enterHut(){ scene = 'hut'; hideAll(); showLayer('hutUI'); refreshCoins(); }

function drawHutInside(t){
  // wall
  let g = ctx.createLinearGradient(0, 0, 0, H*.5); g.addColorStop(0, '#f6cf9f'); g.addColorStop(1, '#ecb97e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H*.5);
  ctx.strokeStyle = '#d9a46d'; ctx.lineWidth = 2*S;
  for (let x = 20*S; x < W; x += 42*S){ ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H*.5); ctx.stroke(); }
  // window with live sea
  const wx = W/2 - 72*S, wy = H*.1, ww = 144*S, wh = 96*S;
  rr(ctx, wx - 8*S, wy - 8*S, ww + 16*S, wh + 16*S, 12*S); fs(ctx, '#b97a45', 3*S);
  ctx.save(); rr(ctx, wx, wy, ww, wh, 6*S); ctx.clip();
  g = ctx.createLinearGradient(0, wy, 0, wy + wh); g.addColorStop(0, '#bfe8f7'); g.addColorStop(.5, '#e9f8fb'); g.addColorStop(.5, '#7fcbe4'); g.addColorStop(1, '#5fb8d9');
  ctx.fillStyle = g; ctx.fillRect(wx, wy, ww, wh);
  drawCloud(ctx, wx + ((t * 10 * S) % (ww + 60*S)) - 30*S, wy + 20*S, .55*S);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2*S;
  for (let i = 0; i < 6; i++){ ctx.globalAlpha = .5 + .4 * Math.sin(t * 1.5 + i); ctx.beginPath(); ctx.arc(wx + ((i * 31*S + t * 7*S) % ww), wy + wh*.62 + (i % 3) * 11*S, 6*S, Math.PI*1.2, Math.PI*1.8); ctx.stroke(); }
  ctx.globalAlpha = 1; ctx.restore();
  ctx.strokeStyle = OUT; ctx.lineWidth = 3*S; rr(ctx, wx, wy, ww, wh, 6*S); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W/2, wy); ctx.lineTo(W/2, wy + wh); ctx.stroke();
  // hanging net (left)
  ctx.save(); ctx.strokeStyle = '#8a6a4a'; ctx.lineWidth = 1.5*S; const nx = 12*S, ny = H*.1;
  for (let i = 0; i <= 6; i++){ ctx.beginPath(); ctx.moveTo(nx + i*11*S, ny); ctx.quadraticCurveTo(nx + i*11*S + 8*S, ny + 60*S, nx + i*11*S, ny + 110*S); ctx.stroke(); }
  for (let j = 0; j <= 6; j++){ ctx.beginPath(); ctx.moveTo(nx, ny + j*18*S); ctx.quadraticCurveTo(nx + 33*S, ny + j*18*S + 6*S, nx + 66*S, ny + j*18*S); ctx.stroke(); }
  ctx.restore();
  // trophy board (right) — shows best caught fish
  const bx = W - 84*S, by = H*.1;
  rr(ctx, bx, by, 72*S, 110*S, 10*S); fs(ctx, '#fff3dc', 3*S);
  txt(ctx, 'BEST', bx + 36*S, by + 12*S, 11*S, '#b97a45', null);
  const best = FISH.filter(f => save.col[f.id]).sort((a, b) => b.star - a.star).slice(0, 3);
  best.forEach((f, i) => drawFish(ctx, f, bx + 32*S, by + 34*S + i * 28*S, 48*S, 0));
  if (!best.length) txt(ctx, '?', bx + 36*S, by + 60*S, 30*S, '#e0cfb0', null);
  // floor
  g = ctx.createLinearGradient(0, H*.5, 0, H); g.addColorStop(0, '#c98d55'); g.addColorStop(1, '#a8703f');
  ctx.fillStyle = g; ctx.fillRect(0, H*.5, W, H*.5);
  ctx.fillStyle = OUT; ctx.fillRect(0, H*.5 - 1.5*S, W, 3*S);
  ctx.strokeStyle = 'rgba(74,52,52,.25)'; ctx.lineWidth = 2*S;
  for (let y = H*.5 + 26*S; y < H; y += 30*S){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  // rug + character
  ell(ctx, W/2, H*.53, 88*S, 17*S); fs(ctx, '#ffd0db', 3*S);
  ell(ctx, W/2, H*.53, 64*S, 11*S); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3*S; ctx.stroke();
  const ch = curChar();
  drawCharFront(ctx, ch, W/2, H*.53, 1.05*S, 'smile', t);
  // name tag
  rr(ctx, W/2 + 40*S, H*.355, 82*S, 24*S, 12*S); fs(ctx, '#fffdf6', 2.5*S);
  txt(ctx, ch.name, W/2 + 81*S, H*.355 + 12*S, 14*S, OUT, null);
}

/* =====================================================================
   JS 9. MENUS — Collection / Upgrade Rod / Character
   ===================================================================== */
const panelBody = document.getElementById('panelBody');
let panelBuilder = null;
function openPanel(title, builder){
  document.getElementById('panelTitle').textContent = title;
  panelBuilder = builder; builder(panelBody); panelBody.scrollTop = 0;
  showLayer('panel'); refreshCoins();
}
function rebuildPanel(){ const st = panelBody.scrollTop; panelBuilder(panelBody); panelBody.scrollTop = st; refreshCoins(); }
document.getElementById('panelBack').onclick = () => { hideLayer('panel'); refreshCoins(); };

// ---- 9a. Collection ----
function buildCollection(body){
  const caught = FISH.filter(f => save.col[f.id]).length;
  body.innerHTML = `<div class="sum">Caught <b>${caught}</b> / ${FISH.length} species</div>`;
  for (const hab of ['river', 'ocean', 'deep']){
    const h = document.createElement('div'); h.className = 'habh'; h.style.background = HAB[hab].col; h.textContent = HAB[hab].name; body.appendChild(h);
    const grid = document.createElement('div'); grid.className = 'grid';
    for (const f of FISH.filter(x => x.hab === hab)){
      const rec = save.col[f.id];
      const card = document.createElement('div'); card.className = 'fcard' + (rec ? '' : ' unk');
      const cnv = makeCanvas(96, 62); drawFish(cnv.c, f, 46, 33, f.type === 'oar' ? 84 : Math.min(68, 34 / f.h), 0, { sil:!rec });
      card.appendChild(cnv.el);
      card.insertAdjacentHTML('beforeend', `<div class="fn">${rec ? f.name : '???'}</div><div class="gold">${stars(f.star)}</div>${rec ? `<div class="bs">Best ${fmtSize(rec.best)}</div>` : ''}`);
      if (rec) card.onclick = () => showDetail(f, rec);
      grid.appendChild(card);
    }
    body.appendChild(grid);
  }
}
function showDetail(f, rec){
  const old = panelBody.querySelector('.detail'); if (old) old.remove();
  const d = document.createElement('div'); d.className = 'detail'; d.style.top = (panelBody.scrollTop + 10) + 'px';
  const cnv = makeCanvas(260, 120); drawFish(cnv.c, f, 124, 62, f.type === 'oar' ? 230 : Math.min(180, 80 / f.h), 0);
  d.appendChild(cnv.el);
  d.insertAdjacentHTML('beforeend', `<div class="gold" style="font-size:22px">${stars(f.star)}</div><h3>${f.name}</h3><div class="jp">${f.jp} ・ ${HAB[f.hab].name}</div>
    <div style="margin-top:6px;font-weight:800;font-size:13px">Caught ×${rec.count} ・ Best ${fmtSize(rec.best)}</div>
    <p><b>💡 Did you know?</b><br>${f.trivia}</p><button>Close</button>`);
  d.querySelector('button').onclick = () => d.remove();
  panelBody.appendChild(d);
}

// ---- 9b. Upgrade Rod & Attachments ----
function buildUpgrade(body){
  body.innerHTML = '<div class="sec">🎣 Fishing Rod</div>';
  for (const key of ['reel', 'rare']){
    const u = ROD[key], lvl = save.rod[key], maxed = lvl >= u.max, cost = maxed ? 0 : u.costs[lvl];
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<div class="ic">${u.icon}</div><div class="info"><b>${u.name}</b> Lv.${lvl}<br>${u.desc}
      <div class="pips">${Array.from({length:u.max}, (_, i) => `<span class="${i < lvl ? 'on' : ''}"></span>`).join('')}</div></div>`;
    const b = document.createElement('button');
    b.innerHTML = maxed ? 'MAX' : `<span class="coin sm"></span>${cost}`;
    b.disabled = maxed || save.coins < cost;
    b.onclick = () => { if (save.coins < cost) return; save.coins -= cost; save.rod[key]++; writeSave(); rebuildPanel(); };
    row.appendChild(b); body.appendChild(row);
  }
  body.insertAdjacentHTML('beforeend', '<div class="sec" style="margin-top:14px">🪝 Attachments</div>');
  for (const a of ATTACH){
    const owned = save.owned.includes(a.id), eq = save.equip === a.id;
    const row = document.createElement('div'); row.className = 'row' + (eq ? ' eq' : '');
    row.innerHTML = `<div class="ic">${a.icon}</div><div class="info"><b>${a.name}</b><br>${a.desc}</div>`;
    const b = document.createElement('button');
    if (eq){ b.textContent = 'Equipped'; b.disabled = true; }
    else if (owned){ b.textContent = 'Equip'; b.onclick = () => { save.equip = a.id; writeSave(); rebuildPanel(); }; }
    else { b.innerHTML = `<span class="coin sm"></span>${a.cost}`; b.disabled = save.coins < a.cost;
      b.onclick = () => { if (save.coins < a.cost) return; save.coins -= a.cost; save.owned.push(a.id); save.equip = a.id; writeSave(); rebuildPanel(); }; }
    row.appendChild(b); body.appendChild(row);
  }
}

// ---- 9c. Character selection ----
function buildCharacter(body){
  body.innerHTML = '';
  for (const ch of CHARACTERS){
    const sel = save.char === ch.id;
    const card = document.createElement('div'); card.className = 'ccard' + (sel ? ' sel' : '');
    const cnv = makeCanvas(84, 96); drawCharFront(cnv.c, ch, 42, 92, .64, 'smile', 0);
    card.appendChild(cnv.el);
    const info = document.createElement('div'); info.className = 'info';
    info.innerHTML = `<b>${ch.name}</b><br><span class="trait">${ch.skill}</span><br>${ch.desc}${ch.id === 'soso' ? `<br><i>Current double chance: ${Math.round(20 + (save.sosoBonus || 0) * 100)}%</i>` : ''}`;
    card.appendChild(info);
    const b = document.createElement('button'); b.textContent = sel ? '✓' : 'Pick'; b.disabled = sel;
    b.onclick = () => { save.char = ch.id; writeSave(); rebuildPanel(); };

  }
}
