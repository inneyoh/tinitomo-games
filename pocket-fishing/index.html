<style>
/* Layout: one portrait phone frame, 3D dock scene full-bleed, chunky toy-like UI floating over it. */
:root{
  --sea:#a3d8f5; --sea-deep:#7fb8dc; --coral:#f48e85; --coral-dk:#d9716a;
  --cream:#fffaf1; --cream-dk:#eee0c9; --ink:#5b3d2e; --wood:#a07a62; --wood-lt:#d7b08e;
  --leaf:#86cf9c; --leaf-dk:#62b07d; --sun:#ffd98a; --sun-dk:#ecbd5e; --sky:#8cc4ee;
  --font:'Fredoka', 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(120% 90% at 50% 0%, #cdeafb 0%, var(--sea-deep) 75%);font-family:var(--font);color:var(--ink);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#stage{height:100%;display:flex;align-items:center;justify-content:center}
#frame{position:relative;overflow:hidden;background:var(--sea);container-type:size;box-shadow:0 20px 60px rgba(20,60,110,.35)}
#frame.boxed{border-radius:28px}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;pointer-events:none}
.layer > *{pointer-events:auto}
button{font-family:var(--font);color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* ---------- Logo ---------- */
#logo{position:absolute;top:calc(4cqh + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);transform-origin:top center;
  text-align:center;pointer-events:none;transition:transform .7s cubic-bezier(.5,0,.2,1), left .7s cubic-bezier(.5,0,.2,1), top .7s cubic-bezier(.5,0,.2,1), opacity .4s}
#logo.corner{left:3cqw;top:calc(1.6cqh + env(safe-area-inset-top,0px));transform:translateX(0) scale(.42);transform-origin:top left}
#logo img{display:block;width:84cqw;height:auto;filter:drop-shadow(0 1.4cqw 1.6cqw rgba(30,70,120,.25));animation:logofloat 3.2s ease-in-out infinite}
@keyframes logofloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-1.2cqw) rotate(1deg)}}
#logo.gone{opacity:0}
.logo-top{display:inline-block;font-weight:600;font-size:6.2cqw;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--coral);
  padding:.25em .9em .2em;border-radius:999px;box-shadow:0 .2em 0 var(--coral-dk);transform:rotate(-3deg)}
.logo-main{display:block;white-space:nowrap;font-weight:700;font-size:15.5cqw;line-height:.95;color:#fff;margin-top:.08em;letter-spacing:.01em;
  text-shadow:
   0 .045em 0 var(--coral-dk), .045em 0 0 var(--coral-dk), -.045em 0 0 var(--coral-dk), 0 -.045em 0 var(--coral-dk),
   .035em .035em 0 var(--coral-dk), -.035em .035em 0 var(--coral-dk), .035em -.035em 0 var(--coral-dk), -.035em -.035em 0 var(--coral-dk),
   0 .11em 0 var(--coral-dk), 0 .16em .12em rgba(30,70,120,.35)}
.logo-main span{display:inline-block;animation:bob 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*.09s)}
.logo-wave{display:block;margin:2cqw auto 0;width:52cqw;height:3.2cqw}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.06em)}}

#tap{position:absolute;left:50%;bottom:calc(5cqh + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  font-weight:600;font-size:5.2cqw;color:var(--ink);background:var(--cream);padding:.55em 1.3em;border-radius:999px;
  box-shadow:0 .22em 0 var(--cream-dk), 0 .5em 1em rgba(20,60,110,.25);animation:pulse 1.4s ease-in-out infinite;white-space:nowrap}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.06)}}

/* ---------- HUD ---------- */
#coins{position:absolute;top:calc(3cqh + env(safe-area-inset-top,0px));right:4cqw;display:flex;align-items:center;gap:1.6cqw;
  background:var(--cream);border-radius:999px;padding:1.2cqw 3.2cqw 1.2cqw 1.4cqw;font-weight:600;font-size:4.2cqw;
  box-shadow:0 .9cqw 0 var(--cream-dk);font-variant-numeric:tabular-nums;transition:opacity .3s, transform .3s}
.coin{width:6cqw;height:6cqw;border-radius:50%;background:radial-gradient(circle at 35% 35%, #ffe597, var(--sun) 55%, var(--sun-dk));
  box-shadow:inset 0 0 0 .6cqw #f5b52a;display:grid;place-items:center;color:#b07d10;font-size:3.4cqw;font-weight:700}
.hidden-ui{opacity:0;transform:translateY(-8px);pointer-events:none!important}

#back{position:absolute;top:calc(3cqh + env(safe-area-inset-top,0px));left:4cqw;display:flex;align-items:center;gap:1.4cqw;
  background:var(--cream);border-radius:999px;padding:1.6cqw 3.6cqw 1.6cqw 2cqw;font-weight:600;font-size:4.2cqw;
  box-shadow:0 .9cqw 0 var(--cream-dk);transition:opacity .25s, transform .25s}
#back svg{width:4.6cqw;height:4.6cqw}

/* ---------- Main menu ---------- */
#menu{position:absolute;left:3.5cqw;width:60cqw;display:flex;flex-direction:column;gap:2.6cqw;pointer-events:none}
#menu .mbtn{pointer-events:auto}
.mrow{display:flex;gap:2.2cqw;align-items:stretch}
.mbtn{position:relative;overflow:hidden;display:flex;align-items:center;gap:2.4cqw;width:100%;text-align:left;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg) 52%,var(--bg2) 100%);
  border:.8cqw solid var(--ink);border-radius:5cqw;padding:1.3cqw 3cqw 1.3cqw 1.3cqw;
  font-weight:700;font-size:4.5cqw;line-height:1.05;color:#fff;white-space:nowrap;
  text-shadow:0 .1em 0 var(--ink),.06em 0 0 var(--ink),-.06em 0 0 var(--ink),0 -.06em 0 var(--ink),.05em .05em 0 var(--ink),-.05em .05em 0 var(--ink),.05em -.05em 0 var(--ink),-.05em -.05em 0 var(--ink);
  box-shadow:0 1.3cqw 0 var(--ink),0 2.6cqw 3cqw rgba(20,50,90,.25),inset 0 .9cqw 0 rgba(255,255,255,.45),inset 0 -1cqw 0 rgba(0,0,0,.12);
  transform:scale(0);opacity:0;transform-origin:left center;
  transition:font-size .32s cubic-bezier(.34,1.7,.6,1),padding .32s cubic-bezier(.34,1.7,.6,1),flex-grow .32s cubic-bezier(.34,1.5,.6,1),border-radius .3s}
.mbtn:active{transform:translateY(1cqw)!important;box-shadow:0 .2cqw 0 var(--ink),inset 0 .9cqw 0 rgba(255,255,255,.45)}
.mbtn .ic{flex:none;width:9cqw;height:9cqw;border-radius:50%;display:grid;place-items:center;font-size:5cqw;background:#fff;
  border:.6cqw solid var(--ink);box-shadow:inset 0 -.9cqw 0 rgba(0,0,0,.1);text-shadow:none;
  transition:width .32s cubic-bezier(.34,1.7,.6,1),height .32s cubic-bezier(.34,1.7,.6,1),font-size .32s cubic-bezier(.34,1.7,.6,1)}
.mbtn.big{font-size:6.3cqw;padding:2.4cqw 3cqw 2.4cqw 1.8cqw;border-radius:6cqw}
.mbtn.big .ic{width:13cqw;height:13cqw;font-size:7.4cqw;animation:wob 1.3s ease-in-out infinite}
.mbtn::after{content:"";position:absolute;top:-20%;bottom:-20%;left:-40%;width:18%;background:rgba(255,255,255,.55);transform:skewX(-20deg);opacity:0;pointer-events:none}
.mbtn.big::after{animation:shine 2.4s ease-in-out infinite}
.mbtn::before{content:"";position:absolute;right:3cqw;top:1.6cqw;width:3cqw;height:1.6cqw;border-radius:50%;background:rgba(255,255,255,.7);transform:rotate(-20deg)}
.mbtn.tile{flex:1 1 0;min-width:14cqw;flex-direction:column;justify-content:center;gap:0;padding:1.6cqw;border-radius:4.6cqw;text-align:center}
.mbtn.tile::before{right:2cqw;top:1.2cqw;width:2.2cqw;height:1.2cqw}
.mbtn.tile .lb{font-size:0;opacity:0;max-height:0;transition:font-size .3s cubic-bezier(.34,1.7,.6,1),opacity .2s,max-height .3s}
.mbtn.tile.big{flex-grow:3;padding:2cqw 1.6cqw 1.8cqw;gap:1cqw;font-size:inherit}
.mbtn.tile.big .ic{width:11.5cqw;height:11.5cqw;font-size:6.4cqw}
.mbtn.tile.big .lb{font-size:3.7cqw;opacity:1;max-height:6cqw}
#menu.show .mbtn{animation:popin .55s cubic-bezier(.34,1.8,.6,1) forwards;animation-delay:calc(var(--i)*70ms)}
#menu.out .mbtn{animation:popout .22s ease-in forwards;animation-delay:calc((5 - var(--i))*25ms)}
@keyframes popin{0%{transform:scale(.2) rotate(-8deg);opacity:0}70%{transform:scale(1.06) rotate(1deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes popout{0%{transform:scale(1);opacity:1}100%{transform:scale(.2);opacity:0}}
@keyframes wob{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.08)}}
@keyframes shine{0%,55%{left:-40%;opacity:0}60%{opacity:1}85%,100%{left:130%;opacity:0}}
@media (hover:hover){.mbtn:hover{filter:saturate(1.15) brightness(1.04)}}
@media (prefers-reduced-motion: reduce){.mbtn.big .ic,.mbtn.big::after{animation:none}}

/* ---------- Generic card / dialog ---------- */
.card{background:var(--cream);border:.7cqw solid var(--ink);border-radius:5cqw;box-shadow:0 1.4cqw 0 var(--ink), 0 4cqw 8cqw rgba(20,50,90,.25)}
.pop{animation:cardin .45s cubic-bezier(.34,1.56,.64,1) both}
@keyframes cardin{0%{transform:translateX(var(--tx,0)) scale(.6);opacity:0}100%{transform:translateX(var(--tx,0)) scale(1);opacity:1}}
.btn{color:var(--ink);font-weight:600;font-size:4.6cqw;padding:2.4cqw 5cqw;border-radius:999px;border:.6cqw solid var(--ink);box-shadow:0 1cqw 0 var(--ink);background:#fff}
.btn:active{transform:translateY(.8cqw);box-shadow:0 .2cqw 0 var(--ink)}
.btn.go{background:var(--leaf);color:#fff}
.btn.coral{background:var(--coral);color:#fff}
.btn.soft{background:var(--cream-dk)}

#confirm{position:absolute;left:50%;--tx:-50%;transform:translateX(-50%);bottom:calc(6cqh + env(safe-area-inset-bottom,0px));width:84cqw;padding:5cqw;text-align:center}
#confirm h2{margin:0 0 1.5cqw;font-size:6.4cqw;font-weight:700;text-wrap:balance}
#confirm p{margin:0 0 4cqw;font-size:4cqw;color:#6b4a38;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:1.6cqw;margin:0 0 4.4cqw}
.chip{font-size:3.3cqw;font-weight:500;background:#fff;border:.4cqw solid var(--cream-dk);border-radius:999px;padding:.8cqw 2.6cqw}
.row{display:flex;gap:3cqw;justify-content:center}

/* ---------- Character select ---------- */
.arrow{position:absolute;width:14cqw;height:14cqw;border-radius:50%;background:var(--sun);border:.7cqw solid var(--ink);box-shadow:0 1.1cqw 0 var(--ink);
  display:grid;place-items:center;transform:translate(-50%,-50%)}
.arrow:active{transform:translate(-50%,-50%) translateY(.8cqw);box-shadow:0 .2cqw 0 var(--ink)}
.arrow svg{width:6cqw;height:6cqw}
.arrow[disabled]{filter:grayscale(.6) brightness(.9);cursor:default}
#plate{position:absolute;left:50%;--tx:-50%;transform:translateX(-50%);bottom:calc(5cqh + env(safe-area-inset-bottom,0px));width:80cqw;padding:4cqw 5cqw;text-align:center}
#plate .nm{font-size:8cqw;font-weight:700;line-height:1}
#plate .sk{display:inline-block;margin-top:2cqw;font-size:4.2cqw;font-weight:700;color:#fff;background:var(--coral);padding:.8cqw 3.4cqw;border-radius:999px}
#plate .tr{font-size:3.6cqw;line-height:1.35;color:#6b4a38;margin:1.6cqw 0 3cqw;text-wrap:balance}
.dots{display:flex;gap:1.6cqw;justify-content:center;margin-bottom:3.4cqw}
.dots i{width:2.2cqw;height:2.2cqw;border-radius:50%;background:var(--cream-dk)}
.dots i.on{background:var(--coral);transform:scale(1.25)}

/* ---------- Rod workshop ---------- */
#rodpanel{position:absolute;left:3cqw;right:3cqw;bottom:calc(3cqw + env(safe-area-inset-bottom,0px));padding:4cqw 4cqw 4.4cqw;--tx:0}
.rp-head{display:flex;justify-content:space-between;align-items:baseline;gap:2cqw;margin-bottom:2.6cqw}
.rp-head h2{margin:0;font-size:6cqw;font-weight:700}
.rp-head small{font-size:3.4cqw;color:#8a6a55}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:1.4cqw 2.4cqw;align-items:center;font-size:3.5cqw;font-weight:500;margin-bottom:3.4cqw}
.bar{height:2.6cqw;background:var(--cream-dk);border-radius:999px;overflow:hidden}
.bar b{display:block;height:100%;border-radius:999px;transition:width .4s cubic-bezier(.34,1.4,.6,1)}
.stats .v{font-variant-numeric:tabular-nums;font-weight:600;min-width:6cqw;text-align:right}
.tabs{display:flex;gap:1.6cqw;margin-bottom:3cqw}
.tab{flex:1;font-size:3.4cqw;font-weight:600;padding:1.8cqw 0;border-radius:3cqw;background:var(--cream-dk);border:.5cqw solid transparent}
.tab.on{background:#fff;border-color:var(--ink);box-shadow:0 .7cqw 0 var(--ink)}
.opts{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:2cqw}
.opt{background:#fff;border:.5cqw solid var(--cream-dk);border-radius:3.6cqw;padding:2.6cqw 1.6cqw 2.2cqw;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1.2cqw;min-width:0}
.opt.eq{border-color:var(--leaf);box-shadow:0 0 0 .5cqw var(--leaf) inset}
.sw{width:10cqw;height:10cqw;border-radius:50%;box-shadow:inset 0 -1cqw 0 rgba(0,0,0,.15)}
.opt .pic{width:16cqw;height:16cqw;display:block;filter:drop-shadow(0 .8cqw .6cqw rgba(29,59,82,.18))}
.opt:not(.eq) .pic{transform:scale(.94)}
.opt .on{font-size:3.4cqw;font-weight:600;line-height:1.1;min-height:2.2em;display:flex;align-items:center}
.opt .ds{font-size:2.9cqw;color:#8a6a55}
.opt .act{font-size:3.2cqw;font-weight:600;border-radius:999px;padding:1cqw 2.6cqw;width:100%}
.act.equip{background:var(--sky);color:#fff}
.act.buy{background:var(--sun);color:var(--ink)}
.act.buy,.act.poor{display:flex;align-items:center;justify-content:center;gap:1cqw}
.act.buy .coin,.act.poor .coin{width:3.8cqw;height:3.8cqw;font-size:2.2cqw;box-shadow:inset 0 0 0 .4cqw #f5b52a}
.act.done{background:var(--leaf);color:#fff;cursor:default}
.act.poor{background:var(--cream-dk);color:#9b8571}

/* ---------- Options ---------- */
#options{position:absolute;left:50%;top:50%;--tx:-50%;transform:translate(-50%,-50%);width:76cqw;padding:5.4cqw;text-align:center}
#options.pop{animation:optin .45s cubic-bezier(.34,1.56,.64,1) both}
@keyframes optin{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
#options h2{margin:0 0 4.4cqw;font-size:7cqw}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:3cqw;background:#fff;border-radius:4cqw;padding:3cqw 3.4cqw;margin-bottom:5cqw}
.setrow span{font-size:4.8cqw;font-weight:600;display:flex;align-items:center;gap:2cqw}
.seg{display:flex;background:var(--cream-dk);border-radius:999px;padding:.8cqw}
.seg button{font-size:4cqw;font-weight:700;padding:1.6cqw 4.2cqw;border-radius:999px;color:#8a6a55}
.seg button.on{background:var(--leaf);color:#fff;box-shadow:0 .6cqw 0 var(--leaf-dk)}
.seg button.on.off{background:var(--coral);box-shadow:0 .6cqw 0 var(--coral-dk)}
#scrim{position:absolute;inset:0;background:rgba(25,60,100,.35);transition:opacity .3s}

/* ---------- Encyclopedia book ---------- */
#bookwrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqw;background:rgba(25,55,95,.45)}
#bookwrap.pop .book{animation:bookin .6s cubic-bezier(.34,1.4,.64,1) both}
@keyframes bookin{0%{transform:scale(.4) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.book{position:relative;width:94cqw;height:min(44cqh,104cqw);perspective:220cqw;display:flex;
  filter:drop-shadow(0 2cqw 0 #6a3b24) drop-shadow(0 4cqw 6cqw rgba(10,30,60,.4))}
.book::before{content:"";position:absolute;inset:-2.2cqw -2.2cqw -2.2cqw -2.2cqw;background:linear-gradient(#b5643c,#94492a);border-radius:4cqw;z-index:-1}
.page{position:relative;width:50%;height:100%;background:linear-gradient(90deg,#fffaf0 0%,#fbf0da 100%);overflow:hidden;box-sizing:border-box;padding:3.6cqw 3cqw 6cqw}
.page.left{border-radius:3cqw 0 0 3cqw;background:linear-gradient(270deg,#efe0c3 0%,#fbf2df 9%,#fffaf0 100%)}
.page.right{border-radius:0 3cqw 3cqw 0;background:linear-gradient(90deg,#efe0c3 0%,#fbf2df 9%,#fffaf0 100%)}
.pg-h{font-size:3cqw;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#b3815c;margin:0 0 2cqw;text-align:center}
.pg-n{position:absolute;bottom:2cqw;left:0;right:0;text-align:center;font-size:3cqw;color:#b3815c;font-variant-numeric:tabular-nums}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.6cqw}
.fcard{display:flex;flex-direction:column;align-items:center;width:100%;min-width:0;padding:1.2cqw .6cqw 1.6cqw;border-radius:2.6cqw;border:.5cqw dashed #e2cba4;background:rgba(255,255,255,.5);text-align:center}
.fcard img{width:100%;height:auto;display:block}
.fcard.locked .fn{color:#a89484}
#detail .dfish img{width:78%;height:auto}
.fcard:last-child{margin-bottom:0}
.fcard:hover{background:#fff}
.fcard svg{width:88%;height:auto;display:block;transition:transform .2s;filter:saturate(.75) brightness(1.05)}
.fcard:hover svg{transform:scale(1.06) rotate(-3deg)}
.fcard .fn{font-weight:700;font-size:2.7cqw;margin-top:.2cqw;line-height:1.1;overflow-wrap:anywhere}
.fcard .fs{font-size:2.3cqw;color:#d08a2a;letter-spacing:.05em}
.fcard .ft{font-size:2.6cqw;color:#9b7a62;margin-top:.4cqw}
.fcard .no{font-size:2.2cqw;color:#b3815c;font-variant-numeric:tabular-nums;align-self:flex-start;margin-left:1cqw}
.leaf{position:absolute;top:0;width:50%;height:100%;transform-style:preserve-3d;z-index:5;pointer-events:none}
.leaf.fwd{left:50%;transform-origin:left center}
.leaf.bwd{left:0;transform-origin:right center}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.leaf .face.back{transform:rotateY(180deg)}
.leaf .face .page{width:100%}
.booknav{display:flex;align-items:center;gap:4cqw}
.booknav .arrow{position:static;transform:none;width:12cqw;height:12cqw}
.booknav .arrow:active{transform:translateY(.8cqw)}
.booknav .lbl{font-weight:600;font-size:4cqw;color:#fff;min-width:24cqw;text-align:center;text-shadow:0 .4cqw 0 rgba(0,0,0,.2);font-variant-numeric:tabular-nums}
#bookclose{position:absolute;top:calc(3cqh + env(safe-area-inset-top,0px));right:4cqw;width:12cqw;height:12cqw;border-radius:50%;background:var(--coral);border:.7cqw solid var(--ink);box-shadow:0 1cqw 0 var(--ink);display:grid;place-items:center}
#bookclose svg{width:5cqw;height:5cqw}
#bookhint{color:#fff;font-size:3.6cqw;font-weight:500;opacity:.9;margin-top:-1cqw}
#detail{position:absolute;inset:0;display:grid;place-items:center;background:rgba(25,55,95,.35);z-index:20}
#detail .card{width:84cqw;padding:4.4cqw 5cqw 5cqw;background:#fffaf0;position:relative;max-height:86cqh;overflow:auto}
#detail .dfish{background:radial-gradient(circle at 50% 60%, #d6eefc, #fffaf0 70%);border-radius:4cqw;padding:2cqw;text-align:center}
#detail .dfish svg{width:72%;height:auto;filter:saturate(.75) brightness(1.05)}
#detail h3{margin:2cqw 0 .4cqw;font-size:7cqw;line-height:1}
#detail .meta{font-size:3.4cqw;color:#8a6a55;margin-bottom:3cqw}
#detail .rec{font-size:3.3cqw;color:#8a6a55;margin:-1.4cqw 0 3cqw}
#detail li.lockd{flex-direction:column;align-items:stretch;gap:1.2cqw;background:#f5ece0;color:#8a6a55}
#detail li.lockd::before{display:none}
#detail li.lockd small{font-size:3cqw;text-align:right;font-variant-numeric:tabular-nums}
#detail .prog{display:block;height:2.4cqw;border-radius:999px;background:#eadcc6;overflow:hidden}
#detail .prog b{display:block;height:100%;background:var(--leaf);border-radius:999px}
#detail ol{list-style:none;margin:0 0 4cqw;padding:0;display:flex;flex-direction:column;gap:2cqw;counter-reset:t}
#detail li{counter-increment:t;display:flex;gap:2.6cqw;align-items:flex-start;font-size:3.8cqw;line-height:1.35;background:#fff;border-radius:3cqw;padding:2.4cqw 3cqw;
  opacity:0;animation:fact .4s ease-out forwards;animation-delay:calc(var(--i)*.15s + .15s)}
#detail li::before{content:counter(t);flex:none;width:6cqw;height:6cqw;border-radius:50%;background:var(--sun);font-weight:700;font-size:3.4cqw;display:grid;place-items:center;margin-top:.2em}
@keyframes fact{0%{opacity:0;transform:translateY(2cqw)}100%{opacity:1;transform:none}}
.lbl-trivia{font-size:3.2cqw;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#b3815c;margin:0 0 2cqw}

/* ---------- Sailing / toast ---------- */
#sail{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqw;text-align:center;
  background:linear-gradient(#cdeafb, #9ccff0 60%, #7fb8dc);color:#fff;transition:opacity .8s}
#sail h2{margin:0;font-size:9cqw;text-shadow:0 .8cqw 0 rgba(20,60,110,.35)}
#sail p{margin:0;font-size:4.2cqw;max-width:70cqw;opacity:.95}
#sail .boatico{font-size:16cqw;animation:rock 1.6s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-1.5cqw)}}
#toast{position:absolute;left:50%;top:14cqh;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:500;font-size:4cqw;padding:2cqw 4.4cqw;border-radius:999px;white-space:nowrap;transition:opacity .3s, transform .3s}
#toast.hidden-ui{transform:translateX(-50%) translateY(-8px)}

/* ---------- Fishing (gameplay ported from the original Pocket Fishing) ---------- */
#fishcv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fishHUD{position:absolute;inset:0;pointer-events:none}
#fishHUD .fcoins{position:absolute;top:calc(3cqh + env(safe-area-inset-top,0px));left:4cqw;display:flex;align-items:center;gap:1.6cqw;background:var(--cream);border-radius:999px;padding:1.2cqw 3.2cqw 1.2cqw 1.4cqw;font-weight:600;font-size:4.2cqw;box-shadow:0 .9cqw 0 var(--cream-dk);font-variant-numeric:tabular-nums}
#fishHUD .hutBtn{position:absolute;top:calc(3cqh + env(safe-area-inset-top,0px));right:4cqw;pointer-events:auto;background:var(--cream);border-radius:999px;padding:1.6cqw 3.6cqw;font-weight:600;font-size:3.8cqw;box-shadow:0 .9cqw 0 var(--cream-dk)}
#fishHUD .ftag{position:absolute;bottom:calc(2.4cqh + env(safe-area-inset-bottom,0px));background:var(--cream);border:.6cqw solid var(--ink);border-radius:999px;padding:.8cqw 3cqw;font-weight:600;font-size:3.5cqw}
#fishHUD .lure{left:3cqw} #fishHUD .bucket{right:3cqw}
#result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(74,52,52,.35)}
#result .rcard{width:88cqw;max-height:92cqh;overflow-y:auto;background:var(--cream);border:.8cqw solid var(--ink);border-radius:6cqw;padding:4cqw 4.4cqw 4.6cqw;text-align:center;box-shadow:0 1.4cqw 0 var(--ink);animation:cardin .45s cubic-bezier(.34,1.56,.64,1) both}
#result .badges{display:flex;justify-content:center;gap:1.6cqw;flex-wrap:wrap;min-height:5cqw}
#result .badge{background:var(--coral);color:#fff;border:.5cqw solid var(--ink);border-radius:999px;padding:0 2.4cqw;font-weight:700;font-size:3.3cqw}
#result .badge.b2{background:var(--sun);color:var(--ink)} #result .badge.b3{background:#b9a8f5}
#result canvas{width:100%;max-width:300px;height:auto;display:block;margin:1cqw auto}
#result .rstars{font-size:7cqw;line-height:1;color:#f0a91a;letter-spacing:.1em}
#result h2{margin:1cqw 0 0;font-size:6.4cqw}
#result .jp{font-size:3.4cqw;color:#8a7a6a}
#result .meta{display:flex;justify-content:center;gap:2cqw;margin:2cqw 0;flex-wrap:wrap}
#result .meta span{background:#fff;border:.5cqw solid var(--ink);border-radius:999px;padding:.4cqw 2.6cqw;font-weight:600;font-size:3.4cqw}
#result .trivia{text-align:left;font-size:3.5cqw;line-height:1.45;background:#fff3dc;border:.5cqw dashed var(--wood-lt);border-radius:3.6cqw;padding:2.4cqw 3cqw;margin:1.6cqw 0 3cqw}
#result .trivia .next{margin-top:1.4cqw;font-size:3.1cqw;font-weight:600;color:#b3815c}
#result .reward{font-weight:700;font-size:5cqw;display:flex;align-items:center;justify-content:center;gap:1.6cqw;margin-bottom:3.4cqw}
#fishfade{position:absolute;inset:0;background:var(--cream);opacity:0;pointer-events:none;transition:opacity .3s}

@media (prefers-reduced-motion: reduce){
  #logo img,#tap,#sail .boatico{animation:none}
}
</style>
</head>

const tweens = [];

/* =========================================================
   Pastel pass: soften every material colour once
   ========================================================= */
const pastelDone = new WeakSet();
function pastelColor(c) {
  const hsl = {}; c.getHSL(hsl);
  c.setHSL(hsl.h, hsl.s * 0.72, hsl.l + (1 - hsl.l) * (hsl.l < 0.25 ? 0.08 : 0.22));
}
function pastelize(root = scene) {
  root.traverse(o => {
    if (!o.material) return;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
      if (pastelDone.has(m) || !m.color || m.userData.keepColor) return;
      pastelDone.add(m); pastelColor(m.color);
      if (m.emissive) pastelColor(m.emissive);
    });
  });
}

function flyTo(obj, parent, pos, quat, dur, arc = 0.5) {
  parent.attach(obj);
  const p0 = obj.position.clone(), q0 = obj.quaternion.clone(), s0 = obj.scale.clone(), one = V(1, 1, 1);
  return tween(dur, e => {

}

function ripple(x, z, size = 1, life = 1.8, op = 0.5, y = 0.03) {
  const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: op, depthWrite: false }));

}
function stepRipples(dt) {
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i]; r.t += dt; const p = r.t / r.life;
    if (p >= 1) { scene.remove(r.m); r.m.material.dispose(); ripples.splice(i, 1); continue; }
    r.m.scale.setScalar(r.size * (0.25 + p)); r.m.material.opacity = r.op * (1 - p);
  }
}

/*FISH3D*/
/* =========================================================
   3D fish models (2.5D style), generated from each fish's data:
   type (body plan + special parts), h (body height), c1/c2 (back/belly colours),
   fin colour and mark (pattern painted into vertex colours).
   Every model faces +X (head), is 1 unit long, centred on the origin.
   ========================================================= */
const Fish3D = (() => {
  const TAU = Math.PI * 2;
  const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
  const col = h => new THREE.Color(h);
  const mat = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.48, metalness: 0.03 }, o));
  const vmat = (o = {}) => new THREE.MeshStandardMaterial(Object.assign({ vertexColors: true, roughness: 0.42, metalness: 0.04 }, o));
  const SM = (s, a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return s ? t * t * (3 - 2 * t) : t; };
  const DOTS = [[.3, -.2], [-.1, -.28], [-.45, -.1], [.05, .05], [-.3, .18], [.45, -.05], [-.6, -.25], [.2, .22]];

  // ---------- pattern painter: (xn: tail -1 .. head +1, yn: belly -1 .. back +1) -> colour ----------
  function paint(f, xn, yn, base) {
    const c = base.clone(), dot = (dx, dy, r) => Math.hypot((xn - dx) * 2.2, (yn - dy) * 1.0) < r;
    const mix = (hex, k = 1) => c.lerp(col(hex), k);
    switch (f.mark) {
      case 'bands': for (const b of [.6, .05, -.55]) { const d = Math.abs(xn - b); if (d < .1) mix('#ffffff'); else if (d < .135) mix('#3a2a24'); } break;
      case 'idol': for (const b of [.45, -.15]) { const d = Math.abs(xn - b); if (d < .16) mix('#26222a'); } if (xn < -.55) mix('#ffd84a', .8); break;
      case 'stripe': if (Math.abs(yn + .05) < .2) mix('#ff8aa8', .55); for (const [dx, dy] of DOTS) if (dot(dx, -dy * 2, .07)) mix('#4a4a30', .5); break;
      case 'spots': for (const [dx, dy] of DOTS) if (dot(dx, -dy * 2.2 + .15, .1)) mix('#5a4128', .45); break;
      case 'whitespots': for (const [dx, dy] of DOTS) { if (dot(dx, -dy * 2, .08)) mix('#ffffff', .8); if (dot(dx * .8 + .12, -dy * 1.2 - .25, .06)) mix('#ffffff', .7); } break;
      case 'bluedots': for (const [dx, dy] of DOTS) if (dy < 0 && dot(dx, -dy * 2, .06)) mix('#5aaaff', .8); break;
      case 'lights': for (let i = 0; i < 7; i++) if (dot(-.7 + i * .2, -.55, .06)) mix('#c8fbff'); break;
      case 'scutes': if (Math.abs(yn - .05) < .05 && xn < .45 && Math.sin(xn * 60) > 0) mix('#46586e', .5); break;
      case 'yellow': if (dot(.25, .05, .17)) mix('#ffd65a', .85); break;
      case 'redscale': if (xn < -.25) mix('#e65046', .5 * SM(1, -.25, -.6, xn)); break;
      case 'oarspots': for (let i = 0; i < 12; i++) if (dot(-.8 + i * .13, i % 2 ? .2 : -.2, .05)) mix('#50596e', .5); break;
      case 'koi': if (dot(.42, .36, .26) || dot(-.15, .3, .26) || dot(-.62, .05, .16)) mix('#ff5a3c'); if (dot(-.4, -.1, .07)) mix('#282828', .7); break;
      case 'stripes': if (Math.sin(xn * 26) > .45) mix('#a03c28', .5); break;
      case 'bars': if (yn > -.1 && Math.sin(xn * 22) > .55) mix('#22304a', .35); break;

  if (!ui.menu.hidden) {
    const p = project(shown().root.position.clone().add(V(0, 0.8, 0)));

    ui.nextc.style.left = (p.x + off) + 'px'; ui.nextc.style.top = p.y + 'px';
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frameLoop);
}

const rand  = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp  = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn  = t => t * t * t;
const backOut = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const angLerp = (a, b, t) => { const d = ((b - a + Math.PI * 3) % TAU) - Math.PI; return a + d * Math.min(1, t); };

function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x+r, y); c.arcTo(x+w, y, x+w, y+h, r); c.arcTo(x+w, y+h, x, y+h, r); c.arcTo(x, y+h, x, y, r); c.arcTo(x, y, x+w, y, r); c.closePath(); }
function ell(c, x, y, rx, ry, rot = 0){ c.beginPath(); c.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, TAU); }
function fs(c, fill, lw){ c.fillStyle = fill; c.fill(); if (lw){ c.lineWidth = lw; c.strokeStyle = OUT; c.stroke(); } }
function txt(c, s, x, y, size, fill = '#fff', stroke = OUT, lw, align = 'center'){
  c.font = `800 ${size}px ${FONT}`; c.textAlign = align; c.textBaseline = 'middle'; c.lineJoin = 'round';
  if (stroke){ c.lineWidth = lw ?? size * 0.2; c.strokeStyle = stroke; c.strokeText(s, x, y); }
  c.fillStyle = fill; c.fillText(s, x, y);
}
function makeCanvas(w, h){
  const el = document.createElement('canvas'); el.width = w * 2; el.height = h * 2;
  const c = el.getContext('2d'); c.scale(2, 2); return { el, c };
}

// ---- Sea wave arcs (shared) ----
let WAVES = [];
function buildWaves(){ WAVES = []; for (let i = 0; i < 34; i++) WAVES.push({ x:Math.random(), y:Math.random(), v:rand(4,12), r:rand(6,12), p:rand(0,TAU) }); }
function drawWaveArcs(c, t, y0, y1, alpha = .7){
  c.save(); c.strokeStyle = '#fff'; c.lineCap = 'round'; c.lineWidth = 2.2 * S;
  const span = W + 60 * S;
  for (const w of WAVES){
    const x = ((w.x * span + t * w.v * S) % span) - 30 * S;
    const y = y0 + w.y * (y1 - y0) + Math.sin(t * 1.4 + w.p) * 3 * S;
    c.globalAlpha = alpha * (0.45 + 0.45 * Math.sin(t * 1.1 + w.p));
    c.beginPath(); c.arc(x, y, w.r * S, Math.PI * 1.2, Math.PI * 1.8); c.stroke();
  }
  c.restore();
}

// ---- Effects: ripples & water drops (shared by fishing + catch scenes) ----
const FX = { ripples:[], drops:[] };
function ripple(x, y, max, life = .9, delay = 0){ FX.ripples.push({ x, y, max, life, t:-delay }); }
function splash(x, y, n, pow = 1){
  for (let i = 0; i < n; i++) FX.drops.push({ x, y, vx:rand(-1,1)*60*S*pow, vy:rand(-1,1)*45*S*pow, z:0, vz:rand(70,150)*S*pow, life:rand(.4,.8), t:0 });
}
function updFx(dt){
  for (const r of FX.ripples) r.t += dt;
  FX.ripples = FX.ripples.filter(r => r.t < r.life);
  for (const d of FX.drops){ d.t += dt; d.x += d.vx*dt; d.y += d.vy*dt; d.vz -= 420*S*dt; d.z = Math.max(0, d.z + d.vz*dt); }
  FX.drops = FX.drops.filter(d => d.t < d.life);
}
function drawFx(){
  ctx.save(); ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff';
  for (const r of FX.ripples){ if (r.t < 0) continue; const k = r.t / r.life;
    ctx.globalAlpha = (1 - k) * .8; ctx.lineWidth = 2.5*S*(1-k) + .5; ell(ctx, r.x, r.y, r.max*k, r.max*k*.8); ctx.stroke(); }
  for (const d of FX.drops){ ctx.globalAlpha = 1 - d.t / d.life; ctx.beginPath(); ctx.arc(d.x, d.y - d.z, 2.6*S, 0, TAU); ctx.fill(); }
  ctx.restore();
}

// ---- 6a. Fish (faces right). L = total length in px. opt.sil = silhouette ----
const DOTS = [[.3,-.2],[-.1,-.28],[-.45,-.1],[.05,.05],[-.3,.18],[.45,-.05],[-.6,-.25],[.2,.22]];
function fishMarks(c, f, rx, h){
  c.lineWidth = Math.max(1, rx * .03);
  switch (f.mark){
    case 'bands':
      c.fillStyle = '#fff'; c.strokeStyle = OUT;
      for (const bx of [.6, .05, -.55]){ ell(c, bx*rx, 0, rx*.1, h*.62); c.fill(); c.stroke(); } break;
    case 'stripe':
      c.fillStyle = 'rgba(255,120,150,.6)'; c.fillRect(-rx, -h*.05, rx*2, h*.2);
      c.fillStyle = 'rgba(60,60,40,.35)'; for (const [dx,dy] of DOTS){ ell(c, dx*rx, dy*h - h*.05, rx*.03, rx*.03); c.fill(); } break;
    case 'spots':
      c.fillStyle = 'rgba(90,65,35,.45)'; for (const [dx,dy] of DOTS){ ell(c, dx*rx, dy*h*1.2 - h*.1, rx*.06, rx*.06); c.fill(); } break;
    case 'lights':
      c.save(); c.fillStyle = '#c8fbff'; c.shadowColor = '#7ff3ff'; c.shadowBlur = rx*.15;
      for (let i = 0; i < 7; i++){ ell(c, lerp(-rx*.7, rx*.5, i/6), h*.26, rx*.045, rx*.045); c.fill(); } c.restore(); break;
    case 'scutes':
      c.strokeStyle = 'rgba(70,90,110,.6)'; c.setLineDash([rx*.06, rx*.04]);
      c.beginPath(); c.moveTo(rx*.45, -h*.05); c.quadraticCurveTo(0, -h*.12, -rx*.95, 0); c.stroke(); c.setLineDash([]); break;
    case 'yellow':
      c.fillStyle = 'rgba(255,214,90,.85)'; ell(c, rx*.25, -h*.02, rx*.12, h*.14); c.fill(); break;
    case 'bluedots':
      c.fillStyle = 'rgba(90,170,255,.75)'; for (const [dx,dy] of DOTS){ if (dy < 0){ ell(c, dx*rx, dy*h, rx*.03, rx*.03); c.fill(); } } break;
    case 'redscale':
      c.fillStyle = 'rgba(230,80,70,.5)'; c.fillRect(-rx, -h/2, rx*.75, h); break;
    case 'oarspots':
      c.fillStyle = 'rgba(80,90,110,.45)'; for (let i = 0; i < 12; i++){ ell(c, lerp(-rx*.8, rx*.6, i/11), (i%2 ? -.1 : .12)*h, rx*.03, h*.12); c.fill(); } break;
    case 'whitespots':
      c.fillStyle = 'rgba(255,255,255,.7)'; for (const [dx,dy] of DOTS){ ell(c, dx*rx, dy*h, rx*.05, rx*.035); c.fill(); }
      for (const [dx,dy] of DOTS){ ell(c, dx*rx*.8 + rx*.12, dy*h*.6 + h*.12, rx*.03, rx*.025); c.fill(); } break;
    case 'scale':
      c.strokeStyle = 'rgba(255,255,255,.35)';
      for (let i = 0; i < 5; i++) for (let j = -1; j <= 1; j++){ c.beginPath(); c.arc(lerp(-rx*.6, rx*.3, i/4), j*h*.22, rx*.09, -1.2, 1.2); c.stroke(); } break;
    case 'koi':
      c.fillStyle = '#ff5a3c'; ell(c, rx*.42, -h*.18, rx*.24, h*.3); c.fill(); ell(c, -rx*.15, -h*.15, rx*.24, h*.3, .3); c.fill(); ell(c, -rx*.65, -h*.02, rx*.12, h*.2); c.fill();
      c.fillStyle = 'rgba(40,40,40,.7)'; ell(c, -rx*.4, h*.05, rx*.06, h*.1); c.fill(); break;
    case 'stripes':
      c.fillStyle = 'rgba(160,60,40,.55)'; for (let i = 0; i < 8; i++){ c.fillRect(lerp(-rx, rx*.7, i/7), -h/2, rx*.08, h); } break;
    case 'yline':
      c.fillStyle = 'rgba(255,214,60,.9)'; c.fillRect(-rx, -h*.07, rx*2, h*.14); break;
    case 'sardine':
      c.fillStyle = 'rgba(30,40,60,.55)'; for (let i = 0; i < 6; i++){ ell(c, lerp(rx*.3, -rx*.6, i/5), -h*.05, rx*.035, rx*.035); c.fill(); } break;
    case 'tang':
      c.fillStyle = 'rgba(20,30,60,.8)'; c.beginPath(); c.moveTo(rx*.55, -h*.2);
      c.quadraticCurveTo(-rx*.2, -h*.5, -rx*.85, -h*.08); c.quadraticCurveTo(-rx*.3, h*.05, rx*.1, -h*.05); c.quadraticCurveTo(rx*.45, -h*.02, rx*.55, -h*.2); c.fill(); break;
    case 'hexdots':
      c.fillStyle = 'rgba(40,30,20,.6)'; for (let i = -3; i <= 3; i++) for (let j = -1; j <= 1; j++){ ell(c, i*rx*.27 + (j%2 ? rx*.13 : 0), j*h*.28, rx*.04, rx*.04); c.fill(); } break;
  }
  // semi-3D highlight
  c.globalAlpha = .35; c.fillStyle = '#fff'; ell(c, rx*.1, -h*.24, rx*.5, h*.11); c.fill(); c.globalAlpha = 1;
}

    const g = c.createRadialGradient(0, 0, 0, 0, 0, R); g.addColorStop(0, col(f.c2)); g.addColorStop(1, col(f.c1));

};

function drawFishFlat(c, f, x, y, L, t = 0, opt = {}){
  const sil = !!opt.sil, lw = Math.max(1.5, L * .028), ty = f.type;

  if (SPECIAL_FISH[ty]){ SPECIAL_FISH[ty](c, f, L, t, sil, col, lw, SO); c.restore(); return; }

  const h = L * f.h;
  const longT = ty === 'oar' || ty === 'eel' || ty === 'gulper';
  const rx = longT ? L*.46 : ty === 'rattail' ? L*.3 : ty === 'mola' ? L*.34 : L*.4;
  c.translate(ty === 'rattail' ? L*.18 : L*.08, 0);
  const wig = Math.sin(t * 9) * .12 * h;
  const strokeFill = (fill) => { c.fillStyle = fill; c.fill(); c.lineWidth = lw; c.strokeStyle = SO; c.stroke(); };

  // ---- TAIL ----
  if (ty === 'mola'){
    c.beginPath(); c.moveTo(-rx*.8, -h*.42);
    for (let i = 0; i <= 8; i++){ const a = -Math.PI/2 + i/8 * Math.PI; c.lineTo(-rx*.8 - Math.cos(a)*L*.1 - (i % 2 ? L*.025 : 0), Math.sin(a)*h*.42); }
    c.closePath(); strokeFill(col(f.fin));
  } else if (ty === 'rattail'){
    c.beginPath(); c.moveTo(-rx*.5, -h*.32); c.quadraticCurveTo(-rx - L*.18, wig*.5, -rx - L*.4, wig); c.quadraticCurveTo(-rx - L*.18, wig*.5, -rx*.5, h*.32); c.closePath(); strokeFill(col(f.c1));
  } else if (ty === 'shark' || ty === 'sword'){

    c.quadraticCurveTo(-rx - tl*.45, 0, -rx - tl, h*th + wig);
    c.quadraticCurveTo(-rx - tl*.5, h*.2, -rx*.85, 0); c.closePath();

  if (ty === 'oar'){
    c.beginPath(); c.moveTo(-rx*.9, -h*.35);
    for (let i = 0; i <= 14; i++){ const px = lerp(-rx*.9, rx*.85, i/14); c.lineTo(px, -h*.5 - (i%2 ? h*.9 : h*.45) - Math.sin(t*6 + i)*h*.12); }
    c.lineTo(rx*.85, -h*.35); c.closePath(); strokeFill(col('#ff5a5a'));
    c.beginPath(); c.moveTo(rx*.8, -h*.4); c.quadraticCurveTo(rx*.95, -h*3.2, rx*.7, -h*3.6); c.lineWidth = lw*1.6; c.strokeStyle = col('#ff5a5a'); c.stroke(); c.lineWidth = lw; c.strokeStyle = SO;
  } else if (longT){
    c.beginPath(); c.moveTo(-rx*.95, -h*.2); c.quadraticCurveTo(-rx*.2, -h*1.25, rx*.35, -h*.3); c.closePath(); strokeFill(col(f.fin));
    c.beginPath(); c.moveTo(-rx*.95, h*.2); c.quadraticCurveTo(-rx*.3, h*1.05, rx*.1, h*.3); c.closePath(); strokeFill(col(f.fin));
  } else if (ty === 'tuna' || ty === 'sword'){
    c.beginPath(); c.moveTo(-L*.12, -h*.4); c.lineTo(-L*.02, -h*(ty === 'sword' ? 1.3 : .95)); c.lineTo(L*.08, -h*.42); c.closePath(); strokeFill(col(f.fin));
    c.fillStyle = col('#ffd84d');
    for (let i = 0; i < 4; i++){ const px = lerp(-rx*.35, -rx*.8, i/3);
      c.beginPath(); c.moveTo(px, -h*.3); c.lineTo(px - L*.02, -h*.45); c.lineTo(px - L*.04, -h*.27); c.fill();
      c.beginPath(); c.moveTo(px, h*.3); c.lineTo(px - L*.02, h*.45); c.lineTo(px - L*.04, h*.27); c.fill(); }
  } else if (ty === 'shark'){
    c.beginPath(); c.moveTo(-L*.1, -h*.4); c.lineTo(-L*.04, -h*1.15); c.lineTo(L*.08, -h*.42); c.closePath(); strokeFill(col(f.fin));
    c.beginPath(); c.moveTo(-rx*.55, -h*.35); c.lineTo(-rx*.62, -h*.7); c.lineTo(-rx*.45, -h*.38); c.closePath(); strokeFill(col(f.fin));
  } else if (ty === 'mola'){
    c.beginPath(); c.moveTo(-rx*.6, -h*.38); c.lineTo(-rx*.75, -h*1.05); c.lineTo(-rx*.3, -h*.42); c.closePath(); strokeFill(col(f.fin));
    c.beginPath(); c.moveTo(-rx*.6, h*.38); c.lineTo(-rx*.75, h*1.05); c.lineTo(-rx*.3, h*.42); c.closePath(); strokeFill(col(f.fin));
  } else if (ty === 'lion'){
    for (let i = 0; i < 8; i++){ const px = lerp(-rx*.7, rx*.45, i/7), tipY = -h*(1.15 + (i%2)*.3) + Math.sin(t*3 + i)*h*.05;
      c.beginPath(); c.moveTo(px, -h*.35); c.lineTo(px - L*.05, tipY); c.lineWidth = lw*2.4; c.strokeStyle = SO; c.stroke(); c.lineWidth = lw*1.2; c.strokeStyle = col(i%2 ? '#fff3ea' : f.fin); c.stroke(); }
    c.lineWidth = lw; c.strokeStyle = SO;
  } else if (ty !== 'flat' && ty !== 'rattail' && ty !== 'box'){
    c.beginPath(); c.moveTo(-L*.18, -h*.4); c.quadraticCurveTo(-L*.02, -h*.95, L*.12, -h*.42); c.closePath(); strokeFill(col(f.fin));
  }
  if (ty === 'flat' || ty === 'rattail'){
    c.beginPath(); c.moveTo(-rx*.95, -h*.15); c.quadraticCurveTo(-rx*.1, -h*.9, rx*.6, -h*.3); c.closePath(); strokeFill(col(f.fin));
    c.beginPath(); c.moveTo(-rx*.95, h*.15); c.quadraticCurveTo(-rx*.1, h*.9, rx*.5, h*.3); c.closePath(); strokeFill(col(f.fin));
  }
  // under fin
  if (ty === 'lobe'){ for (const fx of [.15, -.35]){ ell(c, fx*rx, h*.5, rx*.14, h*.2, .5); strokeFill(col(f.fin)); } }
  else if (!longT && ty !== 'mola' && ty !== 'flat' && ty !== 'rattail' && ty !== 'shark'){
    c.beginPath(); c.moveTo(-L*.02, h*.38); c.quadraticCurveTo(L*.02, h*.78, L*.1, h*.4); c.closePath(); strokeFill(col(f.fin));
  }

  }
  // snouts / bills that sit behind the head
  if (ty === 'shark' && f.snout){ ell(c, rx*.75 + L*f.snout*.5, -h*.06, L*f.snout*.6 + rx*.1, h*.17, -.04); strokeFill(col(f.c1)); }
  if (ty === 'sword'){ c.beginPath(); c.moveTo(rx*.8, -h*.1); c.lineTo(rx + L*.36, -h*.02); c.lineTo(rx*.8, h*.08); c.closePath(); strokeFill(col(f.c1)); }

  // ---- BODY ----
  const bodyPath = () => { if (ty === 'box') rr(c, -rx, -h/2, rx*2, h, h*.32); else ell(c, 0, 0, rx, h/2); };
  const g = c.createLinearGradient(0, -h/2, 0, h/2); g.addColorStop(0, col(f.c1)); g.addColorStop(1, col(f.c2));
  bodyPath(); c.fillStyle = g; c.fill();
  if (!sil){ c.save(); bodyPath(); c.clip(); fishMarks(c, f, rx, h); c.restore(); }
  bodyPath(); c.lineWidth = lw; c.strokeStyle = SO; c.stroke();
  if (ty === 'shark'){ c.lineWidth = lw*.7; for (let i = 0; i < 4; i++){ const gx = rx*(.42 - i*.07); c.beginPath(); c.moveTo(gx, -h*.18); c.lineTo(gx - rx*.03, h*.15); c.stroke(); } }
  else if (!longT && ty !== 'box' && ty !== 'barrel'){ c.beginPath(); c.arc(rx*.55, 0, h*.38, Math.PI*.7, Math.PI*1.3); c.lineWidth = lw*.7; c.stroke(); }
  c.lineWidth = lw;

  // ---- FINS in front ----
  if (ty === 'wing'){ const fl = Math.sin(t * 6) * h * .3;
    c.save(); c.globalAlpha = sil ? 1 : .88; c.beginPath(); c.moveTo(rx*.35, -h*.05); c.quadraticCurveTo(-rx*.15, -h*2.4 + fl, -rx*.95, -h*1.7 + fl);
    c.quadraticCurveTo(-rx*.35, -h*.75, rx*.1, h*.12); c.closePath(); strokeFill(col(f.fin));
    if (!sil){ c.strokeStyle = 'rgba(255,255,255,.6)'; for (let i = 1; i < 4; i++){ c.beginPath(); c.moveTo(rx*.25, 0); c.lineTo(lerp(-rx*.2, -rx*.9, i/4), -h*(2 - i*.25) + fl); c.stroke(); } }
    c.restore(); c.strokeStyle = SO; }
  if (ty === 'lion'){
    for (let i = 0; i < 6; i++){ const a = Math.PI*.55 + i*.13 + Math.sin(t*2)*.04;
      c.beginPath(); c.moveTo(rx*.25, h*.1); c.lineTo(rx*.25 + Math.cos(a)*L*.34, h*.1 + Math.sin(a)*L*.34);
      c.lineWidth = lw*3; c.strokeStyle = SO; c.stroke(); c.lineWidth = lw*1.6; c.strokeStyle = col(i%2 ? '#fff3ea' : '#d9785a'); c.stroke(); }

  }

    c.beginPath(); c.moveTo(rx*.95, h*.05); c.quadraticCurveTo(rx*1.3, h*.1, rx*1.25, h*.6);

    c.beginPath(); c.moveTo(rx*.4, -h*.45); c.quadraticCurveTo(rx*.9, -h*1.1, rx*1.2, -h*.55); c.stroke();
    c.save(); if (!sil){ c.shadowColor = '#fff6a8'; c.shadowBlur = L*.15; }

  }

    c.save(); ell(c, rx*.45, -h*.4, rx*.36, h*.52); c.fillStyle = sil ? '#8a96a2' : 'rgba(210,245,255,.5)'; c.fill(); c.lineWidth = lw*.7; c.stroke(); c.restore();

  }

  // ---- EYE ----
  const eye = (ex, ey, er) => { ell(c, ex, ey, er, er); c.fillStyle = sil ? SO : '#fff'; c.fill();
    if (!sil){ c.lineWidth = lw*.7; c.strokeStyle = SO; c.stroke(); ell(c, ex + er*.15, ey, er*.6, er*.6); c.fillStyle = OUT; c.fill(); ell(c, ex - er*.05, ey - er*.25, er*.22, er*.22); c.fillStyle = '#fff'; c.fill(); } };

    eye(ex, ey, er);

    if (ty === 'skipper') eye(ex - rx*.14, ey - h*.04, er);
  }
  c.restore();
}

// Dark shadow used for swimming fish (top view)
function drawShadowFish(c, x, y, len, ang, t, alpha = .45){
  c.save(); c.translate(x, y); c.rotate(ang); c.globalAlpha = alpha; c.fillStyle = '#1b4866';

}

// ---- 6b. Characters (front view: menus / hut) ----

  ell(c, 0, -34, 31, 29); fs(c, ch.shell, LW);                                                 // shell / outfit
  c.globalAlpha = .5; ell(c, -14, -46, 9, 5, -.5); fs(c, '#fff'); c.globalAlpha = 1;

  c.strokeStyle = '#e6cc9c'; c.lineWidth = 2; c.beginPath(); c.moveTo(-14, -31); c.lineTo(14, -31); c.moveTo(0, -48); c.lineTo(0, -14); c.stroke();
  const oval = ch.head === 'oval';
  ell(c, 0, -84, oval ? 33 : 37, oval ? 37 : 33); fs(c, ch.skin, LW);                          // head
  c.globalAlpha = .4; ell(c, -13, -100, 12, 6, -.4); fs(c, '#fff'); c.globalAlpha = 1;
  // eyes
  const ey = -84, ex = 13, eyeCol = ch.id === 'popo' ? '#a8714a' : '#6b3a22';
  for (const sx of [-1, 1]){ ell(c, sx*ex, ey, 4.6, 6.2); fs(c, eyeCol); }
  if (ch.extra === 'fade'){ c.save(); c.beginPath(); c.rect(-ex-6, ey-8, 12, 8); c.clip(); ell(c, -ex, ey, 4.6, 6.2); fs(c, '#a8908c'); c.restore(); }
  for (const sx of [-1, 1]){ ell(c, sx*ex - 1.4, ey - 2.6, 1.7, 2); fs(c, '#fff'); }
  if (ch.extra === 'bow'){ c.strokeStyle = OUT; c.lineWidth = 2; for (const sx of [-1, 1]){ c.beginPath(); c.moveTo(sx*(ex+4), ey-4); c.lineTo(sx*(ex+8), ey-7); c.stroke(); } }

    c.beginPath(); c.moveTo(0,0); c.lineTo(-13,-9); c.lineTo(-13,9); c.closePath(); fs(c, '#ff8fb0', 2.5);
    c.beginPath(); c.moveTo(0,0); c.lineTo(13,-9); c.lineTo(13,9); c.closePath(); fs(c, '#ff8fb0', 2.5);

// ---- 6c. Characters (top view: sitting on the boat) ----

  if (ch.extra === 'bow'){ c.save(); c.translate(9, -28); c.beginPath(); c.moveTo(0,0); c.lineTo(-7,-5); c.lineTo(-7,5); c.closePath(); fs(c, '#ff8fb0', 2);
    c.beginPath(); c.moveTo(0,0); c.lineTo(7,-5); c.lineTo(7,5); c.closePath(); fs(c, '#ff8fb0', 2); c.restore(); }
  if (ch.extra === 'hat'){ ell(c, 0, -33, 19, 19); fs(c, '#f1e3c2', 2.5); ell(c, 0, -33, 10, 10); fs(c, '#f6ead0', 2); }
  ell(c, 0, 0, 27, 31); fs(c, ch.shell, 2.5);
  c.strokeStyle = ch.shellD; c.lineWidth = 2.5; c.beginPath();
  for (let i = 0; i < 6; i++){ const a = i / 6 * TAU - Math.PI/2; const px = Math.cos(a)*10, py = Math.sin(a)*11; i ? c.lineTo(px, py) : c.moveTo(px, py); }
  c.closePath();
  for (let i = 0; i < 6; i++){ const a = i / 6 * TAU - Math.PI/2; c.moveTo(Math.cos(a)*10, Math.sin(a)*11); c.lineTo(Math.cos(a)*24, Math.sin(a)*28); }
  c.stroke();
  c.globalAlpha = .4; ell(c, -9, -12, 9, 5, -.5); fs(c, '#fff'); c.globalAlpha = 1;
  c.restore();
}

function drawCloud(c, x, y, s){
  c.save(); c.fillStyle = '#fff'; c.globalAlpha = .95;
  for (const [dx, dy, r] of [[-28,6,18],[0,0,24],[28,6,18],[12,10,16],[-12,10,16]]){ c.beginPath(); c.arc(x + dx*s, y + dy*s, r*s, 0, TAU); c.fill(); }
  c.restore();
}

/* =====================================================================
   JS 10. SCENE: FISHING (top view — 70% sea, 30% boat)
   States: idle → casting → waiting → nibble → bite → hooked → zoom
   ===================================================================== */
const F = {};
const SEA_LIMIT = () => H * .64;      // can only cast above this line
let fishCount = 0;                    // catches this session (bucket)

function initFishing(){
  Object.assign(F, { state:'idle', bob:null, cast:null, wait:0, appr:null, nib:0, nibT:0, biteT:0, dip:0, sink:0, hookT:0, zoomT:0,
    msg:'Tap the sea to cast!', msgT:0, rT:0, shadows:[], fish:null });
  FX.ripples = []; FX.drops = [];
  for (let i = 0; i < 5; i++) F.shadows.push(newShadow(false));
  scene = 'fishing'; hideAll(); showLayer('fishHUD'); updateHUD();
}
function newShadow(edge){
  const left = Math.random() < .5;
  return { x: edge ? (left ? -30*S : W + 30*S) : rand(.1, .9) * W, y: rand(.06, .58) * H,
           a: edge ? (left ? rand(-.4, .4) : Math.PI + rand(-.4, .4)) : rand(0, TAU),
           v: rand(10, 22), s: rand(.75, 1.05), turn:0, turnT:rand(1, 3), flee:0, al: edge ? 0 : 1 };
}
function updateHUD(){
  const a = ATTACH.find(x => x.id === save.equip) || ATTACH[0];
  document.getElementById('lureTag').textContent = `${a.icon} ${a.name}`;
  document.getElementById('bucketTag').textContent = `🪣 ${fishCount}`;
  refreshCoins();
}
function setMsg(m, time){ F.msg = m; F.msgT = time; }
function rodTip(){
  const bend = (F.state === 'bite' || F.state === 'hooked' || F.state === 'zoom') ? 16*S : F.dip * 6*S;
  return { x: W/2 + Math.sin(T * 1.3) * 2*S + (F.bob ? (F.bob.x - W/2) * .05 : 0), y: H * .4 + bend };
}

// ---- 10a. Rarity roll (attachments + rod + character) ----
function weighted(obj){ let tot = 0; for (const k in obj) tot += obj[k]; let r = Math.random() * tot; for (const k in obj){ r -= obj[k]; if (r <= 0) return k; } return Object.keys(obj)[0]; }
function pickFish(){
  const tr = traits(), att = ATTACH.find(a => a.id === save.equip);
  const hw = { river:1, ocean:1, deep:.7 }; if (att && att.hab) hw[att.hab] *= 3.5;
  const hab = weighted(hw), r = save.rod.rare;
  const sw = { 1: BAL.starWeights[0], 2: BAL.starWeights[1] + r*5, 3: BAL.starWeights[2] + r*3 };
  const star = +weighted(sw);
  let pool = FISH.filter(f => f.hab === hab && f.star === star); if (!pool.length) pool = FISH.filter(f => f.hab === hab);
  return pool[Math.floor(Math.random() * pool.length)];
}

// ---- 10b. Update ----
function updShadows(dt){
  for (const sh of F.shadows){
    sh.al = Math.min(1, sh.al + dt);
    if (sh === F.appr && F.bob){
      const dx = F.bob.x - sh.x, dy = F.bob.y - sh.y, d = Math.hypot(dx, dy);
      sh.a = angLerp(sh.a, Math.atan2(dy, dx), dt * 3);
      if (F.state === 'waiting'){
        const sp = Math.min(d, 42*S*dt); sh.x += Math.cos(sh.a) * sp; sh.y += Math.sin(sh.a) * sp;
        if (d < 14*S){ F.state = 'nibble'; F.nib = Math.floor(rand(0, 3)); F.nibT = rand(.5, 1); }
      } else {
        const j = F.state === 'bite' || F.state === 'hooked' ? 4*S : 0;
        sh.x = lerp(sh.x, F.bob.x - Math.cos(sh.a)*12*S + rand(-j, j), dt*5); sh.y = lerp(sh.y, F.bob.y - Math.sin(sh.a)*12*S + rand(-j, j), dt*5);
      }
      continue;
    }
    if (sh.flee > 0){ sh.flee -= dt; sh.x += Math.cos(sh.a) * 90*S*dt; sh.y += Math.sin(sh.a) * 90*S*dt; }
    else { sh.turnT -= dt; if (sh.turnT <= 0){ sh.turn = rand(-1, 1); sh.turnT = rand(1, 3); }
      sh.a += sh.turn * dt * .8; sh.x += Math.cos(sh.a) * sh.v*S*dt; sh.y += Math.sin(sh.a) * sh.v*S*dt; }
    if (sh.x < -45*S || sh.x > W + 45*S || sh.y < -45*S || sh.y > H * .66) Object.assign(sh, newShadow(true));
  }
}
function updFishing(dt){
  updShadows(dt); updFx(dt);
  F.dip = Math.max(0, F.dip - dt * 3);
  if (F.msgT > 0) F.msgT -= dt;
  if (F.bob && (F.state === 'waiting' || F.state === 'nibble')){ F.rT -= dt; if (F.rT <= 0){ F.rT = 1.6; ripple(F.bob.x, F.bob.y, 18*S, 1.2); } }
  switch (F.state){
    case 'casting':
      F.cast.t += dt / .6;
      if (F.cast.t >= 1){ F.bob = { x:F.cast.tx, y:F.cast.ty }; F.state = 'waiting'; F.wait = rand(1.2, 3.5);
        splash(F.bob.x, F.bob.y, 6, .6); ripple(F.bob.x, F.bob.y, 30*S, .9); setMsg('Wait for a bite…', 1.8); }
      break;
    case 'waiting':
      if (traits().bait && F.bob) baitDrift(dt);
      if (!F.appr){ F.wait -= dt; if (F.wait <= 0) startApproach(); }
      break;
    case 'nibble':
      F.nibT -= dt;
      if (F.nibT <= 0){
        if (F.nib > 0){ F.nib--; F.dip = 1; ripple(F.bob.x, F.bob.y, 22*S, .6); F.nibT = rand(.6, 1.25); }
        else startBite();
      }
      break;
    case 'bite': F.biteT -= dt; F.sink = Math.min(1, F.sink + dt * 6); if (F.biteT <= 0) fishEscapes('It got away…'); break;
    case 'hooked': F.hookT += dt; if (F.hookT > .85){ F.state = 'zoom'; F.zoomT = 0; } break;
    case 'zoom': F.zoomT += dt / .6; if (F.zoomT >= 1) startCatch(F.fish); break;
  }
}
// Dr. Mo's Baits: bobber swims towards the nearest fish and calls it over early
function baitDrift(dt){
  let best = F.appr, bd = 1e9;
  if (!best) for (const sh of F.shadows){ if (sh.flee > 0) continue; const d = Math.hypot(sh.x - F.bob.x, sh.y - F.bob.y); if (d < bd){ bd = d; best = sh; } }
  if (!best) return;
  const dx = best.x - F.bob.x, dy = best.y - F.bob.y, d = Math.hypot(dx, dy) || 1;
  const sp = Math.min(d, 28*S*dt);
  F.bob.x = clamp(F.bob.x + dx/d*sp, 20*S, W - 20*S); F.bob.y = clamp(F.bob.y + dy/d*sp, 50*S, H*.6);
  F.trailT = (F.trailT || 0) - dt; if (F.trailT <= 0){ F.trailT = .35; ripple(F.bob.x, F.bob.y, 12*S, .6); }
  if (!F.appr && d < 70*S) F.wait = Math.min(F.wait, .2);   // fish notices the bait right away
}
function startApproach(){
  let best = null, bd = 1e9;
  for (const sh of F.shadows){ if (sh.flee > 0) continue; const d = Math.hypot(sh.x - F.bob.x, sh.y - F.bob.y); if (d < bd){ bd = d; best = sh; } }
  if (!best){ F.wait = 1; return; }
  F.appr = best; F.fish = pickFish(); best.s = [.85, 1.1, 1.45][F.fish.star - 1];
}
function startBite(){
  F.state = 'bite'; F.sink = 0;
  F.biteT = .62 * traits().biteMul * BAL.biteStar[F.fish.star - 1]; F.biteMax = F.biteT; F.burstDone = false; hostSfx('bite');
  splash(F.bob.x, F.bob.y, 14, 1); ripple(F.bob.x, F.bob.y, 40*S, .7); ripple(F.bob.x, F.bob.y, 55*S, .8, .15); vibrate(60);
}
function fishEscapes(msg){
  if (F.appr){ F.appr.flee = 1.2; F.appr.a = rand(0, TAU); }
  F.appr = null; F.fish = null; F.sink = 0; F.state = 'waiting'; F.wait = rand(1.8, 3.5); setMsg(msg, 1.8);
}
function fishingTap(p){
  if (F.state === 'bite'){ F.state = 'hooked'; F.hookT = 0; F.msgT = 0; vibrate([30, 40, 30]); splash(F.bob.x, F.bob.y, 18, 1.3); return; }
  if (F.state === 'nibble'){ fishEscapes('Too early! It got spooked.'); return; }
  if ((F.state === 'idle' || F.state === 'waiting') && p.y < SEA_LIMIT()){
    if (F.appr){ F.appr.flee = 1; F.appr.a = rand(0, TAU); F.appr = null; }
    const tip = rodTip();
    F.cast = { fx:tip.x, fy:tip.y, tx:clamp(p.x, 20*S, W - 20*S), ty:clamp(p.y, 50*S, H * .6), t:0 };
    F.bob = null; F.state = 'casting'; F.sink = 0; F.msgT = 0;
  }
}

// ---- 10c. Draw ----
function drawSeaTop(t){
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#79c9e5'); g.addColorStop(1, '#a6dff0');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = .16; ctx.fillStyle = '#fff';
  for (let i = 0; i < 7; i++){ const x = ((i * 97*S + t * 6*S) % (W + 140*S)) - 70*S, y = ((i * 163) % 100) / 100 * H * .7; ell(ctx, x, y, 55*S, 16*S); ctx.fill(); }
  ctx.restore();
  drawWaveArcs(ctx, t, 0, H * .75, .7);
}
function drawBobber(x, y, sc, sink){
  ctx.save(); ctx.translate(x, y + Math.sin(T * 3) * 1.5*S);
  ctx.globalAlpha = 1 - sink * .85;
  const r = 7.5*S * sc * (1 - sink * .4);
  ell(ctx, 0, 0, r, r); fs(ctx, '#fff', 2.2*S);
  ctx.beginPath(); ctx.arc(0, 0, r, Math.PI, TAU); ctx.closePath(); fs(ctx, '#ef4a4a', 2.2*S);
  ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(0, -r - 6*S*sc); ctx.lineWidth = 2*S; ctx.strokeStyle = OUT; ctx.stroke();
  ctx.restore();
}
function drawBoat(t){
  const cx = W/2, tipY = H * .7, bot = H + 30*S, half = W * .44;
  ctx.save(); ctx.globalAlpha = .22; ctx.beginPath(); ctx.moveTo(cx + 6*S, tipY + 10*S); ctx.lineTo(cx - half + 6*S, bot); ctx.lineTo(cx + half + 6*S, bot); ctx.closePath(); fs(ctx, '#1b4866'); ctx.restore();
  // red rim
  ctx.beginPath(); ctx.moveTo(cx, tipY); ctx.lineTo(cx - half, bot); ctx.lineTo(cx + half, bot); ctx.closePath(); fs(ctx, '#f04848', 3.5*S);
  // deck
  const ins = 15*S;
  ctx.beginPath(); ctx.moveTo(cx, tipY + ins * 2.1); ctx.lineTo(cx - half + ins * 1.9, bot); ctx.lineTo(cx + half - ins * 1.9, bot); ctx.closePath(); fs(ctx, '#f2e2b3', 3*S);
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#e0cb94'; ctx.lineWidth = 2*S;
  for (let y = tipY + 30*S; y < H; y += 20*S){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  // tackle box & bucket
  rr(ctx, cx - 92*S, H * .925, 38*S, 26*S, 5*S); fs(ctx, '#7cc4e8', 2.5*S); ctx.fillStyle = OUT; ctx.fillRect(cx - 80*S, H * .925 + 10*S, 14*S, 3*S);
  ell(ctx, cx + 76*S, H * .94, 17*S, 17*S); fs(ctx, '#ffd36e', 2.5*S); ell(ctx, cx + 76*S, H * .94, 11*S, 11*S); fs(ctx, '#7fc8e3', 2*S);
  if (fishCount > 0){ ctx.save(); ctx.beginPath(); ctx.arc(cx + 76*S, H * .94, 11*S, 0, TAU); ctx.clip(); drawShadowFish(ctx, cx + 76*S, H * .94, 16*S, t * .8, t, .5); ctx.restore(); }
  ctx.restore();
  // character + rod
  const ch = curChar();
  let bx = cx + 18*S, by = H * .895 - 8*S;
  if (hasSprite(ch)){
    const sh = 92*S, scx = cx - 14*S, sby = H * .975;
    ctx.save(); ctx.globalAlpha = .18; ell(ctx, scx, sby - 4*S, 40*S, 8*S); fs(ctx, OUT); ctx.restore();
    drawSprite(ctx, ch, scx, sby, sh, t);
    bx = scx + sh * .36; by = sby - sh * .3;          // right hand
  } else drawCharTop(ctx, ch, cx, H * .895, 1.05*S, t);
  const tip = rodTip();
  ctx.lineCap = 'round';
  ctx.strokeStyle = OUT; ctx.lineWidth = 9*S; ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(tip.x, tip.y); ctx.stroke();
  ctx.strokeStyle = '#8a8f99'; ctx.lineWidth = 5.5*S; ctx.stroke();
  ctx.strokeStyle = '#b5bac3'; ctx.lineWidth = 1.6*S; ctx.beginPath(); ctx.moveTo(bx - 1*S, by - 4*S); ctx.lineTo(tip.x - 1*S, tip.y + 4*S); ctx.stroke();
  const rx = lerp(bx, tip.x, .1) + 9*S, ry = lerp(by, tip.y, .1);
  ell(ctx, rx, ry, 7*S, 7*S); fs(ctx, '#d9dde3', 2.5*S); ell(ctx, rx, ry, 2.5*S, 2.5*S); fs(ctx, OUT);
  return tip;
}
function drawFishing(t){
  ctx.save();
  if (F.state === 'zoom' && F.bob){ const k = 1 + 2.8 * easeIn(F.zoomT); ctx.translate(F.bob.x, F.bob.y); ctx.scale(k, k); ctx.translate(-F.bob.x, -F.bob.y); }
  drawSeaTop(t);
  for (const sh of F.shadows) drawShadowFish(ctx, sh.x, sh.y, 40*S*sh.s, sh.a, t, .32 * sh.al);
  drawFx();
  // fishing line (drawn before boat so it tucks under the rod)
  const tip = rodTip();
  let bp = null, sc = 1;
  if (F.state === 'casting'){ const k = easeOut(F.cast.t); bp = { x:lerp(F.cast.fx, F.cast.tx, k), y:lerp(F.cast.fy, F.cast.ty, k) }; sc = 1 + .7 * Math.sin(Math.PI * F.cast.t); }
  else if (F.bob) bp = { x:F.bob.x, y:F.bob.y + F.dip * 3*S };
  if (bp){
    const tight = F.state === 'bite' || F.state === 'hooked' || F.state === 'zoom';
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.6*S; ctx.beginPath(); ctx.moveTo(tip.x, tip.y);
    ctx.quadraticCurveTo((tip.x + bp.x) / 2 + (tight ? 0 : 14*S), (tip.y + bp.y) / 2 + (tight ? 0 : 18*S), bp.x, bp.y); ctx.stroke();
    drawBobber(bp.x, bp.y, sc, F.sink);
  }
  drawBoat(t);
  ctx.restore();

  drawBiteAlert(t);
  // message pill
  const showMsg = F.state === 'idle' ? 'Tap the sea to cast!' : (F.msgT > 0 ? F.msg : '');
  if (showMsg){
    ctx.save(); ctx.globalAlpha = F.state === 'idle' ? .75 + .25 * Math.sin(t * 4) : Math.min(1, F.msgT * 3);
    ctx.font = `800 ${16*S}px ${FONT}`; const tw = ctx.measureText(showMsg).width + 30*S;
    rr(ctx, W/2 - tw/2, H * .1, tw, 34*S, 17*S); fs(ctx, 'rgba(255,253,246,.92)', 2.5*S);
    txt(ctx, showMsg, W/2, H * .1 + 17*S, 16*S, OUT, null); ctx.restore();
  }
  if (F.state === 'hooked' || F.state === 'zoom') drawHookedBurst(F.state === 'hooked' ? F.hookT : 1, t);
  if (F.state === 'zoom'){ ctx.fillStyle = `rgba(255,255,255,${F.zoomT})`; ctx.fillRect(0, 0, W, H); }
}

/* =====================================================================
   JS 11. SCENE: CATCH — the 4 fishing gimmicks
   1. Bite (done in fishing scene)  2. Reel (draw circles)
   3. Tug (drag opposite the fish)  4. Final Pull (tap in zone)
   ===================================================================== */
const C = {};
function startCatch(fish){
  scene = 'catch'; hideAll();
  Object.assign(C, { fish, phase:'reel', idx:1, pt:0, banner:'Reel it in!', bannerT:0,
    dist:100, time:25, reelAng:0, rdir:0, anti:0, lv:null, ax:0, ay:0, trail:[], dash:0, dashT:rand(2, 4),
    fx:W/2, fy:H*.3, fa:-Math.PI/2, tension:15, prog:0, need:1, fdir:0, dirT:0, grace:0, good:false,
    np:0, nv:1, speed:1, zc:.5, zw:.2, chances:2, shake:0, hitMsg:'', hitT:0, msg:'', failT:0, landT:0, perfect:false, shown:false });
  FX.ripples = []; FX.drops = [];
  splash(W/2, H*.3, 18, 1.3); ripple(W/2, H*.3, 70*S, 1); ripple(W/2, H*.3, 100*S, 1.2, .2);
}
function enterPhase(p){
  C.phase = p; C.pt = 0; C.bannerT = 0;
  const si = C.fish.star - 1, tr = traits();
  if (p === 'tug'){ C.idx = 2; C.banner = 'Fight!'; C.need = 3.4 * tr.tugEase * BAL.tugNeed[si]; C.prog = 0; C.tension = 15;
    C.fa = rand(0, TAU); C.turn = 0; C.turnT = 0; C.thrash = 0; C.thrashT = rand(2.5, 4); C.eff = 0; C.jx = 0; C.jy = 0; C.jm = 0; }
  if (p === 'final'){ C.idx = 3; C.banner = 'Final Pull!'; C.np = 0; C.nv = 1; C.speed = BAL.finalSpeed[si] * tr.finalSlow[si];
    C.zw = clamp(.2 * tr.zoneMul * BAL.finalZone[si], .08, .5); C.zc = rand(.25, .75); C.chances = C.maxCh = tr.hearts; C.allPerfect = tr.allPerfect; }
  splash(C.fx, C.fy, 10, 1); vibrate(30);
}
function fail(msg){ C.phase = 'fail'; C.msg = msg; C.failT = 0; vibrate(120); splash(C.fx, C.fy, 14, 1.2); }

// ---- 11a. Reel: turning of the finger's path (any position on screen) ----
function reelInput(dx, dy){
  if (C.lv){
    const d = Math.atan2(C.lv.x * dy - C.lv.y * dx, C.lv.x * dx + C.lv.y * dy);
    if (Math.abs(d) < 1.2){                       // sharp zig-zags don't count
      if (C.rdir === 0 && Math.abs(d) > .05) C.rdir = Math.sign(d);
      if (Math.sign(d) === C.rdir){
        const power = 14 * (1 + .25 * save.rod.reel) / BAL.reelHard[C.fish.star - 1];
        C.dist -= Math.abs(d) / TAU * power; C.reelAng += Math.abs(d) * 1.5; onReelTick(Math.abs(d));
      } else { C.anti += Math.abs(d); if (C.anti > Math.PI){ C.rdir = Math.sign(d); C.anti = 0; } }
    }
  }
  C.lv = { x:dx, y:dy };
}
// ---- 11b. Tug: real-time fight ----
// Hold anywhere = a joystick appears under your finger. Keep pulling/pushing AGAINST the way the fish swims.
const TUG_ARENA = () => ({ x:W/2, y:H*.42, rx:W*.36, ry:H*.19 });
function tugJoystick(){
  if (!ptr.down){ C.jx = C.jy = C.jm = 0; return; }
  const dx = ptr.x - ptr.sx, dy = ptr.y - ptr.sy, l = Math.hypot(dx, dy);
  const full = (traits().tugEase < 1 ? 45 : 65) * S;          // Kew needs a shorter drag for full power
  if (l < 6*S){ C.jx = C.jy = C.jm = 0; return; }
  C.jx = dx / l; C.jy = dy / l; C.jm = Math.min(1, l / full);
}
function updTug(dt, si){
  const tr = traits(), A = TUG_ARENA();
  // fish AI: wanders with smooth turns, sometimes thrashes
  C.turnT -= dt; if (C.turnT <= 0){ C.turn = rand(-2.4, 2.4); C.turnT = rand(.45, 1.2); }
  C.thrashT -= dt; if (C.thrashT <= 0){ C.thrash = .9; C.thrashT = rand(2.8, 4.8); C.turn = rand(-4, 4); splash(C.fx, C.fy, 12, 1); vibrate(25); }
  C.thrash = Math.max(0, C.thrash - dt);
  C.fa += C.turn * dt * (C.thrash > 0 ? 1.8 : 1);
  const ox = (C.fx - A.x) / A.rx, oy = (C.fy - A.y) / A.ry, out = Math.hypot(ox, oy);
  if (out > .7) C.fa = angLerp(C.fa, Math.atan2(A.y - C.fy, A.x - C.fx), dt * (out - .7) * 9);
  // player force
  tugJoystick();
  const fdx = Math.cos(C.fa), fdy = Math.sin(C.fa);
  const align = C.jm ? -(C.jx * fdx + C.jy * fdy) : 0;          // 1 = perfectly opposite the fish
  C.eff = clamp((align - .25) / .75, 0, 1) * C.jm;
  const sp = BAL.tugSpeed[si] * S * (C.thrash > 0 ? 1.7 : 1) * (1 - .55 * C.eff);
  C.fx += (fdx * sp + C.jx * C.jm * 30*S) * dt;
  C.fy += (fdy * sp + C.jy * C.jm * 30*S) * dt;
  // gauge & tension
  C.prog += dt * C.eff * tr.tugGain;
  const strain = 18 * BAL.tugStrain[si] * tr.tugEase * (save.lineMul || 1) * (C.thrash > 0 ? 1.6 : 1);
  C.tension = clamp(C.tension + ((1 - C.eff) * strain - C.eff * 30) * dt, 0, 100);
  C.good = C.eff > .5;
  C.buzz = (C.buzz || 0) - dt; if (C.tension > 75 && C.buzz <= 0){ C.buzz = .35; vibrate(15); }
  if (C.tension >= 100) fail('Snap! The line broke.');
  else if (C.prog >= C.need) enterPhase('final');
}
// ---- 11c. Final Pull ----
function finalTap(){
  const d = Math.abs(C.np - C.zc);
  if (d <= C.zw / 2){
    C.perfect = C.allPerfect || d <= C.zw * .16; C.phase = 'landed'; C.idx = 4; C.landT = 0; C.shown = false;
    C.hitMsg = C.perfect ? 'PERFECT!' : 'GREAT!'; C.hitT = 1.2; spark(C.fx, C.fy, 40); hostSfx('land'); splash(C.fx, C.fy, 28, 1.7); vibrate(90);
  } else {
    C.chances--; C.shake = 1; C.hitMsg = 'Miss!'; C.hitT = .8; vibrate(40);
    if (C.chances <= 0) fail('It slipped off the hook!'); else C.zc = rand(.25, .75);
  }
}
// ---- 11d. Update ----
function updCatch(dt){
  updFx(dt); C.pt += dt; C.bannerT += dt; C.hitT -= dt; C.shake = Math.max(0, C.shake - dt * 3);
  const si = C.fish.star - 1;
  for (const p of C.trail) p.l -= dt; C.trail = C.trail.filter(p => p.l > 0);
  switch (C.phase){
    case 'reel': {
      C.time -= dt;
      if (C.pt > .8){
        C.dashT -= dt; if (C.dashT <= 0){ C.dash = .7; C.dashT = rand(2.5, 4.5); splash(C.fx, C.fy, 10, .8); }
        C.dist += BAL.reelPull[si] * (C.dash > 0 ? 2.2 : 1) * dt; C.dash = Math.max(0, C.dash - dt);
      }
      C.fy = lerp(C.fy, lerp(H*.62, H*.18, clamp(C.dist / 120, 0, 1)), dt * 3);
      C.fx = W/2 + Math.sin(T * 1.7) * 50*S * (C.dash > 0 ? 1.6 : 1);
      C.fa = -Math.PI/2 + Math.cos(T * 1.7) * .5;
      if (C.dist <= 0) enterPhase('tug');
      else if (C.dist >= 150) fail('The fish swam away…');
      else if (C.time <= 0) fail('Too slow… it slipped away.');
      break; }
    case 'tug': updTug(dt, si); break;
    case 'final': {
      C.np += C.nv * C.speed * dt; if (C.np > 1){ C.np = 1; C.nv = -1; } if (C.np < 0){ C.np = 0; C.nv = 1; }
      C.fx = W/2 + Math.sin(T * 3) * 20*S; C.fy = lerp(C.fy, H*.44, dt * 3); C.fa = -Math.PI/2 + Math.sin(T * 6) * .4;
      break; }
    case 'landed': C.landT += dt; if (C.landT > 1.15 && !C.shown){ C.shown = true; finishCatch(C.perfect); } break;
    case 'fail': C.failT += dt; break;
  }
}
// ---- 11e. Draw ----
function bar(x, y, w, h, k, fill, label){
  rr(ctx, x, y, w, h, h/2); fs(ctx, 'rgba(255,253,246,.9)', 2.5*S);
  if (k > 0){ ctx.save(); rr(ctx, x, y, w, h, h/2); ctx.clip(); ctx.fillStyle = fill; ctx.fillRect(x, y, w * clamp(k, 0, 1), h); ctx.restore(); rr(ctx, x, y, w, h, h/2); ctx.lineWidth = 2.5*S; ctx.strokeStyle = OUT; ctx.stroke(); }
  if (label) txt(ctx, label, x + 10*S, y - 10*S, 12*S, '#fff', OUT, 4*S, 'left');
}
function arrow(x, y, ang, len, col, lw){
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [c, w] of [[OUT, lw + 5*S], [col, lw]]){
    ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len, 0);
    ctx.moveTo(len - len*.32, -len*.26); ctx.lineTo(len, 0); ctx.lineTo(len - len*.32, len*.26); ctx.stroke(); }
  ctx.restore();
}
function drawCatch(t){
  const si = C.fish.star - 1;
  ctx.save(); if (C.shake > 0) ctx.translate(Math.sin(t * 60) * 7*S * C.shake, 0);
  // close-up water
  let g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(163,216,245,0)'); g.addColorStop(.6, 'rgba(110,175,220,.22)'); g.addColorStop(1, 'rgba(80,140,195,.4)');
  ctx.fillStyle = g; ctx.fillRect(-20, 0, W + 40, H);
  ctx.save(); ctx.globalAlpha = .13; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3*S;
  for (let i = 0; i < 9; i++){ ctx.beginPath(); for (let x = -10; x <= W + 20; x += 18*S){ const y = i * H/8 + Math.sin(x * .02 / S + t * 1.2 + i) * 10*S; x < 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke(); }
  ctx.restore();
  drawWaveArcs(ctx, t, 0, H, .3);
  // line from the boat (bottom) to the fish
  if (C.phase !== 'landed'){
    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 2*S; ctx.beginPath(); ctx.moveTo(W/2, H + 10);
    const slack = C.phase === 'tug' ? 0 : 20*S; ctx.quadraticCurveTo(W/2 + slack, (H + C.fy) / 2, C.fx, C.fy); ctx.stroke();
  }
  // fish + water ring
  if (C.phase === 'landed'){
    const k = clamp(C.landT / .9, 0, 1);
    const y = lerp(C.fy, H*.4, easeOut(k)) - Math.sin(k * Math.PI) * 50*S;
    drawFx();
    drawFish(ctx, C.fish, W/2, y, Math.min(W*.8, lerp(70, 240, easeOut(k)) * S), t, { rot:Math.sin(t * 14) * .18 });
  } else {
    ctx.save(); ctx.globalAlpha = .55; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3*S;
    const rp = (t * .9) % 1; ell(ctx, C.fx, C.fy, (40 + rp * 50)*S, (28 + rp * 35)*S); ctx.globalAlpha = .55 * (1 - rp); ctx.stroke(); ctx.restore();
    drawShadowFish(ctx, C.fx, C.fy, [70, 85, 100][si]*S, C.fa, t, .6);

  }
  ctx.restore();

  drawPhasePills();
  if (C.phase === 'reel') drawReelUI(t);
  if (C.phase === 'tug') drawTugUI(t);
  if (C.phase === 'final') drawFinalUI(t);
  themeCatchOverlay(t);
  // phase banner
  if (C.bannerT < 1.1 && (C.phase === 'reel' || C.phase === 'tug' || C.phase === 'final')){
    const k = C.bannerT, sc = backOut(Math.min(1, k * 4)); ctx.save(); ctx.globalAlpha = k > .8 ? (1.1 - k) / .3 : 1;
    ctx.translate(W/2, H*.3); ctx.scale(sc, sc); txt(ctx, C.banner, 0, 0, 40*S, '#ffe066', OUT, 9*S); ctx.restore();
  }
  // hit message
  if (C.hitT > 0){ const k = 1 - C.hitT; ctx.save(); ctx.globalAlpha = Math.min(1, C.hitT * 2);
    txt(ctx, C.hitMsg, W/2, H*.6 - k * 30*S, 34*S, C.hitMsg === 'Miss!' ? '#ff8a8a' : '#ffe066', OUT, 8*S); ctx.restore(); }
  // white flash into result
  if (C.phase === 'landed' && C.landT > .8){ ctx.fillStyle = `rgba(255,253,246,${Math.min(.85, (C.landT - .8) / .35)})`; ctx.fillRect(0, 0, W, H); }
  // fail overlay

    ctx.fillStyle = `rgba(40,30,30,${Math.min(.5, C.failT)})`; ctx.fillRect(0, 0, W, H);
    const sc = backOut(Math.min(1, C.failT * 3));
    ctx.save(); ctx.translate(W/2, H*.42); ctx.scale(sc, sc); txt(ctx, C.msg, 0, 0, 24*S, '#fff', OUT, 7*S); ctx.restore();
    if (C.failT > .7){ ctx.save(); ctx.globalAlpha = .6 + .4 * Math.sin(t * 4); txt(ctx, 'Tap to continue', W/2, H*.52, 17*S, '#ffe066', OUT, 5*S); ctx.restore(); }
  }
}
function drawPhasePills(){

function drawTugUI(t){

/* =====================================================================
   JS 12. RESULT — fish, size, rarity stars, trivia
   ===================================================================== */
function finishCatch(perfect){
  const f = C.fish;
  let ratio = Math.pow(Math.random(), 1.5); if (perfect) ratio = .45 + ratio * .55;
  const size = +(f.min + (f.max - f.min) * ratio).toFixed(1);
  const qty = Math.random() < traits().double ? 2 : 1;
  if (save.char === 'soso') save.sosoBonus = qty > 1 ? 0 : Math.min(.2, +((save.sosoBonus || 0) + .02).toFixed(2));
  const coins = Math.round(BAL.coins[f.star - 1] * (.75 + .6 * ratio) * (perfect ? 1.2 : 1) * traits().coinMul) * qty;
  const rec = save.col[f.id], isNew = !rec, record = rec && size > rec.best;
  save.col[f.id] = { count:(rec ? rec.count : 0) + qty, best:Math.max(rec ? rec.best : 0, size) };
  save.coins += coins; fishCount += qty; writeSave();

  const badges = [];
  if (isNew) badges.push('<span class="badge">NEW!</span>');
  if (record) badges.push('<span class="badge b2">New Record!</span>');
  if (ratio > .85) badges.push('<span class="badge b2">BIG ONE!</span>');
  if (perfect) badges.push('<span class="badge b3">Perfect Pull</span>');
  if (qty > 1) badges.push('<span class="badge b3">×2 Double Catch!</span>');
  if (save.char === 'bae') badges.push('<span class="badge b2" style="animation:none">Bae bonus: +30% coins</span>');
  if (save.char === 'soso') badges.push(`<span class="badge b2" style="animation:none">Soso wants fish: ${Math.round(20 + save.sosoBonus * 100)}%</span>`);
  document.getElementById('rBadges').innerHTML = badges.join('');
  const rc = document.getElementById('rCanvas'); rc.width = 600; rc.height = 260;
  const c = rc.getContext('2d'); c.setTransform(2, 0, 0, 2, 0, 0);
  // sparkle backdrop
  c.fillStyle = '#e9f7fc'; rr(c, 4, 4, 292, 122, 20); c.fill();
  c.fillStyle = '#ffe9a8'; for (let i = 0; i < 9; i++){ const a = i / 9 * TAU; c.beginPath(); c.moveTo(150, 65); c.arc(150, 65, 160, a, a + .17); c.closePath(); c.globalAlpha = .5; c.fill(); }
  c.globalAlpha = 1;
  const RL = f.type === 'oar' ? 250 : Math.min(190, 90 / f.h);
  if (qty > 1) drawFish(c, f, 175, 50, RL * .8, 0);
  drawFish(c, f, 140, 70, RL, 0);
  document.getElementById('rStars').textContent = stars(f.star);
  document.getElementById('rName').textContent = f.name;
  document.getElementById('rJp').textContent = f.jp;
  document.getElementById('rSize').textContent = '📏 ' + fmtSize(size);
  document.getElementById('rHab').textContent = (f.hab === 'river' ? '🏞️ ' : f.hab === 'ocean' ? '🌊 ' : '🌑 ') + HAB[f.hab].name;
  resultTrivia(f, qty);
  document.getElementById('rCoins').textContent = coins;
  showLayer('result');
}

/* =====================================================================
   JS 13. INPUT (pointer — works for touch + mouse)
   ===================================================================== */
const ptr = { down:false, x:0, y:0, sx:0, sy:0 };
function pos(e){ const r = cv.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); const p = pos(e);
  ptr.down = true; ptr.x = ptr.sx = p.x; ptr.y = ptr.sy = p.y;
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  if (scene === 'fishing') fishingTap(p);
  else if (scene === 'catch'){
    if (C.phase === 'reel'){ C.ax = p.x; C.ay = p.y; C.lv = null; }
    else if (C.phase === 'final' && C.pt > .4) finalTap();
    else if (C.phase === 'fail' && C.failT > .7) fadeTo(initFishing);
  }
});
cv.addEventListener('pointermove', e => {
  if (!ptr.down) return; const p = pos(e); ptr.x = p.x; ptr.y = p.y;
  if (scene === 'catch' && C.phase === 'reel'){
    const dx = p.x - C.ax, dy = p.y - C.ay;
    if (Math.hypot(dx, dy) >= 5*S){ reelInput(dx, dy); C.ax = p.x; C.ay = p.y; }
    C.trail.push({ x:p.x, y:p.y, l:.45 });
  }
});
function up(){ ptr.down = false; if (scene === 'catch') C.lv = null; }
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------- juice: sparkles + pop-up words ---------- */
const SPARKS = [], POPS = [];
const SPARK_COLS = ['#ffe08e', '#ffffff', '#9fe0b2', '#f48e85', '#c8b8ff'];
function spark(x, y, n, cols){
  for (let i = 0; i < n; i++){ const a = rand(0, TAU), v = rand(60, 220) * S;
    SPARKS.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60*S, t: 0, life: rand(.45, .9), r: rand(2.5, 5.5) * S, col: (cols || SPARK_COLS)[i % (cols || SPARK_COLS).length], rot: rand(0, TAU) }); }
}
function pop(text, x, y, col = '#ffe08e', size = 26){ POPS.push({ text, x, y, col, size, t: 0 }); }
let fxT = null;
function fxTick(){ const dt = fxT === null ? 0 : clamp(T - fxT, 0, .05); fxT = T; 
  for (const p of SPARKS){ p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 380*S * dt; p.vx *= .985; p.rot += dt * 6; }
  for (let i = SPARKS.length - 1; i >= 0; i--) if (SPARKS[i].t > SPARKS[i].life) SPARKS.splice(i, 1);
  for (const p of POPS) p.t += dt;
  for (let i = POPS.length - 1; i >= 0; i--) if (POPS[i].t > .9) POPS.splice(i, 1);
  return dt;
}
function star4(c, x, y, r, rot){
  c.save(); c.translate(x, y); c.rotate(rot); c.beginPath();
  for (let i = 0; i < 8; i++){ const a = i * Math.PI / 4, d = i % 2 ? r * .38 : r; c.lineTo(Math.cos(a) * d, Math.sin(a) * d); }
  c.closePath(); c.fill(); c.restore();
}
function drawJuice(){
  ctx.save();
  for (const p of SPARKS){ ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.col; star4(ctx, p.x, p.y, p.r, p.rot); }
  for (const p of POPS){ const k = p.t / .9, sc = backOut(Math.min(1, p.t * 5));
    ctx.globalAlpha = k > .6 ? (1 - k) / .4 : 1; ctx.save(); ctx.translate(p.x, p.y - k * 46*S); ctx.scale(sc, sc);
    txt(ctx, p.text, 0, 0, p.size*S, p.col, OUT, 6*S); ctx.restore(); }

/* ---------- Bite: impossible to miss ---------- */

/* ---------- Result card: newest unlocked trivia (1 / 5 / 15 catches of this fish) ---------- */
const TRIVIA_AT = [1, 5, 15];
function resultTrivia(f, qty){
  const n = (save.col[f.id] || { count: qty }).count, prev = n - qty;
  const list = host && host.trivia ? host.trivia(f) : [f.trivia];
  let idx = 0; for (let i = 0; i < 3; i++) if (n >= TRIVIA_AT[i] && list[i]) idx = i;
  document.getElementById('rTrivia').textContent = list[idx];
  const nx = document.getElementById('rNext');
  if (nx) nx.textContent = idx < 2 && list[idx + 1] ? `Catch ${TRIVIA_AT[idx + 1] - n} more to unlock trivia ${idx + 2} of 3` : 'All 3 trivia unlocked!';
  const newly = TRIVIA_AT.findIndex((th, i) => i > 0 && prev < th && n >= th && list[i]);
  if (newly > 0) document.getElementById('rBadges').insertAdjacentHTML('beforeend', `<span class="badge b3">Trivia ${newly + 1} unlocked!</span>`);
}


/* ---- host plumbing ---- */
function resize(w, h){
  W = w; H = h; S = W / 360; DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); buildWaves();
}
function update(dt){ if (scene === 'fishing') updFishing(dt); else if (scene === 'catch') updCatch(dt); }
function draw(){ ctx.clearRect(0, 0, W, H); if (scene === 'fishing') drawFishing(T); else if (scene === 'catch') drawCatch(T); }
let last = 0;
function loop(now){
  if (!active) return;
  const dt = Math.min(window.__pfDtCap || .033, (now - last) / 1000); last = now; T += dt;
  update(dt); draw(); requestAnimationFrame(loop);
}
function fishImage(f, sil, w = 240, h = 132){
  const el = document.createElement('canvas'); el.width = w * 2; el.height = h * 2;
  const c = el.getContext('2d'); c.scale(2, 2);
  const L = f.type === 'oar' ? w * .92 : Math.min(w * .78, h * .62 / f.h);
  drawFish(c, f, w * .5, h * .5, L, 0, { sil });
  return el.toDataURL();
}
buildWaves();
return {
  FISH, HAB, BAL, fishImage, stars, fmtSize,
  setSprites(map){ for (const k in map){ const im = new Image(); im.src = map[k]; SPR[k] = im; } },
  start(h, state){
    host = h; Object.assign(save, state); fishCount = 0;
    cv.hidden = false; active = true; last = performance.now();
    initFishing(); refreshCoins(); requestAnimationFrame(loop);
  },
  stop(){ active = false; scene = 'off'; cv.hidden = true; hideAll(); },
  resize,
  setHand(x, y){ HAND = { x, y }; },
  setFishArt(fn){ FISH_ART = fn; },
  flatFish(c, f, x, y, L, opt){ drawFishFlat(c, f, x, y, L, 0, opt || {}); },
  get scene(){ return scene; },
  get phase(){ return scene === 'catch' ? C.phase : F.state; }
};
})();
