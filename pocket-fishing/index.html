/* =====================================================================
   JS 10. SCENE: FISHING (top view — 70% sea, 30% boat)
   States: idle → casting → waiting → nibble → bite → hooked → zoom
   ===================================================================== */
const F = {};
const SEA_LIMIT = () => H * .64;      // can only cast above this line
let fishCount = 0;                    // catches this session (bucket)

function initFishing(){
  Object.assign(F, { state:'idle', bob:null, cast:null, wait:0, appr:null, nib:0, nibT:0, biteT:0, dip:0, sink:0, hookT:0, zoomT:0,
    msg:'Tap the sea to cast!', msgT:0, rT:0, shadows:[], fish:null });
  FX.ripples = []; FX.drops = [];
  for (let i = 0; i < 5; i++) F.shadows.push(newShadow(false));
  scene = 'fishing'; hideAll(); showLayer('fishHUD'); updateHUD();
}
function newShadow(edge){
  const left = Math.random() < .5;
  return { x: edge ? (left ? -30*S : W + 30*S) : rand(.1, .9) * W, y: rand(.06, .58) * H,
           a: edge ? (left ? rand(-.4, .4) : Math.PI + rand(-.4, .4)) : rand(0, TAU),
           v: rand(10, 22), s: rand(.75, 1.05), turn:0, turnT:rand(1, 3), flee:0, al: edge ? 0 : 1 };
}
function updateHUD(){
  const a = ATTACH.find(x => x.id === save.equip) || ATTACH[0];
  document.getElementById('lureTag').textContent = `${a.icon} ${a.name}`;
  document.getElementById('bucketTag').textContent = `🪣 ${fishCount}`;
  refreshCoins();
}
function setMsg(m, time){ F.msg = m; F.msgT = time; }
function rodTip(){
  const bend = (F.state === 'bite' || F.state === 'hooked' || F.state === 'zoom') ? 16*S : F.dip * 6*S;
  return { x: W/2 + Math.sin(T * 1.3) * 2*S + (F.bob ? (F.bob.x - W/2) * .05 : 0), y: H * .4 + bend };
}

// ---- 10a. Rarity roll (attachments + rod + character) ----
function weighted(obj){ let tot = 0; for (const k in obj) tot += obj[k]; let r = Math.random() * tot; for (const k in obj){ r -= obj[k]; if (r <= 0) return k; } return Object.keys(obj)[0]; }
function pickFish(){
  const tr = traits(), att = ATTACH.find(a => a.id === save.equip);
  const hw = { river:1, ocean:1, deep:.7 }; if (att && att.hab) hw[att.hab] *= 3.5;
  const hab = weighted(hw), r = save.rod.rare;
  const sw = { 1: BAL.starWeights[0], 2: BAL.starWeights[1] + r*5, 3: BAL.starWeights[2] + r*3 };
  const star = +weighted(sw);
  let pool = FISH.filter(f => f.hab === hab && f.star === star); if (!pool.length) pool = FISH.filter(f => f.hab === hab);
  return pool[Math.floor(Math.random() * pool.length)];
}

// ---- 10b. Update ----
function updShadows(dt){
  for (const sh of F.shadows){
    sh.al = Math.min(1, sh.al + dt);
    if (sh === F.appr && F.bob){
      const dx = F.bob.x - sh.x, dy = F.bob.y - sh.y, d = Math.hypot(dx, dy);
      sh.a = angLerp(sh.a, Math.atan2(dy, dx), dt * 3);
      if (F.state === 'waiting'){
        const sp = Math.min(d, 42*S*dt); sh.x += Math.cos(sh.a) * sp; sh.y += Math.sin(sh.a) * sp;
        if (d < 14*S){ F.state = 'nibble'; F.nib = Math.floor(rand(0, 3)); F.nibT = rand(.5, 1); }
      } else {
        const j = F.state === 'bite' || F.state === 'hooked' ? 4*S : 0;
        sh.x = lerp(sh.x, F.bob.x - Math.cos(sh.a)*12*S + rand(-j, j), dt*5); sh.y = lerp(sh.y, F.bob.y - Math.sin(sh.a)*12*S + rand(-j, j), dt*5);
      }
      continue;
    }
    if (sh.flee > 0){ sh.flee -= dt; sh.x += Math.cos(sh.a) * 90*S*dt; sh.y += Math.sin(sh.a) * 90*S*dt; }
    else { sh.turnT -= dt; if (sh.turnT <= 0){ sh.turn = rand(-1, 1); sh.turnT = rand(1, 3); }
      sh.a += sh.turn * dt * .8; sh.x += Math.cos(sh.a) * sh.v*S*dt; sh.y += Math.sin(sh.a) * sh.v*S*dt; }
    if (sh.x < -45*S || sh.x > W + 45*S || sh.y < -45*S || sh.y > H * .66) Object.assign(sh, newShadow(true));
  }
}
function updFishing(dt){
  updShadows(dt); updFx(dt);
  F.dip = Math.max(0, F.dip - dt * 3);
  if (F.msgT > 0) F.msgT -= dt;
  if (F.bob && (F.state === 'waiting' || F.state === 'nibble')){ F.rT -= dt; if (F.rT <= 0){ F.rT = 1.6; ripple(F.bob.x, F.bob.y, 18*S, 1.2); } }
  switch (F.state){
    case 'casting':
      F.cast.t += dt / .6;
      if (F.cast.t >= 1){ F.bob = { x:F.cast.tx, y:F.cast.ty }; F.state = 'waiting'; F.wait = rand(1.2, 3.5);
        splash(F.bob.x, F.bob.y, 6, .6); ripple(F.bob.x, F.bob.y, 30*S, .9); setMsg('Wait for a bite…', 1.8); }
      break;
    case 'waiting':
      if (traits().bait && F.bob) baitDrift(dt);
      if (!F.appr){ F.wait -= dt; if (F.wait <= 0) startApproach(); }
      break;
    case 'nibble':
      F.nibT -= dt;
      if (F.nibT <= 0){
        if (F.nib > 0){ F.nib--; F.dip = 1; ripple(F.bob.x, F.bob.y, 22*S, .6); F.nibT = rand(.6, 1.25); }
        else startBite();
      }
      break;
    case 'bite': F.biteT -= dt; F.sink = Math.min(1, F.sink + dt * 6); if (F.biteT <= 0) fishEscapes('It got away…'); break;
    case 'hooked': F.hookT += dt; if (F.hookT > .85){ F.state = 'zoom'; F.zoomT = 0; } break;
    case 'zoom': F.zoomT += dt / .6; if (F.zoomT >= 1) startCatch(F.fish); break;
  }
}
// Dr. Mo's Baits: bobber swims towards the nearest fish and calls it over early
function baitDrift(dt){
  let best = F.appr, bd = 1e9;
  if (!best) for (const sh of F.shadows){ if (sh.flee > 0) continue; const d = Math.hypot(sh.x - F.bob.x, sh.y - F.bob.y); if (d < bd){ bd = d; best = sh; } }
  if (!best) return;
  const dx = best.x - F.bob.x, dy = best.y - F.bob.y, d = Math.hypot(dx, dy) || 1;
  const sp = Math.min(d, 28*S*dt);
  F.bob.x = clamp(F.bob.x + dx/d*sp, 20*S, W - 20*S); F.bob.y = clamp(F.bob.y + dy/d*sp, 50*S, H*.6);
  F.trailT = (F.trailT || 0) - dt; if (F.trailT <= 0){ F.trailT = .35; ripple(F.bob.x, F.bob.y, 12*S, .6); }
  if (!F.appr && d < 70*S) F.wait = Math.min(F.wait, .2);   // fish notices the bait right away
}
function startApproach(){
  let best = null, bd = 1e9;
  for (const sh of F.shadows){ if (sh.flee > 0) continue; const d = Math.hypot(sh.x - F.bob.x, sh.y - F.bob.y); if (d < bd){ bd = d; best = sh; } }
  if (!best){ F.wait = 1; return; }
  F.appr = best; F.fish = pickFish(); best.s = [.85, 1.1, 1.45][F.fish.star - 1];
}
function startBite(){
  F.state = 'bite'; F.sink = 0;
  F.biteT = .62 * traits().biteMul * BAL.biteStar[F.fish.star - 1];
  splash(F.bob.x, F.bob.y, 14, 1); ripple(F.bob.x, F.bob.y, 40*S, .7); ripple(F.bob.x, F.bob.y, 55*S, .8, .15); vibrate(60);
}
function fishEscapes(msg){
  if (F.appr){ F.appr.flee = 1.2; F.appr.a = rand(0, TAU); }
  F.appr = null; F.fish = null; F.sink = 0; F.state = 'waiting'; F.wait = rand(1.8, 3.5); setMsg(msg, 1.8);
}
function fishingTap(p){
  if (F.state === 'bite'){ F.state = 'hooked'; F.hookT = 0; F.msgT = 0; vibrate([30, 40, 30]); splash(F.bob.x, F.bob.y, 18, 1.3); return; }
  if (F.state === 'nibble'){ fishEscapes('Too early! It got spooked.'); return; }
  if ((F.state === 'idle' || F.state === 'waiting') && p.y < SEA_LIMIT()){
    if (F.appr){ F.appr.flee = 1; F.appr.a = rand(0, TAU); F.appr = null; }
    const tip = rodTip();
    F.cast = { fx:tip.x, fy:tip.y, tx:clamp(p.x, 20*S, W - 20*S), ty:clamp(p.y, 50*S, H * .6), t:0 };
    F.bob = null; F.state = 'casting'; F.sink = 0; F.msgT = 0;
  }
}

// ---- 10c. Draw ----
function drawSeaTop(t){
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#79c9e5'); g.addColorStop(1, '#a6dff0');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = .16; ctx.fillStyle = '#fff';
  for (let i = 0; i < 7; i++){ const x = ((i * 97*S + t * 6*S) % (W + 140*S)) - 70*S, y = ((i * 163) % 100) / 100 * H * .7; ell(ctx, x, y, 55*S, 16*S); ctx.fill(); }
  ctx.restore();
  drawWaveArcs(ctx, t, 0, H * .75, .7);
}
function drawBobber(x, y, sc, sink){
  ctx.save(); ctx.translate(x, y + Math.sin(T * 3) * 1.5*S);
  ctx.globalAlpha = 1 - sink * .85;
  const r = 7.5*S * sc * (1 - sink * .4);
  ell(ctx, 0, 0, r, r); fs(ctx, '#fff', 2.2*S);
  ctx.beginPath(); ctx.arc(0, 0, r, Math.PI, TAU); ctx.closePath(); fs(ctx, '#ef4a4a', 2.2*S);
  ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(0, -r - 6*S*sc); ctx.lineWidth = 2*S; ctx.strokeStyle = OUT; ctx.stroke();
  ctx.restore();
}
function drawBoat(t){
  const cx = W/2, tipY = H * .7, bot = H + 30*S, half = W * .44;
  ctx.save(); ctx.globalAlpha = .22; ctx.beginPath(); ctx.moveTo(cx + 6*S, tipY + 10*S); ctx.lineTo(cx - half + 6*S, bot); ctx.lineTo(cx + half + 6*S, bot); ctx.closePath(); fs(ctx, '#1b4866'); ctx.restore();
  // red rim
  ctx.beginPath(); ctx.moveTo(cx, tipY); ctx.lineTo(cx - half, bot); ctx.lineTo(cx + half, bot); ctx.closePath(); fs(ctx, '#f04848', 3.5*S);
  // deck
  const ins = 15*S;
  ctx.beginPath(); ctx.moveTo(cx, tipY + ins * 2.1); ctx.lineTo(cx - half + ins * 1.9, bot); ctx.lineTo(cx + half - ins * 1.9, bot); ctx.closePath(); fs(ctx, '#f2e2b3', 3*S);
  ctx.save(); ctx.clip();
  ctx.strokeStyle = '#e0cb94'; ctx.lineWidth = 2*S;
  for (let y = tipY + 30*S; y < H; y += 20*S){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  // tackle box & bucket
  rr(ctx, cx - 92*S, H * .925, 38*S, 26*S, 5*S); fs(ctx, '#7cc4e8', 2.5*S); ctx.fillStyle = OUT; ctx.fillRect(cx - 80*S, H * .925 + 10*S, 14*S, 3*S);
  ell(ctx, cx + 76*S, H * .94, 17*S, 17*S); fs(ctx, '#ffd36e', 2.5*S); ell(ctx, cx + 76*S, H * .94, 11*S, 11*S); fs(ctx, '#7fc8e3', 2*S);
  if (fishCount > 0){ ctx.save(); ctx.beginPath(); ctx.arc(cx + 76*S, H * .94, 11*S, 0, TAU); ctx.clip(); drawShadowFish(ctx, cx + 76*S, H * .94, 16*S, t * .8, t, .5); ctx.restore(); }
  ctx.restore();
  // character + rod
  const ch = curChar();
  let bx = cx + 18*S, by = H * .895 - 8*S;
  if (hasSprite(ch)){
    const sh = 92*S, scx = cx - 14*S, sby = H * .975;
    ctx.save(); ctx.globalAlpha = .18; ell(ctx, scx, sby - 4*S, 40*S, 8*S); fs(ctx, OUT); ctx.restore();
    drawSprite(ctx, ch, scx, sby, sh, t);
    bx = scx + sh * .36; by = sby - sh * .3;          // right hand
  } else drawCharTop(ctx, ch, cx, H * .895, 1.05*S, t);
  const tip = rodTip();
  ctx.lineCap = 'round';
  ctx.strokeStyle = OUT; ctx.lineWidth = 9*S; ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(tip.x, tip.y); ctx.stroke();
  ctx.strokeStyle = '#8a8f99'; ctx.lineWidth = 5.5*S; ctx.stroke();
  ctx.strokeStyle = '#b5bac3'; ctx.lineWidth = 1.6*S; ctx.beginPath(); ctx.moveTo(bx - 1*S, by - 4*S); ctx.lineTo(tip.x - 1*S, tip.y + 4*S); ctx.stroke();
  const rx = lerp(bx, tip.x, .1) + 9*S, ry = lerp(by, tip.y, .1);
  ell(ctx, rx, ry, 7*S, 7*S); fs(ctx, '#d9dde3', 2.5*S); ell(ctx, rx, ry, 2.5*S, 2.5*S); fs(ctx, OUT);
  return tip;
}
function drawFishing(t){
  ctx.save();
  if (F.state === 'zoom' && F.bob){ const k = 1 + 2.8 * easeIn(F.zoomT); ctx.translate(F.bob.x, F.bob.y); ctx.scale(k, k); ctx.translate(-F.bob.x, -F.bob.y); }
  drawSeaTop(t);
  for (const sh of F.shadows) drawShadowFish(ctx, sh.x, sh.y, 40*S*sh.s, sh.a, t, .32 * sh.al);
  drawFx();
  // fishing line (drawn before boat so it tucks under the rod)
  const tip = rodTip();
  let bp = null, sc = 1;
  if (F.state === 'casting'){ const k = easeOut(F.cast.t); bp = { x:lerp(F.cast.fx, F.cast.tx, k), y:lerp(F.cast.fy, F.cast.ty, k) }; sc = 1 + .7 * Math.sin(Math.PI * F.cast.t); }
  else if (F.bob) bp = { x:F.bob.x, y:F.bob.y + F.dip * 3*S };
  if (bp){
    const tight = F.state === 'bite' || F.state === 'hooked' || F.state === 'zoom';
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.6*S; ctx.beginPath(); ctx.moveTo(tip.x, tip.y);
    ctx.quadraticCurveTo((tip.x + bp.x) / 2 + (tight ? 0 : 14*S), (tip.y + bp.y) / 2 + (tight ? 0 : 18*S), bp.x, bp.y); ctx.stroke();
    drawBobber(bp.x, bp.y, sc, F.sink);
  }
  drawBoat(t);
  ctx.restore();

  // message pill
  const showMsg = F.state === 'idle' ? 'Tap the sea to cast!' : (F.msgT > 0 ? F.msg : '');
  if (showMsg){
    ctx.save(); ctx.globalAlpha = F.state === 'idle' ? .75 + .25 * Math.sin(t * 4) : Math.min(1, F.msgT * 3);
    ctx.font = `800 ${16*S}px ${FONT}`; const tw = ctx.measureText(showMsg).width + 30*S;
    rr(ctx, W/2 - tw/2, H * .1, tw, 34*S, 17*S); fs(ctx, 'rgba(255,253,246,.92)', 2.5*S);
    txt(ctx, showMsg, W/2, H * .1 + 17*S, 16*S, OUT, null); ctx.restore();
  }
  // BIG exclamation when hooked
  if (F.state === 'hooked' || F.state === 'zoom'){
    const k = F.state === 'hooked' ? F.hookT : 1;
    const sc2 = backOut(Math.min(1, k * 3));
    ctx.save(); ctx.translate(W/2, H * .34); ctx.scale(sc2, sc2); ctx.rotate(Math.sin(t * 20) * .04);
    ctx.beginPath(); for (let i = 0; i < 24; i++){ const a = i / 24 * TAU, r = (i % 2 ? 68 : 94) * S; i ? ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r) : ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r); }
    ctx.closePath(); fs(ctx, '#ffe066', 4*S);
    txt(ctx, '!', 0, 6*S, 118*S, '#ff5b5b', OUT, 12*S);
    ctx.restore();
  }
  if (F.state === 'zoom'){ ctx.fillStyle = `rgba(255,255,255,${F.zoomT})`; ctx.fillRect(0, 0, W, H); }
}

/* =====================================================================
   JS 11. SCENE: CATCH — the 4 fishing gimmicks
   1. Bite (done in fishing scene)  2. Reel (draw circles)
   3. Tug (drag opposite the fish)  4. Final Pull (tap in zone)
   ===================================================================== */
const C = {};
function startCatch(fish){
  scene = 'catch'; hideAll();
  Object.assign(C, { fish, phase:'reel', idx:1, pt:0, banner:'Reel it in!', bannerT:0,
    dist:100, time:25, reelAng:0, rdir:0, anti:0, lv:null, ax:0, ay:0, trail:[], dash:0, dashT:rand(2, 4),
    fx:W/2, fy:H*.3, fa:-Math.PI/2, tension:15, prog:0, need:1, fdir:0, dirT:0, grace:0, good:false,
    np:0, nv:1, speed:1, zc:.5, zw:.2, chances:2, shake:0, hitMsg:'', hitT:0, msg:'', failT:0, landT:0, perfect:false, shown:false });
  FX.ripples = []; FX.drops = [];
  splash(W/2, H*.3, 18, 1.3); ripple(W/2, H*.3, 70*S, 1); ripple(W/2, H*.3, 100*S, 1.2, .2);
}
function enterPhase(p){
  C.phase = p; C.pt = 0; C.bannerT = 0;
  const si = C.fish.star - 1, tr = traits();
  if (p === 'tug'){ C.idx = 2; C.banner = 'Fight!'; C.need = 3.4 * tr.tugEase * BAL.tugNeed[si]; C.prog = 0; C.tension = 15;
    C.fa = rand(0, TAU); C.turn = 0; C.turnT = 0; C.thrash = 0; C.thrashT = rand(2.5, 4); C.eff = 0; C.jx = 0; C.jy = 0; C.jm = 0; }
  if (p === 'final'){ C.idx = 3; C.banner = 'Final Pull!'; C.np = 0; C.nv = 1; C.speed = BAL.finalSpeed[si];
    C.zw = clamp(.2 * tr.zoneMul * BAL.finalZone[si], .08, .5); C.zc = rand(.25, .75); C.chances = C.maxCh = tr.hearts; C.allPerfect = tr.allPerfect; }
  splash(C.fx, C.fy, 10, 1); vibrate(30);
}
function fail(msg){ C.phase = 'fail'; C.msg = msg; C.failT = 0; vibrate(120); splash(C.fx, C.fy, 14, 1.2); }

// ---- 11a. Reel: turning of the finger's path (any position on screen) ----
function reelInput(dx, dy){
  if (C.lv){
    const d = Math.atan2(C.lv.x * dy - C.lv.y * dx, C.lv.x * dx + C.lv.y * dy);
    if (Math.abs(d) < 1.2){                       // sharp zig-zags don't count
      if (C.rdir === 0 && Math.abs(d) > .05) C.rdir = Math.sign(d);
      if (Math.sign(d) === C.rdir){
        const power = 14 * (1 + .25 * save.rod.reel) / BAL.reelHard[C.fish.star - 1];
        C.dist -= Math.abs(d) / TAU * power; C.reelAng += Math.abs(d) * 1.5;
      } else { C.anti += Math.abs(d); if (C.anti > Math.PI){ C.rdir = Math.sign(d); C.anti = 0; } }
    }
  }
  C.lv = { x:dx, y:dy };
}
// ---- 11b. Tug: real-time fight ----
// Hold anywhere = a joystick appears under your finger. Keep pulling/pushing AGAINST the way the fish swims.
const TUG_ARENA = () => ({ x:W/2, y:H*.42, rx:W*.36, ry:H*.19 });
function tugJoystick(){
  if (!ptr.down){ C.jx = C.jy = C.jm = 0; return; }
  const dx = ptr.x - ptr.sx, dy = ptr.y - ptr.sy, l = Math.hypot(dx, dy);
  const full = (traits().tugEase < 1 ? 45 : 65) * S;          // Kew needs a shorter drag for full power
  if (l < 6*S){ C.jx = C.jy = C.jm = 0; return; }
  C.jx = dx / l; C.jy = dy / l; C.jm = Math.min(1, l / full);
}
function updTug(dt, si){
  const tr = traits(), A = TUG_ARENA();
  // fish AI: wanders with smooth turns, sometimes thrashes
  C.turnT -= dt; if (C.turnT <= 0){ C.turn = rand(-2.4, 2.4); C.turnT = rand(.45, 1.2); }
  C.thrashT -= dt; if (C.thrashT <= 0){ C.thrash = .9; C.thrashT = rand(2.8, 4.8); C.turn = rand(-4, 4); splash(C.fx, C.fy, 12, 1); vibrate(25); }
  C.thrash = Math.max(0, C.thrash - dt);
  C.fa += C.turn * dt * (C.thrash > 0 ? 1.8 : 1);
  const ox = (C.fx - A.x) / A.rx, oy = (C.fy - A.y) / A.ry, out = Math.hypot(ox, oy);
  if (out > .7) C.fa = angLerp(C.fa, Math.atan2(A.y - C.fy, A.x - C.fx), dt * (out - .7) * 9);
  // player force
  tugJoystick();
  const fdx = Math.cos(C.fa), fdy = Math.sin(C.fa);
  const align = C.jm ? -(C.jx * fdx + C.jy * fdy) : 0;          // 1 = perfectly opposite the fish
  C.eff = clamp((align - .25) / .75, 0, 1) * C.jm;
  const sp = BAL.tugSpeed[si] * S * (C.thrash > 0 ? 1.7 : 1) * (1 - .55 * C.eff);
  C.fx += (fdx * sp + C.jx * C.jm * 30*S) * dt;
  C.fy += (fdy * sp + C.jy * C.jm * 30*S) * dt;
  // gauge & tension
  C.prog += dt * C.eff * tr.tugGain;
  const strain = 18 * BAL.tugStrain[si] * tr.tugEase * (C.thrash > 0 ? 1.6 : 1);
  C.tension = clamp(C.tension + ((1 - C.eff) * strain - C.eff * 30) * dt, 0, 100);
  C.good = C.eff > .5;
  C.buzz = (C.buzz || 0) - dt; if (C.tension > 75 && C.buzz <= 0){ C.buzz = .35; vibrate(15); }
  if (C.tension >= 100) fail('Snap! The line broke.');
  else if (C.prog >= C.need) enterPhase('final');
}
// ---- 11c. Final Pull ----
function finalTap(){
  const d = Math.abs(C.np - C.zc);
  if (d <= C.zw / 2){
    C.perfect = C.allPerfect || d <= C.zw * .16; C.phase = 'landed'; C.idx = 4; C.landT = 0; C.shown = false;
    C.hitMsg = C.perfect ? 'PERFECT!' : 'GREAT!'; C.hitT = 1.2; splash(C.fx, C.fy, 28, 1.7); vibrate(90);
  } else {
    C.chances--; C.shake = 1; C.hitMsg = 'Miss!'; C.hitT = .8; vibrate(40);
    if (C.chances <= 0) fail('It slipped off the hook!'); else C.zc = rand(.25, .75);
  }
}
// ---- 11d. Update ----
function updCatch(dt){
  updFx(dt); C.pt += dt; C.bannerT += dt; C.hitT -= dt; C.shake = Math.max(0, C.shake - dt * 3);
  const si = C.fish.star - 1;
  for (const p of C.trail) p.l -= dt; C.trail = C.trail.filter(p => p.l > 0);
  switch (C.phase){
    case 'reel': {
      C.time -= dt;
      if (C.pt > .8){
        C.dashT -= dt; if (C.dashT <= 0){ C.dash = .7; C.dashT = rand(2.5, 4.5); splash(C.fx, C.fy, 10, .8); }
        C.dist += BAL.reelPull[si] * (C.dash > 0 ? 2.2 : 1) * dt; C.dash = Math.max(0, C.dash - dt);
      }
      C.fy = lerp(C.fy, lerp(H*.62, H*.18, clamp(C.dist / 120, 0, 1)), dt * 3);
      C.fx = W/2 + Math.sin(T * 1.7) * 50*S * (C.dash > 0 ? 1.6 : 1);
      C.fa = -Math.PI/2 + Math.cos(T * 1.7) * .5;
      if (C.dist <= 0) enterPhase('tug');
      else if (C.dist >= 150) fail('The fish swam away…');
      else if (C.time <= 0) fail('Too slow… it slipped away.');
      break; }
    case 'tug': updTug(dt, si); break;
    case 'final': {
      C.np += C.nv * C.speed * dt; if (C.np > 1){ C.np = 1; C.nv = -1; } if (C.np < 0){ C.np = 0; C.nv = 1; }
      C.fx = W/2 + Math.sin(T * 3) * 20*S; C.fy = lerp(C.fy, H*.44, dt * 3); C.fa = -Math.PI/2 + Math.sin(T * 6) * .4;
      break; }
    case 'landed': C.landT += dt; if (C.landT > 1.15 && !C.shown){ C.shown = true; finishCatch(C.perfect); } break;
    case 'fail': C.failT += dt; break;
  }
}
// ---- 11e. Draw ----
function bar(x, y, w, h, k, fill, label){
  rr(ctx, x, y, w, h, h/2); fs(ctx, 'rgba(255,253,246,.9)', 2.5*S);
  if (k > 0){ ctx.save(); rr(ctx, x, y, w, h, h/2); ctx.clip(); ctx.fillStyle = fill; ctx.fillRect(x, y, w * clamp(k, 0, 1), h); ctx.restore(); rr(ctx, x, y, w, h, h/2); ctx.lineWidth = 2.5*S; ctx.strokeStyle = OUT; ctx.stroke(); }
  if (label) txt(ctx, label, x + 10*S, y - 10*S, 12*S, '#fff', OUT, 4*S, 'left');
}
function arrow(x, y, ang, len, col, lw){
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [c, w] of [[OUT, lw + 5*S], [col, lw]]){
    ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len, 0);
    ctx.moveTo(len - len*.32, -len*.26); ctx.lineTo(len, 0); ctx.lineTo(len - len*.32, len*.26); ctx.stroke(); }
  ctx.restore();
}
function drawCatch(t){
  const si = C.fish.star - 1;
  ctx.save(); if (C.shake > 0) ctx.translate(Math.sin(t * 60) * 7*S * C.shake, 0);
  // close-up water
  let g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#6cc3e0'); g.addColorStop(.6, '#3d93c2'); g.addColorStop(1, '#2d73a3');
  ctx.fillStyle = g; ctx.fillRect(-20, 0, W + 40, H);
  ctx.save(); ctx.globalAlpha = .13; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3*S;
  for (let i = 0; i < 9; i++){ ctx.beginPath(); for (let x = -10; x <= W + 20; x += 18*S){ const y = i * H/8 + Math.sin(x * .02 / S + t * 1.2 + i) * 10*S; x < 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke(); }
  ctx.restore();
  drawWaveArcs(ctx, t, 0, H, .3);
  // line from the boat (bottom) to the fish
  if (C.phase !== 'landed'){
    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 2*S; ctx.beginPath(); ctx.moveTo(W/2, H + 10);
    const slack = C.phase === 'tug' ? 0 : 20*S; ctx.quadraticCurveTo(W/2 + slack, (H + C.fy) / 2, C.fx, C.fy); ctx.stroke();
  }
  // fish + water ring
  if (C.phase === 'landed'){
    const k = clamp(C.landT / .9, 0, 1);
    const y = lerp(C.fy, H*.4, easeOut(k)) - Math.sin(k * Math.PI) * 50*S;
    drawFx();
    drawFish(ctx, C.fish, W/2, y, Math.min(W*.8, lerp(70, 240, easeOut(k)) * S), t, { rot:Math.sin(t * 14) * .18 });
  } else {
    ctx.save(); ctx.globalAlpha = .55; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3*S;
    const rp = (t * .9) % 1; ell(ctx, C.fx, C.fy, (40 + rp * 50)*S, (28 + rp * 35)*S); ctx.globalAlpha = .55 * (1 - rp); ctx.stroke(); ctx.restore();
    drawShadowFish(ctx, C.fx, C.fy, [70, 85, 100][si]*S, C.fa, t, .6);
    drawFx();
  }
  ctx.restore();

  drawPhasePills();
  if (C.phase === 'reel') drawReelUI(t);
  if (C.phase === 'tug') drawTugUI(t);
  if (C.phase === 'final') drawFinalUI(t);
  // phase banner
  if (C.bannerT < 1.1 && (C.phase === 'reel' || C.phase === 'tug' || C.phase === 'final')){
    const k = C.bannerT, sc = backOut(Math.min(1, k * 4)); ctx.save(); ctx.globalAlpha = k > .8 ? (1.1 - k) / .3 : 1;
    ctx.translate(W/2, H*.3); ctx.scale(sc, sc); txt(ctx, C.banner, 0, 0, 40*S, '#ffe066', OUT, 9*S); ctx.restore();
  }
  // hit message
  if (C.hitT > 0){ const k = 1 - C.hitT; ctx.save(); ctx.globalAlpha = Math.min(1, C.hitT * 2);
    txt(ctx, C.hitMsg, W/2, H*.6 - k * 30*S, 34*S, C.hitMsg === 'Miss!' ? '#ff8a8a' : '#ffe066', OUT, 8*S); ctx.restore(); }
  // white flash into result
  if (C.phase === 'landed' && C.landT > .8){ ctx.fillStyle = `rgba(255,253,246,${Math.min(.85, (C.landT - .8) / .35)})`; ctx.fillRect(0, 0, W, H); }
  // fail overlay
  if (C.phase === 'fail'){
    ctx.fillStyle = `rgba(40,30,30,${Math.min(.5, C.failT)})`; ctx.fillRect(0, 0, W, H);
    const sc = backOut(Math.min(1, C.failT * 3));
    ctx.save(); ctx.translate(W/2, H*.42); ctx.scale(sc, sc); txt(ctx, C.msg, 0, 0, 24*S, '#fff', OUT, 7*S); ctx.restore();
    if (C.failT > .7){ ctx.save(); ctx.globalAlpha = .6 + .4 * Math.sin(t * 4); txt(ctx, 'Tap to continue', W/2, H*.52, 17*S, '#ffe066', OUT, 5*S); ctx.restore(); }
  }
}
function drawPhasePills(){
  const names = ['Bite', 'Reel', 'Tug', 'Pull'], w = 66*S, gap = 8*S, x0 = W/2 - (4*w + 3*gap)/2, y = 52*S;
  names.forEach((n, i) => {
    const done = i < C.idx, cur = i === C.idx && C.phase !== 'fail';
    rr(ctx, x0 + i*(w + gap), y, w, 26*S, 13*S); fs(ctx, done ? '#9fe3c2' : cur ? '#ffe066' : 'rgba(255,253,246,.6)', 2.5*S);
    txt(ctx, (done ? '✓ ' : '') + n, x0 + i*(w + gap) + w/2, y + 13*S, 13*S, OUT, null);
  });
}
function drawReelUI(t){
  txt(ctx, `⏱ ${Math.ceil(Math.max(0, C.time))}`, W - 18*S, 104*S, 16*S, '#fff', OUT, 5*S, 'right');
  bar(W*.1, 96*S, W*.62, 16*S, C.dist / 150, C.dist > 110 ? '#ff8a8a' : '#7fd1f0', 'Distance');
  // finger trail
  if (C.trail.length > 1){ ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 1; i < C.trail.length; i++){ const p = C.trail[i], q = C.trail[i-1]; ctx.globalAlpha = p.l * 1.6; ctx.strokeStyle = '#fff'; ctx.lineWidth = 7*S * p.l * 2;
      ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(p.x, p.y); ctx.stroke(); } ctx.restore(); }
  // reel graphic
  const cx = W/2, cy = H*.8, r = 56*S;
  ctx.save(); ctx.globalAlpha = .45 + .25 * Math.sin(t * 3); ctx.setLineDash([10*S, 10*S]); ctx.lineDashOffset = -t * 40*S;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4*S; ell(ctx, cx, cy, r + 38*S, r + 38*S); ctx.stroke(); ctx.restore();
  ell(ctx, cx, cy, r, r); fs(ctx, '#eef1f5', 3.5*S); ell(ctx, cx, cy, r*.72, r*.72); fs(ctx, '#cfd6de', 3*S);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(C.reelAng);
  ctx.strokeStyle = OUT; ctx.lineWidth = 3*S; for (let i = 0; i < 3; i++){ ctx.rotate(TAU/3); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r*.7, 0); ctx.stroke(); }
  ctx.strokeStyle = OUT; ctx.lineWidth = 9*S; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r*.95, 0); ctx.stroke();
  ctx.strokeStyle = '#8a8f99'; ctx.lineWidth = 5*S; ctx.stroke();
  ell(ctx, r*.95, 0, 13*S, 13*S); fs(ctx, '#ff9fb5', 3*S);
  ctx.restore();
  ell(ctx, cx, cy, 8*S, 8*S); fs(ctx, '#ffe066', 2.5*S);
  txt(ctx, 'Draw circles to reel!', W/2, H*.93, 17*S, '#fff', OUT, 5*S);
}
function drawTugUI(t){
  bar(W*.1, 96*S, W*.8, 16*S, C.tension / 100, C.tension > 70 ? '#ff6b6b' : '#ffb26b', 'Line Tension');
  bar(W*.1, 132*S, W*.8, 16*S, C.prog / C.need, '#7fe0a8', 'Tug Gauge');
  if (C.tension > 70){ ctx.save(); ctx.globalAlpha = (C.tension - 70) / 30 * (.5 + .5 * Math.sin(t * 20)); ctx.strokeStyle = '#ff4a4a'; ctx.lineWidth = 10*S; ctx.strokeRect(0, 0, W, H); ctx.restore(); }
  // arena hint
  const A = TUG_ARENA(); ctx.save(); ctx.globalAlpha = .18; ctx.setLineDash([8*S, 10*S]); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3*S; ell(ctx, A.x, A.y, A.rx + 30*S, A.ry + 30*S); ctx.stroke(); ctx.restore();
  // where the fish is swimming
  arrow(C.fx + Math.cos(C.fa) * 42*S, C.fy + Math.sin(C.fa) * 42*S, C.fa, 30*S, C.thrash > 0 ? '#ff4a4a' : '#ff9a9a', 6*S);
  if (C.eff > .3){ ctx.save(); ctx.globalAlpha = C.eff * .8; ctx.strokeStyle = '#7fe0a8'; ctx.lineWidth = 5*S; ell(ctx, C.fx, C.fy, 50*S, 50*S); ctx.stroke(); ctx.restore(); }
  // joystick
  const ideal = C.fa + Math.PI;
  const bx = ptr.down ? ptr.sx : W/2, by = ptr.down ? ptr.sy : H*.8, R = 65*S;
  ctx.save(); ctx.globalAlpha = ptr.down ? .9 : .55;
  ell(ctx, bx, by, R, R); fs(ctx, 'rgba(255,255,255,.18)'); ctx.lineWidth = 3*S; ctx.strokeStyle = '#fff'; ctx.stroke();
  // ghost arrow = best direction right now
  ctx.globalAlpha = .45 + .25 * Math.sin(t * 8);
  arrow(bx + Math.cos(ideal) * 16*S, by + Math.sin(ideal) * 16*S, ideal, R * .8, '#ffffff', 8*S);
  ctx.restore();
  if (ptr.down){
    const kx = bx + C.jx * C.jm * R, ky = by + C.jy * C.jm * R, col = C.eff > .5 ? '#7fe0a8' : C.eff > 0 ? '#ffe066' : '#ff8a8a';
    ctx.strokeStyle = OUT; ctx.lineWidth = 8*S; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(kx, ky); ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = 4*S; ctx.stroke();
    ell(ctx, kx, ky, 18*S, 18*S); fs(ctx, col, 3*S);
  }
  const msg = !ptr.down ? 'Hold & drag to fight the fish!' : C.eff > .5 ? 'Nice! Keep pulling against it!' : C.eff > 0 ? 'Almost… follow the arrow!' : 'Pull AGAINST its swim!';
  txt(ctx, msg, W/2, H*.93, 16*S, C.eff > .5 ? '#9fe3c2' : '#fff', OUT, 5*S);
}
function drawFinalUI(t){
  const x = W*.08, w = W*.84, y = H*.74, h = 40*S;
  rr(ctx, x, y, w, h, 12*S); fs(ctx, '#fffdf6', 3*S);
  ctx.save(); rr(ctx, x, y, w, h, 12*S); ctx.clip();
  ctx.fillStyle = '#9fe3c2'; ctx.fillRect(x + (C.zc - C.zw/2) * w, y, C.zw * w, h);
  if (C.allPerfect){ ctx.fillStyle = 'rgba(255,255,255,.55)'; for (let i = 0; i < 4; i++){ const sx = x + (C.zc - C.zw/2) * w + ((t * 40*S + i * C.zw * w / 4) % (C.zw * w)); ctx.fillRect(sx, y, 3*S, h); } }
  else { ctx.fillStyle = '#ffe066'; ctx.fillRect(x + (C.zc - C.zw*.16) * w, y, C.zw*.32 * w, h); }
  ctx.restore(); rr(ctx, x, y, w, h, 12*S); ctx.lineWidth = 3*S; ctx.strokeStyle = OUT; ctx.stroke();
  const nx = x + C.np * w;
  ctx.strokeStyle = OUT; ctx.lineWidth = 4*S; ctx.beginPath(); ctx.moveTo(nx, y - 6*S); ctx.lineTo(nx, y + h + 6*S); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(nx, y - 4*S); ctx.lineTo(nx - 10*S, y - 18*S); ctx.lineTo(nx + 10*S, y - 18*S); ctx.closePath(); fs(ctx, '#ff7a7a', 2.5*S);
  txt(ctx, '♥'.repeat(C.chances) + '♡'.repeat(C.maxCh - C.chances), x + w, y - 18*S, 20*S, '#ff7a9a', OUT, 4*S, 'right');
  ctx.save(); const p = 1 + .08 * Math.sin(t * 10); ctx.translate(W/2, H*.88); ctx.scale(p, p);
  txt(ctx, C.allPerfect ? 'TAP in the green zone! (all PERFECT)' : 'TAP in the green zone!', 0, 0, C.allPerfect ? 16*S : 19*S, '#fff', OUT, 5*S); ctx.restore();
}

/* =====================================================================
   JS 12. RESULT — fish, size, rarity stars, trivia
   ===================================================================== */
function finishCatch(perfect){
  const f = C.fish;
  let ratio = Math.pow(Math.random(), 1.5); if (perfect) ratio = .45 + ratio * .55;
  const size = +(f.min + (f.max - f.min) * ratio).toFixed(1);
  const qty = Math.random() < traits().double ? 2 : 1;
  if (save.char === 'soso') save.sosoBonus = qty > 1 ? 0 : Math.min(.2, +((save.sosoBonus || 0) + .02).toFixed(2));
  const coins = Math.round(BAL.coins[f.star - 1] * (.75 + .6 * ratio) * (perfect ? 1.2 : 1)) * qty;
  const rec = save.col[f.id], isNew = !rec, record = rec && size > rec.best;
  save.col[f.id] = { count:(rec ? rec.count : 0) + qty, best:Math.max(rec ? rec.best : 0, size) };
  save.coins += coins; fishCount += qty; writeSave();

  const badges = [];
  if (isNew) badges.push('<span class="badge">NEW!</span>');
  if (record) badges.push('<span class="badge b2">New Record!</span>');
  if (ratio > .85) badges.push('<span class="badge b2">BIG ONE!</span>');
  if (perfect) badges.push('<span class="badge b3">Perfect Pull</span>');
  if (qty > 1) badges.push('<span class="badge b3">×2 Double Catch!</span>');
  if (save.char === 'soso') badges.push(`<span class="badge b2" style="animation:none">Soso wants fish: ${Math.round(20 + save.sosoBonus * 100)}%</span>`);
  document.getElementById('rBadges').innerHTML = badges.join('');
  const rc = document.getElementById('rCanvas'); rc.width = 600; rc.height = 260;
  const c = rc.getContext('2d'); c.setTransform(2, 0, 0, 2, 0, 0);
  // sparkle backdrop
  c.fillStyle = '#e9f7fc'; rr(c, 4, 4, 292, 122, 20); c.fill();
  c.fillStyle = '#ffe9a8'; for (let i = 0; i < 9; i++){ const a = i / 9 * TAU; c.beginPath(); c.moveTo(150, 65); c.arc(150, 65, 160, a, a + .17); c.closePath(); c.globalAlpha = .5; c.fill(); }
  c.globalAlpha = 1;
  const RL = f.type === 'oar' ? 250 : Math.min(190, 90 / f.h);
  if (qty > 1) drawFish(c, f, 175, 50, RL * .8, 0);
  drawFish(c, f, 140, 70, RL, 0);
  document.getElementById('rStars').textContent = stars(f.star);
  document.getElementById('rName').textContent = f.name;
  document.getElementById('rJp').textContent = f.jp;
  document.getElementById('rSize').textContent = '📏 ' + fmtSize(size);
  document.getElementById('rHab').textContent = (f.hab === 'river' ? '🏞️ ' : f.hab === 'ocean' ? '🌊 ' : '🌑 ') + HAB[f.hab].name;
  document.getElementById('rTrivia').textContent = f.trivia;
  document.getElementById('rCoins').textContent = coins;
  showLayer('result');
}
document.getElementById('btnAgain').onclick = () => fadeTo(initFishing);
document.getElementById('btnHome').onclick  = () => fadeTo(enterHut);
document.getElementById('hutBtn').onclick   = () => { if (['idle','waiting','casting','nibble'].includes(F.state)) fadeTo(enterHut); };

/* =====================================================================
   JS 13. INPUT (pointer — works for touch + mouse)
   ===================================================================== */
const ptr = { down:false, x:0, y:0, sx:0, sy:0 };
function pos(e){ const r = cv.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); const p = pos(e);
  ptr.down = true; ptr.x = ptr.sx = p.x; ptr.y = ptr.sy = p.y;
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  if (scene === 'title' && !TZ) TZ = { t:0 };
  else if (scene === 'fishing') fishingTap(p);
  else if (scene === 'catch'){
    if (C.phase === 'reel'){ C.ax = p.x; C.ay = p.y; C.lv = null; }
    else if (C.phase === 'final' && C.pt > .4) finalTap();
    else if (C.phase === 'fail' && C.failT > .7) fadeTo(initFishing);
  }
});
cv.addEventListener('pointermove', e => {
  if (!ptr.down) return; const p = pos(e); ptr.x = p.x; ptr.y = p.y;
  if (scene === 'catch' && C.phase === 'reel'){
    const dx = p.x - C.ax, dy = p.y - C.ay;
    if (Math.hypot(dx, dy) >= 5*S){ reelInput(dx, dy); C.ax = p.x; C.ay = p.y; }
    C.trail.push({ x:p.x, y:p.y, l:.45 });
  }
});
function up(){ ptr.down = false; if (scene === 'catch') C.lv = null; }
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
document.addEventListener('gesturestart', e => e.preventDefault());

/* =====================================================================
   JS 14. LAYERS, FADE, MAIN LOOP
   ===================================================================== */
function showLayer(id){ document.getElementById(id).classList.add('on'); }
function hideLayer(id){ document.getElementById(id).classList.remove('on'); }
function hideAll(){ ['hutUI', 'panel', 'fishHUD', 'result'].forEach(hideLayer); }
function refreshCoins(){ document.querySelectorAll('.coinTxt').forEach(el => el.textContent = save.coins); }
let fading = false;
function fadeTo(cb){
  if (fading) return; fading = true; fadeEl.style.opacity = 1;
  setTimeout(() => { cb(); fadeEl.style.opacity = 0; setTimeout(() => fading = false, 300); }, 320);
}

function update(dt){
  if (scene === 'title') updTitle(dt);
  else if (scene === 'fishing') updFishing(dt);
  else if (scene === 'catch') updCatch(dt);
}
function draw(){
  ctx.clearRect(0, 0, W, H);
  if (scene === 'title') drawTitle(T);
  else if (scene === 'hut') drawHutInside(T);
  else if (scene === 'fishing') drawFishing(T);
  else if (scene === 'catch') drawCatch(T);
}
let last = performance.now();
function loop(now){
  const dt = Math.min(.033, (now - last) / 1000); last = now; T += dt;
  update(dt); draw(); requestAnimationFrame(loop);
}
resize(); refreshCoins(); requestAnimationFrame(loop);
</script>
