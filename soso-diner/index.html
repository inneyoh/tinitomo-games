<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Soso's Diner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Soso's Diner">
<meta name="theme-color" content="#bfe8d2">
<link rel="icon" href="art/chars/soso.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#5a3b2a; --ink-soft:#8a6650;
  --cream:#fff8ea; --milk:#fffdf6; --beige:#f3dfbf;
  --mint:#7fd6a8; --mint-deep:#4cbf86; --mint-pale:#d4f3e2;
  --peach:#ffb994; --butter:#ffd86b; --pink:#ff9fb2;
  --bg:#bfe8d2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;color:var(--ink);background:var(--bg);
  font-family:"Fredoka",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;font-weight:600}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
#game{position:relative;height:min(100dvh,177.78vw);aspect-ratio:9/16;max-width:100vw;overflow:hidden}
#game>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
text{font-family:"Fredoka",ui-rounded,system-ui,sans-serif;font-weight:700}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(90,59,42,.28);z-index:5}
.ov.hide{display:none}
.card{width:100%;max-width:340px;max-height:100%;overflow:auto;background:var(--milk);border-radius:26px;padding:18px 16px;text-align:center;
  border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
.card h1{margin:2px 0;font-size:31px;font-weight:700;color:var(--ink)}
.card h2{margin:2px 0 6px;font-size:24px;font-weight:700}
.card p{margin:6px 0;font-size:14px;line-height:1.35;color:var(--ink-soft);font-weight:600}
.btn{display:block;width:100%;margin:10px 0 0;padding:12px 10px;border:3px solid var(--ink);border-radius:18px;font:inherit;font-size:19px;font-weight:700;
  color:var(--ink);background:var(--mint);box-shadow:0 4px 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--cream)}
.btn.peach{background:var(--peach)}
.big{width:150px;height:150px;display:block;margin:0 auto;object-fit:contain}
.how{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0 4px;text-align:left}
.how div{background:var(--mint-pale);border-radius:14px;padding:7px 9px;font-size:12px;line-height:1.3;border:2px solid var(--ink)}
.how b{display:block;font-size:15px}
.stats{display:flex;justify-content:space-around;margin:10px 0;background:var(--mint-pale);border:2px solid var(--ink);border-radius:16px;padding:8px 4px}
.stats div{font-size:12px;color:var(--ink-soft)}
.stats b{display:block;font-size:23px;color:var(--ink)}
.stars{font-size:38px;letter-spacing:4px;margin:0;-webkit-text-stroke:2px var(--ink)}
.stars .off{color:#f1e4cf}.stars .on{color:var(--butter)}
.face{display:flex;align-items:center;gap:10px;background:var(--cream);border:2px solid var(--ink);border-radius:18px;padding:7px 10px;margin:8px 0;text-align:left}
.face img{width:66px;height:66px;flex:none;object-fit:contain}
.face b{font-size:18px}.face span{display:block;font-size:12.5px;color:var(--ink-soft);line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chips i{font-style:normal;font-size:11px;background:var(--mint-pale);border:1.5px solid var(--ink);border-radius:9px;padding:1px 6px}
.tag{display:inline-block;background:var(--butter);border:2px solid var(--ink);border-radius:10px;padding:0 7px;font-size:11px;margin-bottom:2px}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
.up{background:var(--cream);border:2px solid var(--ink);border-radius:18px;padding:7px 7px 8px;display:flex;flex-direction:column;align-items:center}
.up img{width:52px;height:52px;object-fit:contain}
.up b{font-size:14px;margin-top:1px}
.up span{font-size:11px;color:var(--ink-soft);line-height:1.25;min-height:28px;margin:2px 0 4px}
.pips{display:flex;gap:4px;margin-bottom:6px}.pips i{width:10px;height:10px;border-radius:50%;background:#f1e4cf;border:1.5px solid var(--ink)}.pips i.on{background:var(--mint-deep)}
.buy{border:2.5px solid var(--ink);border-radius:12px;padding:5px 8px;font:inherit;font-weight:700;font-size:14px;color:var(--ink);background:var(--butter);box-shadow:0 3px 0 var(--ink);width:100%;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.buy.max{background:#e8dccb;box-shadow:none;pointer-events:none}
.buy.poor{background:#efe6d8;color:#b49a86;box-shadow:none;pointer-events:none}
.buy img,.wallet img{width:18px;height:18px}
.wallet{display:inline-flex;align-items:center;gap:6px;background:var(--butter);border:2.5px solid var(--ink);border-radius:14px;padding:3px 12px;font-size:18px}
.row{display:flex;gap:8px}.row .btn{flex:1}
.lineup{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin:6px 0}
.lineup img{width:48px;height:48px;object-fit:contain}
</style>
</head>
<body>
<div id="wrap"><div id="game">
<svg id="svg" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <g id="bg"></g>
  <g id="tablesBack"></g>
  <g id="seated"></g>
  <g id="tablesFront"></g>
  <g id="counterL"></g>
  <g id="markers" pointer-events="none"></g>
  <g id="sosoL" pointer-events="none"></g>
  <g id="walkers"></g>
  <g id="ui" pointer-events="none"></g>
  <g id="fx" pointer-events="none"></g>
  <g id="hud"></g>
</svg>
<div class="ov" id="ov"><div class="card" id="card"></div></div>
</div></div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const INK='#5a3b2a';
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function el(tag,attrs,parent,html){const e=document.createElementNS(NS,tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e;}

/* ================= art (all generated with OpenArt) ================= */
const ART='art/';
const CH=n=>`${ART}chars/${n.toLowerCase()}.webp`;
const img=(href,x,y,w,h,extra='')=>`<image href="${href}" x="${x}" y="${y}" width="${w}" height="${h}" ${extra}/>`;
/* square character sprite, feet at (0,0) */
const charImg=(n,w)=>img(CH(n),-w/2,-w,w,w);
const DISH_IDS=['pancake','onigiri','pudding','bao','ramen'];
const dishImg=(d,w)=>img(`${ART}dish_${d}.webp`,-w/2,-w,w,w);
const COINI=`${ART}coin.webp`;
/* sizes of the trimmed art, in pixels */
const SZ={counter:[900,367],t2:[420,402,.458],t4:[420,256,.324],t6:[640,279,.323],bin:[256,302],slip:[256,274],dirty:[256,220],bench:[900,190]};
const preload=[];
function pre(src){const i=new Image();i.src=src;preload.push(i);}

/* ================= characters ================= */
/* pat: patience (higher = waits longer) · eat: eating time (higher = slower) · tip: tip multiplier
   fit: perfect-fit bonus multiplier · fitTip: tip multiplier when seated at a perfect fit */
const SPECIALS={
  Momo:  {pat:1,   eat:.7,  tip:1,   blurb:'Normal patience, but a speedy eater.'},
  Popo:  {pat:.75, eat:1,   tip:1.45,blurb:'Not very patient… but tips beautifully.'},
  Kew:   {pat:1.3, eat:1.35,tip:1,   blurb:'Grumpy face, patient heart. Takes slow bites.'},
  Bae:   {pat:1.3, eat:1.35,tip:1,   blurb:'Shy and patient. Eats slowly and quietly.'},
  Rang:  {pat:1,   eat:1,   tip:1,   fit:2, blurb:'Loves a perfect-fit table: double fit bonus!'},
  Guinny:{pat:1.3, eat:1,   tip:1,   fitTip:1.6, blurb:'Patient, and tips big at a perfect-fit table.'},
  Kuma:  {pat:1.4, eat:1.3, tip:.9,  blurb:'A cuddly bear. Very patient, eats a lot.'},
  Piyo:  {pat:.75, eat:.7,  tip:1.2, blurb:'Peep! In a hurry and eats quickly.'},
  Gwoof: {pat:.8,  eat:1,   tip:1.6, blurb:'Waggy and impatient, but tips big!'},
  Bun:   {pat:1.3, eat:1.1, tip:.8,  blurb:'Calm little bunny. Small tips, big smiles.'},
};
const UNLOCK=['Momo','Popo','Kew','Bae','Rang','Guinny','Kuma','Piyo','Gwoof','Bun']; /* day1: first 3, then +1 per day */
const MOBS=['mob_hamster','mob_frog','mob_lamb','mob_fox','mob_panda','mob_mouse'];
const MOB={pat:1,eat:1,tip:1};
function traits(d){const t=[];
  if(d.pat>1.1)t.push('Patient');else if(d.pat<.9)t.push('Impatient');
  if(d.eat<.9)t.push('Fast eater');else if(d.eat>1.1)t.push('Slow eater');
  if(d.tip>1.1)t.push('Big tipper');else if(d.tip<.95)t.push('Small tipper');
  if(d.fit)t.push('2× fit bonus'); if(d.fitTip)t.push('Fit-table tips');
  return t;}
UNLOCK.concat(MOBS,'Soso').forEach(n=>pre(CH(n)));

/* ================= upgrades ================= */
const UPG=[
  {id:'shoes', name:'Bouncy Shoes', desc:'Soso zips around faster.', cost:[40,90,160]},
  {id:'chairs',name:'Comfy Chairs', desc:'Seated guests stay happy longer.', cost:[50,100,170]},
  {id:'aircon',name:'Better Air Con',desc:'Guests in line wait more calmly.', cost:[45,95,165]},
  {id:'stove', name:'Speedy Stove', desc:'The kitchen cooks faster.', cost:[50,110,180]},
  {id:'radio', name:'Lo-fi Radio', desc:'Guests eat faster to the beat.', cost:[40,85,150]},
  {id:'tips',  name:'Cute Tip Jar', desc:'+20% tips per level.', cost:[60,120,200]},
  {id:'tray',  name:'Big Tray', desc:'Carry 3 things instead of 2.', cost:[120]},
  {id:'vase',  name:'Flower Vase', desc:'Guests pick their orders faster.', cost:[45,95,160]},
];

/* ================= save ================= */
let S={day:1,coins:0,upg:{},best:0};
try{const s=JSON.parse(localStorage.getItem('soso-diner2')||'null'); if(s&&s.day)S=Object.assign(S,s);}catch(e){}
const save=()=>{try{localStorage.setItem('soso-diner2',JSON.stringify(S));}catch(e){}};
const lvl=id=>S.upg[id]||0;

/* ================= sound ================= */
let AC=null, muted=false; try{muted=localStorage.getItem('soso-diner-mute')==='1';}catch(e){}
function boop(f=660,d=.09,type='sine',v=.05,slide=0){
  if(muted)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
const sfx={
  tap:()=>boop(520,.06,'sine',.04),
  pick:()=>boop(760,.06,'triangle',.05,1.2),
  seat:()=>{boop(600,.08);setTimeout(()=>boop(800,.1),70);},
  order:()=>boop(880,.08,'triangle',.05,1.3),
  bell:()=>{boop(1568,.3,'sine',.05);setTimeout(()=>boop(1568,.25,'sine',.03),90);},
  ding:()=>boop(1320,.25,'sine',.05),
  serve:()=>{boop(700,.08);setTimeout(()=>boop(940,.12),80);},
  coin:()=>{boop(990,.07,'square',.025);setTimeout(()=>boop(1480,.14,'square',.025),70);},
  trash:()=>boop(300,.12,'triangle',.05,.7),
  combo:n=>boop(660+n*80,.1,'square',.03,1.3),
  sad:()=>boop(330,.3,'triangle',.05,.6),
  no:()=>boop(240,.1,'triangle',.04),
  buy:()=>{boop(660,.08);setTimeout(()=>boop(880,.08),80);setTimeout(()=>boop(1100,.14),160);},
};

/* ================= layout (viewBox 360×640) ================= */
const AISLE=180;
const COUNTER={x:0,y:34,w:360,h:147};
const BELL={x:56,y:205};                 /* where Soso stands to drop order slips */
const SLOT_X=[112,160,208,256], SLOT_Y=114, KITCHEN_Y=205;
const BIN={x:334,y:240,w:40};            /* feet of bin */
const BIN_SPOT={x:300,y:222};
const LINE_Y=630, LINE_L=30, LINE_R=312;
const GW=46, GW_LINE=48, SOSO_W=60;
const TABLE_DEF=[
  {x:92, top:236,seats:2,w:100,img:'t2'},{x:268,top:236,seats:2,w:100,img:'t2'},
  {x:92, top:354,seats:4,w:156,img:'t4'},{x:268,top:354,seats:4,w:156,img:'t4'},
  {x:180,top:462,seats:6,w:262,img:'t6'}];
function tableSpot(t){
  if(t.seats===2)return {x:t.x<AISLE?t.x+64:t.x-64,y:t.top+108};
  if(t.seats===4)return {x:t.x<AISLE?172:188,y:t.top+84};
  return {x:AISLE,y:t.top+t.h+10};
}
const partyW=n=>32+15*(n-1);

/* ================= scene ================= */
function drawScene(){
  const c=COUNTER;
  $('bg').innerHTML=img(`${ART}floor.webp`,0,0,360,640,'preserveAspectRatio="xMidYMid slice"')+
    img(`${ART}bench.webp`,20,592,300,300*SZ.bench[1]/SZ.bench[0]);
  $('counterL').innerHTML=img(`${ART}counter.webp`,c.x,c.y,c.w,c.h)+
    `<g data-tap="bell" style="cursor:pointer"><rect x="20" y="40" width="72" height="80" fill="#000" fill-opacity="0"/></g>
     <g id="slipStack"></g>
     <g data-tap="bin" style="cursor:pointer">${img(`${ART}bin.webp`,BIN.x-BIN.w/2,BIN.y-BIN.w*SZ.bin[1]/SZ.bin[0],BIN.w,BIN.w*SZ.bin[1]/SZ.bin[0])}
       <rect x="${BIN.x-26}" y="${BIN.y-58}" width="52" height="62" fill="#000" fill-opacity="0"/></g>
     <g id="kitchenItems"></g>`;
}

/* ================= HUD ================= */
function drawHUD(){
  $('hud').innerHTML=`
   <rect x="6" y="5" width="348" height="32" rx="16" fill="#fffdf6" stroke="${INK}" stroke-width="2.5"/>
   <rect x="10" y="9" width="58" height="24" rx="12" fill="#ffd86b" stroke="${INK}" stroke-width="2"/>
   <text id="hDay" x="39" y="26" text-anchor="middle" font-size="13" fill="${INK}">Day 1</text>
   ${img(COINI,74,10,22,22)}
   <rect x="100" y="13" width="120" height="16" rx="8" fill="#f1e4cf" stroke="${INK}" stroke-width="2"/>
   <rect id="hBar" x="101" y="14" width="0" height="14" rx="7" fill="#7fd6a8"/>
   <path id="hGoal" d="M175 11 v20" stroke="${INK}" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 2.5"/>
   <text id="hCoins" x="160" y="25.5" text-anchor="middle" font-size="11" fill="${INK}">0 / 0</text>
   <text id="hGuests" x="268" y="26" text-anchor="middle" font-size="12" fill="${INK}">0 groups</text>
   <g data-tap="pause" style="cursor:pointer"><circle cx="333" cy="21" r="13" fill="#7fd6a8" stroke="${INK}" stroke-width="2.5"/><rect x="327.5" y="15" width="4" height="12" rx="2" fill="${INK}"/><rect x="334.5" y="15" width="4" height="12" rx="2" fill="${INK}"/></g>
   <g id="comboG" opacity="0"><rect x="118" y="44" width="124" height="26" rx="13" fill="#ffd86b" stroke="${INK}" stroke-width="2.5"/><text id="comboT" x="180" y="62" text-anchor="middle" font-size="15" fill="${INK}">Combo ×2</text></g>`;
}
function updateHUD(){
  $('hDay').textContent='Day '+S.day;
  $('hBar').setAttribute('width',Math.max(0,Math.min(118,118*G.earned/(G.goal*1.6))));
  $('hGoal').setAttribute('d',`M${101+118/1.6} 11 v20`);
  $('hCoins').textContent=`${G.earned} / ${G.goal}`;
  $('hGuests').textContent=`${G.plan.length-G.spawned+G.parties.length} groups`;
}

/* ================= state ================= */
let G=null, uid=0;
function unlocked(){return UNLOCK.slice(0,Math.min(UNLOCK.length,2+S.day));}
function planDay(day){
  const n=Math.min(16,6+day), maxSize=Math.min(6,2+day), plan=[];
  for(let i=0;i<n;i++){let size=1+Math.floor(Math.pow(Math.random(),1.5)*maxSize); if(i===0)size=Math.min(size,2); plan.push(size);}
  if(day>=3&&!plan.includes(6))plan[n-2]=6;
  if(day>=2&&!plan.some(s=>s>=3))plan[2]=3;
  return plan;
}
function newDay(){
  const day=S.day, plan=planDay(day), guests=plan.reduce((a,b)=>a+b,0);
  G={plan,spawned:0,served:0,lost:0,earned:0,goal:Math.round(guests*(10+0.5*Math.min(day,9))),guests,
     spawnT:1,tables:[],line:[],parties:[],kitchen:[],hands:[],tasks:[],cur:null,sel:null,drag:null,
     soso:{x:AISLE,y:KITCHEN_Y,dir:1,path:[],act:0,phase:0,mood:'',moodT:0},
     combo:0,lastAct:-9,clock:0,ending:0,fxs:[]};
  ['tablesBack','seated','tablesFront','markers','sosoL','walkers','ui','fx'].forEach(id=>$(id).innerHTML='');
  $('kitchenItems').innerHTML=''; $('slipStack').innerHTML='';
  TABLE_DEF.forEach((d,i)=>{
    const [iw,ih,split]=SZ[d.img], w=d.w, h=w*ih/iw, x0=d.x-w/2, sy=split*h;
    const back=el('g',{'data-tap':'t','data-i':i,style:'cursor:pointer'},$('tablesBack'),
      `<rect class="glow" x="${x0-6}" y="${d.top-6}" width="${w+12}" height="${h+12}" rx="18" fill="#fff6b0" stroke="#ffd86b" stroke-width="3" opacity="0"/>`+
      img(`${ART}${d.img}.webp`,x0,d.top,w,h));
    const front=el('g',{'data-tap':'t','data-i':i,style:'cursor:pointer'},$('tablesFront'),
      `<svg x="${x0}" y="${d.top+sy}" width="${w}" height="${h-sy}" viewBox="0 ${sy} ${w} ${h-sy}" overflow="hidden">${img(`${ART}${d.img}.webp`,0,0,w,h)}</svg>
       <rect x="${x0-4}" y="${d.top-30}" width="${w+8}" height="${h+34}" fill="#000" fill-opacity="0"/>
       <g transform="translate(${x0+w-12} ${d.top+h-12})"><circle r="10" fill="#fffdf6" stroke="${INK}" stroke-width="2"/><text y="4.5" text-anchor="middle" font-size="12" fill="${INK}">${d.seats}</text></g>`);
    const dishG=el('g',{},front);
    G.tables.push({i,x:d.x,top:d.top,w,h,seats:d.seats,seatY:d.top+sy,party:null,dirty:false,back,front,dishG,glow:back.querySelector('.glow')});
  });
  const s=G.soso; s.g=el('g',{},$('sosoL')); s.img=el('g',{},s.g,charImg('Soso',SOSO_W));
  s.carry=el('g',{},$('sosoL')); s.emote=el('g',{},$('sosoL'));
  renderSoso(); renderMarkers(); updateHUD(); $('comboG').setAttribute('opacity',0);
}

/* ---------- movement ---------- */
function route(x0,y0,x1,y1){const p=[];if(Math.abs(y1-y0)>20){p.push([AISLE,y0]);p.push([AISLE,y1]);}p.push([x1,y1]);return p;}
function moveAlong(o,dt,v){
  let budget=v*dt; o.moving=false;
  while(budget>0&&o.path.length){
    const [tx,ty]=o.path[0], dx=tx-o.x, dy=ty-o.y, d=Math.hypot(dx,dy);
    if(Math.abs(dx)>1)o.dir=dx>0?1:-1;
    o.moving=true;
    if(d<=budget){o.x=tx;o.y=ty;budget-=d;o.path.shift();}
    else{o.x+=dx/d*budget;o.y+=dy/d*budget;budget=0;}
  }
}

/* ---------- parties ---------- */
const HEART='M0 2.2 C0 -1.2 -4.6 -2.2 -4.6 1.2 C-4.6 3.6 -1.4 5.6 0 6.8 C1.4 5.6 4.6 3.6 4.6 1.2 C4.6 -2.2 0 -1.2 0 2.2Z';
function lineRight(){let x=LINE_L;for(const p of G.line)x+=partyW(p.size)+8;return x;}
function spawn(){
  const size=G.plan[G.spawned];
  if(lineRight()+partyW(size)>LINE_R)return false;
  const specials=unlocked(), special=Math.random()<.5?pick(specials):null;
  const members=[]; for(let k=0;k<size;k++)members.push(k===0&&special?special:pick(MOBS));
  const d=special?SPECIALS[special]:MOB;
  const p={id:++uid,size,members,special,d,state:'line',x:-70,y:LINE_Y,dir:1,path:[],hearts:5,t:0,dish:pick(DISH_IDS),
           table:null,phase:Math.random()*6,uiKey:'',hk:-1,fit:false,mems:[]};
  p.g=el('g',{'data-tap':'p','data-id':p.id,style:'cursor:grab'},$('walkers'));

  el('rect',{x:-partyW(size)/2-8,y:-GW_LINE-10,width:partyW(size)+16,height:GW_LINE+18,fill:'#000','fill-opacity':0},p.g);
  p.ui=el('g',{},$('ui'));

  p.badge.innerHTML=(size>1?`<circle r="9" fill="#fffdf6" stroke="${INK}" stroke-width="2"/><text y="4.2" text-anchor="middle" font-size="12" fill="${INK}">${size}</text>`:'')+
    (special?`<path transform="translate(${size>1?-14:0} 0) scale(.9)" d="M0 -9 L2.6 -3 L9 -2.6 L4 1.6 L5.6 8 L0 4.6 L-5.6 8 L-4 1.6 L-9 -2.6 L-2.6 -3Z" fill="#ffd86b" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round"/>`:'');
  setOffsets(p,'cluster',true);

}
function setOffsets(p,mode,snap){
  p.mems.forEach((m,k)=>{
    const n=p.size;
    if(mode==='row'){const sp=Math.min(32,(p.table.w*.78)/Math.max(1,n));m.tx=(k-(n-1)/2)*sp;m.ty=0;}
    else{m.tx=(k-(n-1)/2)*15;m.ty=-(k%2)*3;}
    if(snap){m.ox=m.tx;m.oy=m.ty;}
  });
}
function layoutLine(){let x=LINE_L;for(const p of G.line){const w=partyW(p.size);if(G.drag&&G.drag.p===p){x+=w+8;continue;}p.path=[[x+w/2,LINE_Y]];x+=w+8;}}
function fits(p,t){return !t.party&&!t.dirty&&t.seats>=p.size;}
function refreshGlow(p){

  for(const q of G.line)q.selG.setAttribute('opacity',q===G.sel?1:0);
}
function seat(p,t){

  t.party=p; p.table=t; p.state='menu'; p.t=rnd(2,3.2)*(1-0.15*lvl('vase'));

  layoutLine(); refreshGlow(null); sfx.seat();
}
function drainRate(){return 0.072+0.005*Math.min(S.day,12);}
const SEATED=['menu','order','food','eat','check'];
function updateParty(p,dt){
  if(!(G.drag&&G.drag.p===p))moveAlong(p,dt,p.state==='leave'?200:180);
  p.phase+=dt*(p.moving?12:2.4);
  const seatedMult=1-0.17*lvl('chairs'), lineMult=1-0.17*lvl('aircon'), big=1+(p.size-1)*0.04;
  switch(p.state){
    case 'line': p.hearts-=dt*drainRate()*lineMult*big/p.d.pat; break;
    case 'menu': p.t-=dt; if(p.t<=0){p.state='order';sfx.order();} break;
    case 'order': case 'food': case 'check':
      p.hearts-=dt*drainRate()*seatedMult*big/p.d.pat*(p.state==='food'?0.85:1); break;
    case 'eat': p.t-=dt; if(p.t<=0){p.state='check';p.table.dishG.innerHTML=plates(p.table,p.size,'dirty');sfx.order();} break;
    case 'leave': if(!p.path.length){removeParty(p);return;} break;
  }
  if(p.state!=='leave'&&p.hearts<=0)angryLeave(p);
  renderParty(p,dt);
}
function renderParty(p,dt){
  const seated=SEATED.includes(p.state), dragging=G.drag&&G.drag.p===p&&G.drag.moved;
  if(p.hopT>0)p.hopT-=dt;
  const hop=p.hopT>0?-Math.sin((1-p.hopT/.35)*Math.PI)*10:0;
  p.g.setAttribute('transform',`translate(${p.x.toFixed(1)} ${(p.y+hop).toFixed(1)})${dragging?' scale(1.12)':''}`);
  const sad=p.state!=='leave'&&p.hearts<2, happy=p.state==='eat'||p.mood==='happy';
  p.mems.forEach((m,k)=>{
    m.ox+=(m.tx-m.ox)*Math.min(1,dt*10); m.oy+=(m.ty-m.oy)*Math.min(1,dt*10);
    const ph=p.phase+k*1.3;
    let bob=p.moving?-Math.abs(Math.sin(ph))*4:Math.sin(ph)*(seated?.8:1.2);
    if(happy&&!p.moving)bob=-Math.abs(Math.sin(ph*2.4))*3;
    if(dragging)bob=Math.sin(ph*3)*2;
    const rot=p.moving?Math.sin(ph)*6:(sad?Math.sin(ph*9)*3:0);
    m.g.setAttribute('transform',`translate(${m.ox.toFixed(1)} ${(m.oy+bob).toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${p.dir} 1)`);
  });
  const hk=p.state==='leave'?-1:Math.ceil(p.hearts);
  if(hk!==p.hk){p.hk=hk;[...p.heartsG.children].forEach((h,k)=>{h.setAttribute('fill',k<hk?(hk<=2?'#ff7d8f':'#ff9fb2'):'#f1e4cf');h.setAttribute('stroke',INK);});
    p.heartsG.style.display=hk<0?'none':'';}
  const top=p.y-(seated?GW:GW_LINE)-12+hop;
  p.ui.setAttribute('transform',`translate(${p.x.toFixed(1)} ${top.toFixed(1)})`);
  if(p.state!==p.uiKey){p.uiKey=p.state;
    p.heartsG.setAttribute('transform',p.state==='line'?'translate(0 6) scale(.8)':'');
    let icon='';
    if(p.state==='menu')icon=`<text y="6" text-anchor="middle" font-size="17" fill="${INK}">…</text>`;
    else if(p.state==='order')icon=img(`${ART}slip.webp`,-11,-12,22,22*SZ.slip[1]/SZ.slip[0]);
    else if(p.state==='food')icon=dishImg(p.dish,26).replace('y="-26"','y="-14"');
    else if(p.state==='check')icon=img(COINI,-11,-11,22,22);
    const hot=p.state==='order'||p.state==='check';
    p.bubble.innerHTML=icon?`<g transform="translate(46 -4)"><g class="bb"><path d="M-12 11 L-22 21 L0 13Z" fill="${hot?'#fff6b0':'#fffdf6'}" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/><rect x="-18" y="-16" width="36" height="31" rx="12" fill="${hot?'#fff6b0':'#fffdf6'}" stroke="${INK}" stroke-width="2.2"/><path d="M-11 13 L-1 13" stroke="${hot?'#fff6b0':'#fffdf6'}" stroke-width="3"/>${icon}</g></g>`:'';
    p.badge.setAttribute('transform',p.state==='line'?`translate(${partyW(p.size)/2+4} 18)`:'translate(0 -999)');
  }
  const bb=p.bubble.querySelector('.bb');
  if(bb){const s=(p.state==='order'||p.state==='check')?1+Math.max(0,Math.sin(p.phase*2.4))*.1:1;bb.setAttribute('transform',`scale(${s.toFixed(3)})`);}
  const em=sad?'sad':(p.state==='eat'?'eat':'');
  if(em!==p.em){p.em=em;
    p.emote.innerHTML=em==='sad'?`<path d="M-34 14 q-6 9 0 13 q6 -4 0 -13z" fill="#bfe6ff" stroke="${INK}" stroke-width="1.6"/>`
      :em==='eat'?`<text x="46" y="2" text-anchor="middle" font-size="12" fill="${INK}" stroke="#fffdf6" stroke-width="3" paint-order="stroke">nom nom<animate attributeName="opacity" values="1;.35;1" dur=".9s" repeatCount="indefinite"/></text>`:'';}
}
function plates(t,n,kind){
  const out=[], sp=Math.min(32,(t.w*.78)/Math.max(1,n)), y=t.seatY+12;
  for(let k=0;k<n;k++){const x=t.x+(k-(n-1)/2)*sp;
    out.push(kind==='dirty'?img(`${ART}dirty.webp`,x-12,y-14,24,24*SZ.dirty[1]/SZ.dirty[0]):`<g transform="translate(${x.toFixed(1)} ${y+6})">${dishImg(kind,26)}</g>`);}
  return out.join('');
}
function dirtyMark(t){t.dishG.innerHTML=img(`${ART}dirty.webp`,t.x-18,t.seatY-2,36,36*SZ.dirty[1]/SZ.dirty[0])+
  `<g transform="translate(${t.x+24} ${t.seatY-6})"><circle r="9" fill="#fff6b0" stroke="${INK}" stroke-width="2"/><text y="4.5" text-anchor="middle" font-size="12" fill="${INK}">!</text></g>`;}
function angryLeave(p){
  G.lost+=p.size; sfx.sad(); resetCombo();
  fxText(p.x,p.y-GW-24,'hmph!','#c0605a');
  if(G.sel===p)G.sel=null; p.selG.setAttribute('opacity',0);

    if(p.state==='check'){t.dirty=true;dirtyMark(t);}else t.dishG.innerHTML='';
    t.party=null;
    G.kitchen.filter(k=>k.party===p).forEach(removeKitchen);
    const before=G.hands.length; G.hands=G.hands.filter(h=>h.party!==p||h.type==='trash'); if(G.hands.length!==before){fxText(G.soso.x,G.soso.y-74,'poof','#8a6650');renderCarry();}

  }else{G.line.splice(G.line.indexOf(p),1);layoutLine();p.path=[[p.x,LINE_Y-20],[-80,LINE_Y-20]];}
  p.state='leave'; p.table=null; refreshGlow(G.sel);
}
function removeParty(p){p.g.remove();p.ui.remove();G.parties.splice(G.parties.indexOf(p),1);updateHUD();}

/* ---------- kitchen ---------- */
function addKitchen(p){
  const used=new Set(G.kitchen.map(k=>k.slot));
  let slot=-1; for(let s=0;s<SLOT_X.length;s++)if(!used.has(s)){slot=s;break;}
  if(slot<0)return null;
  const k={id:++uid,slot,party:p,dish:p.dish,t:0,dur:(4.6+0.45*p.size)*(1-0.16*lvl('stove')),ready:false};
  k.g=el('g',{transform:`translate(${SLOT_X[slot]} ${SLOT_Y})`,'data-tap':'k','data-id':k.id,style:'cursor:pointer'},$('kitchenItems'));
  renderKitchen(k); G.kitchen.push(k); return k;
}
function tagMarkup(k){
  return `<g transform="translate(14 -26)"><circle r="10" fill="#fffdf6" stroke="${INK}" stroke-width="1.8"/>${charImg(k.party.members[0],22).replace(/y="-22"/,'y="-14"')}</g>`+
    (k.party.size>1?`<g transform="translate(-15 -28)"><circle r="8" fill="#ffd86b" stroke="${INK}" stroke-width="1.8"/><text y="4" text-anchor="middle" font-size="10.5" fill="${INK}">${k.party.size}</text></g>`:'');
}
function renderKitchen(k){
  const hit=`<rect x="-24" y="-46" width="48" height="56" fill="#000" fill-opacity="0"/>`;
  if(!k.ready){
    k.g.innerHTML=`${hit}${img(`${ART}pot.webp`,-17,-34,34,34)}
      <circle cx="0" cy="4" r="0" fill="none"/>
      <rect x="-18" y="2" width="36" height="7" rx="3.5" fill="#fffdf6" stroke="${INK}" stroke-width="1.6"/>
      <rect class="bar" x="-17" y="3" width="0" height="5" rx="2.5" fill="#7fd6a8"/>${tagMarkup(k)}`;

  }else{
    k.g.innerHTML=`${hit}<g class="dz">${dishImg(k.dish,38).replace('y="-38"','y="-34"')}</g>${tagMarkup(k)}`;
    k.dz=k.g.querySelector('.dz');
  }
}
function removeKitchen(k){k.g.remove();G.kitchen.splice(G.kitchen.indexOf(k),1);}
function updateKitchen(dt){
  for(const k of G.kitchen){
    if(!k.ready){k.t+=dt;k.bar.setAttribute('width',(34*Math.min(1,k.t/k.dur)).toFixed(1));

    else if(k.dz){const b=Math.abs(Math.sin(performance.now()/240+k.slot))*3;k.dz.setAttribute('transform',`translate(0 ${(-b).toFixed(1)})`);}
  }
}

/* ---------- soso & tasks ---------- */
function carryCap(){return 2+lvl('tray');}
function spotFor(t){
  if(t.k==='t')return tableSpot(G.tables[t.i]);
  if(t.k==='o')return BELL;
  if(t.k==='b')return BIN_SPOT;
  const k=G.kitchen.find(k=>k.id===t.id); return {x:k?SLOT_X[k.slot]:AISLE,y:KITCHEN_Y};
}
function enqueue(t){
  const all=(G.cur?[G.cur]:[]).concat(G.tasks);
  if(all.length>=7){sfx.no();return;}
  const last=all[all.length-1]; if(last&&last.k===t.k&&last.i===t.i&&last.id===t.id)return;
  const s=spotFor(t); t.x=s.x; t.y=s.y;
  G.tasks.push(t); sfx.tap(); renderMarkers();
}
function handsFree(){return G.hands.length<carryCap();}
function full(){fxText(G.soso.x,G.soso.y-76,'hands full!','#c0605a');sfx.no();}
function didAct(){
  if(G.clock-G.lastAct<2.4)G.combo++; else G.combo=1;
  G.lastAct=G.clock;
  if(G.combo>=2){$('comboT').textContent=`Combo ×${G.combo}`;$('comboG').setAttribute('opacity',1);G.comboShow=1.6;if(G.combo>=3)sfx.combo(G.combo);}
}
function resetCombo(){G.combo=0;$('comboG').setAttribute('opacity',0);}
function takeTrash(t){
  if(!handsFree())return false;
  t.dirty=false; t.dishG.innerHTML=''; G.hands.push({type:'trash'}); renderCarry(); refreshGlow(G.sel); sfx.pick(); return true;
}
function doTask(t){
  if(t.k==='t'){
    const tb=G.tables[t.i], p=tb.party;
    if(!p){ if(tb.dirty){ if(takeTrash(tb))didAct(); else full(); return;} return puff(); }
    if(p.state==='order'){
      if(!handsFree())return full();
      G.hands.push({type:'slip',party:p}); renderCarry();
      p.state='food'; p.hearts=Math.min(5,p.hearts+.6); sfx.order(); didAct(); return;
    }
    if(p.state==='food'){
      const h=G.hands.findIndex(h=>h.type==='food'&&h.party===p);
      if(h<0)return puff();
      G.hands.splice(h,1); renderCarry();
      p.state='eat'; p.t=rnd(4,5.2)*p.d.eat*(1-0.15*lvl('radio'))*(1+0.05*p.size); p.hearts=Math.min(5,p.hearts+.6);
      tb.dishG.innerHTML=plates(tb,p.size,p.dish); sfx.serve(); sosoMood('happy',.7); didAct(); return;
    }
    if(p.state==='check'){
      didAct();
      let tipMult=(1+0.2*lvl('tips'))*p.d.tip; if(p.fit&&p.d.fitTip)tipMult*=p.d.fitTip;
      const base=8*p.size, tip=Math.round(Math.max(0,p.hearts)*1.6*p.size*tipMult),
            bonus=p.fit?3*p.size*(p.d.fit||1):0, combo=G.combo>=3?Math.min(G.combo,12):0;
      const total=base+tip+bonus+combo; G.earned+=total; S.coins+=total; G.served+=p.size;
      fxCoin(tb.x,tb.top-10,total); sfx.coin(); sosoMood('happy',1);
      tb.party=null; tb.dirty=true; p.table=null; p.mood='happy';
      $('walkers').appendChild(p.g); p.state='leave'; setOffsets(p,'cluster');
      p.path=[[p.x,tb.top+tb.h+6],[AISLE,tb.top+tb.h+6],[AISLE,600],[-80,600]];
      if(!takeTrash(tb))dirtyMark(tb);
      updateHUD(); return;
    }
    return puff();
  }
  if(t.k==='o'){
    const slips=G.hands.filter(h=>h.type==='slip'); if(!slips.length)return puff();
    let n=0;
    for(const h of slips){ if(addKitchen(h.party)){G.hands.splice(G.hands.indexOf(h),1);n++;} }
    if(!n){fxText(BELL.x,BELL.y-80,'kitchen busy!','#c0605a');return sfx.no();}
    renderCarry(); sfx.bell(); didAct(); return;
  }
  if(t.k==='b'){
    const n=G.hands.filter(h=>h.type==='trash').length; if(!n)return puff();
    G.hands=G.hands.filter(h=>h.type!=='trash'); renderCarry(); sfx.trash(); didAct();
    fxText(BIN.x-6,BIN.y-60,'tidy!','#2f9e68'); return;
  }
  const k=G.kitchen.find(k=>k.id===t.id);
  if(!k||!k.ready)return puff();
  if(!handsFree())return full();
  G.hands.push({type:'food',party:k.party,dish:k.dish}); removeKitchen(k); renderCarry(); sfx.pick(); didAct();
}
function puff(){fxText(G.soso.x,G.soso.y-76,'?','#8a6650');}
function sosoMood(m,t){G.soso.mood=m;G.soso.moodT=t;}
function updateSoso(dt){
  const s=G.soso;
  if(s.moodT>0){s.moodT-=dt;if(s.moodT<=0)s.mood='';}
  if(s.act>0){s.act-=dt;s.moving=false;}
  else{
    if(!G.cur&&G.tasks.length){G.cur=G.tasks.shift();s.path=route(s.x,s.y,G.cur.x,G.cur.y);renderMarkers();}
    if(G.cur){moveAlong(s,dt,165*(1+0.22*lvl('shoes')));
      if(!s.path.length){const t=G.cur;G.cur=null;doTask(t);s.act=.22;renderMarkers();}}
    else s.moving=false;
  }
  s.phase+=dt*(s.moving?14:2.2);
  renderSoso();
}
function renderSoso(){
  const s=G.soso;
  let bob=s.moving?-Math.abs(Math.sin(s.phase))*4:Math.sin(s.phase)*1.2;
  if(s.mood==='happy')bob=-Math.abs(Math.sin(s.phase*3))*5;
  const rot=s.moving?Math.sin(s.phase)*7:0;
  s.g.setAttribute('transform',`translate(${s.x.toFixed(1)} ${(s.y+bob).toFixed(1)})`);
  s.img.setAttribute('transform',`rotate(${rot.toFixed(1)}) scale(${s.dir} 1)`);
  s.carry.setAttribute('transform',`translate(${(s.x+s.dir*22).toFixed(1)} ${(s.y-30+bob).toFixed(1)})`);
  const worried=!s.mood&&G.parties.some(p=>p.state!=='leave'&&p.hearts<1.5);
  const em=s.mood==='happy'?'happy':worried?'sad':'';
  if(em!==s.em){s.em=em;s.emote.innerHTML=em==='happy'?`<path d="M18 -60 l6 -5 M21 -50 l8 -1M-18 -60 l-6 -5" stroke="#ffb94a" stroke-width="3" stroke-linecap="round"/>`
     :em==='sad'?`<path d="M22 -56 q-6 9 0 13 q6 -4 0 -13z" fill="#bfe6ff" stroke="${INK}" stroke-width="1.6"/>`:'';}
  s.emote.setAttribute('transform',`translate(${s.x.toFixed(1)} ${(s.y+bob).toFixed(1)})`);

function renderCarry(){
  G.soso.carry.innerHTML=G.hands.map((h,i)=>{
    const y=-i*16;
    if(h.type==='slip')return `<g transform="translate(0 ${y})">${img(`${ART}slip.webp`,-11,-20,22,22*SZ.slip[1]/SZ.slip[0])}</g>`;
    if(h.type==='trash')return `<g transform="translate(0 ${y})">${img(`${ART}dirty.webp`,-14,-18,28,28*SZ.dirty[1]/SZ.dirty[0])}</g>`;
    return `<g transform="translate(0 ${y+6})">${dishImg(h.dish,30)}</g>`;
  }).join('');
}
function renderMarkers(){
  const all=(G.cur?[G.cur]:[]).concat(G.tasks);
  $('markers').innerHTML=all.map((t,i)=>`<g transform="translate(${t.x} ${t.y+6})"><ellipse rx="15" ry="5" fill="#ffd86b" opacity="${i?0.45:0.8}" stroke="${INK}" stroke-width="1.5"/>
     <g transform="translate(0 -6)"><circle r="7.5" fill="#fffdf6" stroke="${INK}" stroke-width="1.8"/><text y="3.6" text-anchor="middle" font-size="10" fill="${INK}">${i+1}</text></g></g>`).join('');
}

/* ---------- fx ---------- */
function fxText(x,y,txt,col,big){
  const g=el('g',{transform:`translate(${x} ${y})`},$('fx'),
    `<text text-anchor="middle" font-size="${big?20:14}" fill="${col}" stroke="#fffdf6" stroke-width="4.5" paint-order="stroke">${txt}</text>`);
  G.fxs.push({g,t:0,dur:1,x,y,kind:'rise'});
}
function fxCoin(x,y,n){
  const g=el('g',{transform:`translate(${x} ${y})`},$('fx'),
    `${img(COINI,-34,-17,24,24)}<text x="2" y="2" text-anchor="start" font-size="21" fill="#e0a21a" stroke="#fffdf6" stroke-width="5" paint-order="stroke">+${n}</text>`);
  G.fxs.push({g,t:0,dur:1.2,x,y,kind:'rise'});
}
function updateFx(dt){
  for(let i=G.fxs.length-1;i>=0;i--){const f=G.fxs[i];f.t+=dt;const p=Math.min(1,f.t/f.dur);
    f.g.setAttribute('transform',`translate(${f.x} ${f.y-p*24})`);f.g.setAttribute('opacity',(1-p*p).toFixed(2));
    if(p>=1){f.g.remove();G.fxs.splice(i,1);}}
  if(G.comboShow>0){G.comboShow-=dt;if(G.comboShow<=0)$('comboG').setAttribute('opacity',0);}
}

/* ---------- loop ---------- */
let last=0, state='menu';
function frame(now){
  const dt=Math.min(.05,(now-last)/1000||0); last=now;
  if(state==='play'&&G){
    G.clock+=dt;
    if(G.spawned<G.plan.length){G.spawnT-=dt;
      if(G.spawnT<=0){ if(spawn())G.spawnT=Math.max(4,9.5-S.day*0.5)*rnd(.7,1.2); else G.spawnT=.5; }}
    for(const p of G.parties.slice())updateParty(p,dt);
    updateKitchen(dt); updateSoso(dt); updateFx(dt);
    if(G.spawned>=G.plan.length&&G.parties.length===0&&!G.tables.some(t=>t.dirty)&&!G.hands.length){G.ending+=dt;if(G.ending>1)endDay();}
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(t=>{last=t;frame(t);});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause();});

/* ---------- input: tap & drag ---------- */
const svg=$('svg');
function toSvg(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());}
function tableAt(x,y){return G.tables.find(t=>x>t.x-t.w/2-8&&x<t.x+t.w/2+8&&y>t.top-34&&y<t.top+t.h+10);}
svg.addEventListener('pointerdown',e=>{
  const n=e.target.closest('[data-tap]'); if(!n)return;
  const kind=n.dataset.tap;
  if(kind==='pause'){if(state==='play')pause();return;}
  if(state!=='play')return;
  e.preventDefault();
  if(kind==='p'){const p=G.parties.find(p=>p.id===+n.dataset.id); if(!p)return;
    if(p.state==='line'){const pt=toSvg(e);G.drag={p,x0:pt.x,y0:pt.y,dx:p.x-pt.x,dy:p.y-pt.y,moved:false,id:e.pointerId};try{svg.setPointerCapture(e.pointerId);}catch(_){}
      refreshGlow(p); return;}
    if(p.table)enqueue({k:'t',i:p.table.i}); return;}
  if(kind==='t'){tapTable(G.tables[+n.dataset.i]);return;}
  if(kind==='bell'){enqueue({k:'o'});return;}
  if(kind==='bin'){enqueue({k:'b'});return;}
  if(kind==='k'){const k=G.kitchen.find(k=>k.id===+n.dataset.id); if(k&&k.ready)enqueue({k:'d',id:k.id}); else sfx.no();}
});
svg.addEventListener('pointermove',e=>{
  const d=G&&G.drag; if(!d||e.pointerId!==d.id)return;
  const pt=toSvg(e);
  if(!d.moved&&Math.hypot(pt.x-d.x0,pt.y-d.y0)>8){d.moved=true;d.p.path=[];$('walkers').appendChild(d.p.g);}
  if(d.moved){d.p.x=pt.x+d.dx;d.p.y=pt.y+d.dy+10;
    const t=tableAt(pt.x,pt.y); G.tables.forEach(tb=>tb.glow.setAttribute('stroke-width',tb===t?6:3));}
});
function endDrag(e){
  const d=G&&G.drag; if(!d||e.pointerId!==d.id)return;
  G.drag=null; G.tables.forEach(tb=>tb.glow.setAttribute('stroke-width',3));
  if(d.moved){const pt=toSvg(e),t=tableAt(pt.x,pt.y);
    if(t&&d.p.state==='line'){seat(d.p,t); if(d.p.state==='line'){layoutLine();refreshGlow(G.sel);} }
    else{layoutLine();refreshGlow(G.sel);}
  }else{G.sel=G.sel===d.p?null:d.p; sfx.tap(); refreshGlow(G.sel);}
}
svg.addEventListener('pointerup',endDrag);
svg.addEventListener('pointercancel',endDrag);
function tapTable(t){
  if(G.sel){seat(G.sel,t);if(G.sel)refreshGlow(G.sel);return;}
  if(!t.party&&!t.dirty){if(G.line.length){fxText(t.x,t.top-4,'drag guests here!','#8a6650');sfx.no();}return;}
  enqueue({k:'t',i:t.i});
}

/* ================= screens ================= */
const ov=$('ov'), card=$('card');
function show(html){card.innerHTML=html;ov.classList.remove('hide');card.scrollTop=0;}
function hide(){ov.classList.add('hide');}
const coinTag=`<img src="${COINI}" alt="">`;
const bigSoso=()=>`<img class="big" src="${CH('Soso')}" alt="Soso in her waiter apron">`;
const faceCard=(n,tag)=>{const d=SPECIALS[n];return `<div class="face"><img src="${CH(n)}" alt="${n}"><div>${tag?`<div class="tag">${tag}</div>`:''}<b>${n}</b><span>${d.blurb}</span><div class="chips">${traits(d).map(t=>`<i>${t}</i>`).join('')}</div></div></div>`;};
const HOW=`<div class="how">
  <div><b>1 · Seat</b>Drag a group from the bench onto a table that fits.</div>
  <div><b>2 · Order</b>Tap their table, then tap the 🔔 bell to send the slip.</div>
  <div><b>3 · Serve</b>Tap the ready dish on the counter, then their table.</div>
  <div><b>4 · Clear</b>Tap the table to collect coins and plates, then tap the bin.</div></div>
  <p>Tables seat 2, 4 or 6. A <b>perfect fit</b> earns bonus coins, and quick back-to-back jobs build a <b>combo</b>!</p>`;

function titleScreen(){
  state='menu';
  const cont=S.day>1||S.coins>0;
  show(`${bigSoso()}<h1>Soso's Diner</h1><p>Apron on, bell polished. The lunch rush is coming!</p>${HOW}
   <button class="btn" id="bGo">${cont?`Continue · Day ${S.day}`:'Start shift'}</button>
   ${cont?'<button class="btn alt" id="bNew">New game</button>':''}`);
  $('bGo').onclick=()=>{sfx.tap();dayIntro();};
  if(cont)$('bNew').onclick=()=>{if(confirm('Start over from Day 1? Your coins and power-ups will reset.')){S={day:1,coins:0,upg:{},best:S.best};save();dayIntro();}};
}
function dayIntro(){
  state='menu'; newDay();
  const d=S.day; let faces='';
  if(d===1)faces=UNLOCK.slice(0,3).map(n=>faceCard(n,'Special guest')).join('');
  else if(d+1<UNLOCK.length)faces=faceCard(UNLOCK[d+1],'New special guest!');
  else faces=`<div class="lineup">${UNLOCK.map(n=>`<img src="${CH(n)}" alt="${n}">`).join('')}</div><p>Every special guest might drop by today!</p>`;
  const big=Math.max(...G.plan);
  show(`<h2>Day ${d}</h2><p>${G.plan.length} groups · ${G.guests} guests · biggest group <b>${big}</b></p>
    <div class="wallet">${coinTag}Goal ${G.goal}</div>${faces}
    <p>Guests with a ⭐ are special guests with their own quirks.</p>
    <button class="btn" id="bOpen">Open the diner!</button>`);
  $('bOpen').onclick=()=>{sfx.seat();hide();state='play';};
}
function pause(){
  state='pause';
  show(`${bigSoso()}<h2>Tea break</h2><p>Day ${S.day} · ${G.earned} / ${G.goal} coins</p>
    <button class="btn" id="bRes">Back to work</button>
    <div class="row"><button class="btn alt" id="bSnd">Sound: ${muted?'off':'on'}</button><button class="btn alt" id="bRe">Restart day</button></div>
    <button class="btn alt" id="bHow">How to play</button>`);
  $('bRes').onclick=()=>{hide();state='play';};
  $('bSnd').onclick=()=>{muted=!muted;try{localStorage.setItem('soso-diner-mute',muted?'1':'0');}catch(e){}$('bSnd').textContent='Sound: '+(muted?'off':'on');};
  $('bRe').onclick=()=>{S.coins=Math.max(0,S.coins-G.earned);save();dayIntro();};
  $('bHow').onclick=()=>{show(`<h2>How to play</h2>${HOW}<button class="btn" id="bBack">Got it</button>`);$('bBack').onclick=pause;};
}
function endDay(){
  state='end';
  const pass=G.earned>=G.goal, stars=G.earned>=G.goal*1.6?3:G.earned>=G.goal*1.3?2:pass?1:0;
  const playedDay=S.day;
  if(pass)S.day++;
  save();
  show(`${bigSoso()}<h2>${pass?`Day ${playedDay} done!`:'So close!'}</h2>
    <div class="stars">${[1,2,3].map(i=>`<span class="${i<=stars?'on':'off'}">★</span>`).join('')}</div>
    <div class="stats"><div><b>${G.served}</b>guests fed</div><div><b>${G.lost}</b>left</div><div><b>${G.earned}</b>coins</div></div>
    <p>${pass?'What a rush! Everyone left full and happy.':`You needed ${G.goal} coins. Grab a power-up and try Day ${playedDay} again!`}</p>
    <button class="btn peach" id="bShop">Power-up shop</button>`);
  $('bShop').onclick=()=>{sfx.tap();shop();};
}
function shop(){
  state='shop';
  const cards=UPG.map(u=>{const l=lvl(u.id),max=u.cost.length,price=u.cost[l];
    const btn=l>=max?`<button class="buy max">Maxed</button>`:`<button class="buy ${S.coins<price?'poor':''}" data-buy="${u.id}">${coinTag} ${price}</button>`;
    return `<div class="up"><img src="${ART}icons/${u.id}.webp" alt=""><b>${u.name}</b><span>${u.desc}</span>
      <div class="pips">${Array.from({length:max},(_,i)=>`<i class="${i<l?'on':''}"></i>`).join('')}</div>${btn}</div>`;}).join('');
  show(`<h2>Power-ups</h2><div class="wallet">${coinTag}${S.coins}</div>
    <div class="shop">${cards}</div>
    <button class="btn" id="bNext">Start Day ${S.day}</button>`);
  card.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{
    const u=UPG.find(u=>u.id===b.dataset.buy),l=lvl(u.id),price=u.cost[l];
    if(S.coins<price)return; S.coins-=price; S.upg[u.id]=l+1; save(); sfx.buy();
    const st=card.scrollTop; shop(); card.scrollTop=st;
  });
  $('bNext').onclick=()=>{sfx.tap();dayIntro();};
}

drawScene(); drawHUD(); newDay(); titleScreen();
window.__soso={get G(){return G;},get S(){return S;},get state(){return state;}};
})();
</script>
</body>
